<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ebike-soltech</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

html,body,#app{
  height:100%;
  margin:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#eef3ef;
  color:#17372b;
  overflow:hidden;
}

#app{
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

.top{
  height:74px;
  min-height:74px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:10px 18px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
  z-index:1000;
}

.brand{
  font-size:24px;
  font-weight:900;
  line-height:1.05;
  color:#17372b;
}

.brand small{
  display:block;
  font-size:11px;
  color:#77847e;
  font-weight:600;
  margin-top:5px;
}

/* =========================
   MAPA
========================= */

#map{
  flex:1;
  min-height:0;
  width:100%;
  background:#dfe5e1;
}

.leaflet-container{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

/*
  Canvas renderer = výrazne plynulejšie
  na mobile pri posúvaní mapy.
*/
.leaflet-overlay-pane svg{
  shape-rendering:geometricPrecision;
}

.leaflet-control-attribution{
  font-size:9px;
}

/* =========================
   MAP OVERLAY
========================= */

.region-mask{
  pointer-events:none;
}

/* =========================
   STANICE
========================= */

.station-icon{
  background:transparent;
  border:none;
}

.station-pin{
  width:30px;
  height:38px;
  position:relative;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));
}

.station-pin::before{
  content:"";
  position:absolute;

  left:3px;
  top:2px;

  width:25px;
  height:25px;

  border:2.5px solid #fff;

  border-radius:50% 50% 50% 0;

  transform:rotate(-45deg);

  box-shadow:
    0 1px 3px rgba(0,0,0,.18);
}

.station-pin span{
  position:absolute;

  z-index:2;

  left:0;
  top:6px;

  width:30px;

  text-align:center;

  color:#fff;

  font-size:11px;

  font-weight:900;

  text-shadow:
    0 1px 2px rgba(0,0,0,.35);
}

/* FARBY */

.station-red::before{
  background:#ed3b3b;
}

.station-orange::before{
  background:#f39c12;
}

.station-green::before{
  background:#16a766;
}

.station-blue::before{
  background:#2878d5;
}

/* =========================
   POPUP
========================= */

.leaflet-popup-content-wrapper{
  border-radius:16px;
  padding:0;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}

.leaflet-popup-content{
  margin:0;
  width:310px !important;
}

.leaflet-popup-tip{
  box-shadow:3px 3px 8px rgba(0,0,0,.12);
}

.station-card{
  background:#fff;
}

.card-top{
  padding:14px 15px 10px;
}

.card-title{
  display:flex;
  align-items:center;
  gap:9px;
}

.card-logo{
  width:35px;
  height:35px;

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#e8f5ee;

  font-size:19px;
}

.card-title h3{
  margin:0;
  font-size:17px;
  line-height:1.1;
  color:#17372b;
}

.card-location{
  margin-top:3px;
  color:#75827c;
  font-size:11px;
}

.status{
  margin-top:12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  font-size:12px;
  font-weight:800;
}

.status-left{
  display:flex;
  align-items:center;
  gap:6px;
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
}

.status-green{
  color:#11985c;
}

.status-green .status-dot{
  background:#16a766;
}

.status-orange{
  color:#e38b00;
}

.status-orange .status-dot{
  background:#f39c12;
}

.status-red{
  color:#df3636;
}

.status-red .status-dot{
  background:#ed3b3b;
}

.status-blue{
  color:#2878d5;
}

.status-blue .status-dot{
  background:#2878d5;
}

/* CAPACITY */

.capacity{
  padding:0 15px 13px;
}

.capacity-row{
  display:flex;
  justify-content:space-between;

  font-size:12px;

  margin-bottom:6px;
}

.capacity-row strong{
  font-size:14px;
}

.capacity-bar{
  width:100%;
  height:8px;

  border-radius:20px;

  background:#e7ece9;

  overflow:hidden;
}

.capacity-bar i{
  display:block;
  height:100%;
  border-radius:20px;
}

.bar-red{
  background:#ed3b3b;
}

.bar-orange{
  background:#f39c12;
}

.bar-green{
  background:#16a766;
}

.bar-blue{
  background:#2878d5;
}

/* STATS */

.stats{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

  padding:0 15px 13px;
}

.stat{
  background:#f5f8f6;

  border-radius:10px;

  padding:9px;
}

.stat-icon{
  font-size:14px;
}

.stat b{
  display:block;

  margin-top:3px;

  font-size:14px;

  color:#17372b;
}

.stat small{
  display:block;

  margin-top:2px;

  color:#75827c;

  font-size:9px;
}

/* NAV */

.nav-button{
  display:block;

  margin:0 15px 15px;

  padding:11px;

  text-align:center;

  background:#16a766;

  color:#fff;

  border-radius:10px;

  text-decoration:none;

  font-size:12px;

  font-weight:900;

  box-shadow:0 3px 8px rgba(22,167,102,.25);
}

.nav-button:active{
  transform:scale(.98);
}

/* =========================
   LEGENDA
========================= */

.legend{
  background:#fff;

  padding:12px 14px;

  border-radius:14px;

  box-shadow:0 4px 18px rgba(0,0,0,.16);

  font-size:11px;

  line-height:20px;
}

.legend-title{
  font-weight:900;

  font-size:13px;

  margin-bottom:5px;
}

.legend-row{
  display:flex;

  align-items:center;

  gap:7px;
}

.legend-dot{
  width:10px;
  height:10px;

  border-radius:50%;
}

.dot-red{
  background:#ed3b3b;
}

.dot-orange{
  background:#f39c12;
}

.dot-green{
  background:#16a766;
}

.dot-blue{
  background:#2878d5;
}

/* =========================
   LOADING
========================= */

.loading{
  position:absolute;

  z-index:2000;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  background:#fff;

  padding:12px 17px;

  border-radius:12px;

  box-shadow:0 4px 20px rgba(0,0,0,.18);

  font-size:12px;

  font-weight:700;

  color:#17372b;
}

</style>
</head>


<body>

<div id="app">

  <div class="top">

    <div class="brand">

      ⚡ ebike-soltech

      <small>
        Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
      </small>

    </div>

  </div>

  <div id="map"></div>

  <div
    id="loading"
    class="loading"
  >
    Načítavam mapu…
  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   MAPA
========================================================= */

const map = L.map("map",{

  zoomControl:true,

  minZoom:7,

  maxZoom:18,

  preferCanvas:true

});


map.setView(
  [48.82,18.15],
  9
);


/* =========================================================
   OPENSTREETMAP
========================================================= */

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:19,

    attribution:
      "© OpenStreetMap contributors"

  }

).addTo(map);


/* =========================================================
   SKUTOČNÉ HRANICE SLOVENSKÝCH KRAJOV
=========================================================

   Dáta pochádzajú z GIS vrstvy krajov Slovenska.
   Používame GeoJSON priamo zo služby.

========================================================= */

const REGIONS_URL =
  "https://gis.scitanie.sk/server/rest/services/Hosted/hranice/FeatureServer/13/query" +
  "?where=1%3D1" +
  "&outFields=*" +
  "&returnGeometry=true" +
  "&outSR=4326" +
  "&f=geojson";


/* =========================================================
   FARBY MAPY
========================================================= */

const OTHER_REGION_COLOR = "#7c827f";

const OTHER_REGION_OPACITY = 0.72;

const TRENCIN_BORDER = "#ffffff";

const TRENCIN_FILL = "#20ad6a";


/* =========================================================
   NÁZOV TRENČIANSKEHO KRAJA
========================================================= */

function isTrenciansky(feature){

  const p = feature.properties || {};

  const text = (

    (p.nazov || "") +
    " " +
    (p.kraj || "") +
    " " +
    (p.skratka || "")

  ).toLowerCase();

  return (

    text.includes("trenč") ||
    text.includes("trenc") ||
    text.includes("tc")

  );

}


/* =========================================================
   VYTVORENIE VRSTVY KRAJOV
========================================================= */

fetch(REGIONS_URL)

.then(function(response){

  if(!response.ok){

    throw new Error(
      "Nepodarilo sa načítať hranice krajov."
    );

  }

  return response.json();

})

.then(function(data){

  /*
    Najprv vykreslíme všetky ostatné kraje
    sivou farbou.
  */

  L.geoJSON(

    data,

    {

      renderer:L.canvas(),

      interactive:false,

      style:function(feature){

        if(isTrenciansky(feature)){

          return {

            color:TRENCIN_BORDER,

            weight:2.5,

            opacity:1,

            fillColor:TRENCIN_FILL,

            fillOpacity:0

          };

        }

        return {

          color:"#ffffff",

          weight:1.5,

          opacity:.9,

          fillColor:OTHER_REGION_COLOR,

          fillOpacity:OTHER_REGION_OPACITY

        };

      }

    }

  ).addTo(map);


  /*
    Trenčiansky kraj dáme ešte raz nad ostatné
    hranice, aby ostal vizuálne čistý.
  */

  L.geoJSON(

    data,

    {

      renderer:L.canvas(),

      interactive:false,

      filter:function(feature){

        return isTrenciansky(feature);

      },

      style:function(){

        return {

          color:TRENCIN_BORDER,

          weight:3,

          opacity:1,

          fillOpacity:0

        };

      }

    }

  ).addTo(map);


  document
    .getElementById("loading")
    .style.display="none";

})

.catch(function(error){

  console.error(error);

  document
    .getElementById("loading")
    .innerText=
      "Hranice krajov sa nepodarilo načítať.";

});


/* =========================================================
   STANICE
=========================================================

   názov
   latitude
   longitude
   kapacita %
   obsadené konektory
   výkon
   počet bicyklov
========================================================= */

const stations = [

  [
    "Trenčín",
    48.8945,
    18.0440,
    78,
    3,
    "4,2 kW",
    4
  ],

  [
    "Beckov",
    48.7880,
    17.8980,
    92,
    1,
    "4,8 kW",
    7
  ],

  [
    "Nové Mesto nad Váhom",
    48.7570,
    17.8300,
    33,
    6,
    "2,1 kW",
    2
  ],

  [
    "Myjava",
    48.7580,
    17.5680,
    82,
    1,
    "4,5 kW",
    6
  ],

  [
    "Dubnica nad Váhom",
    48.9610,
    18.1670,
    64,
    5,
    "3,8 kW",
    5
  ],

  [
    "Ilava",
    49.0010,
    18.2360,
    41,
    7,
    "2,5 kW",
    3
  ],

  [
    "Púchov",
    49.1240,
    18.3250,
    0,
    8,
    "0 kW",
    0
  ],

  [
    "Považská Bystrica",
    49.1150,
    18.4490,
    58,
    4,
    "3,4 kW",
    4
  ],

  [
    "Trenčianske Teplice",
    48.9100,
    18.1680,
    56,
    4,
    "3,1 kW",
    4
  ],

  [
    "Nemšová",
    48.9670,
    18.1190,
    17,
    7,
    "0,9 kW",
    1
  ],

  [
    "Bánovce nad Bebravou",
    48.7210,
    18.2570,
    73,
    2,
    "4,0 kW",
    6
  ],

  [
    "Bojnice",
    48.7810,
    18.5850,
    0,
    8,
    "0 kW",
    0
  ],

  [
    "Partizánske",
    48.6290,
    18.3840,
    61,
    3,
    "3,6 kW",
    5
  ],

  [
    "Brezová pod Bradlom",
    48.6640,
    17.5400,
    69,
    2,
    "3,9 kW",
    5
  ],

  [
    "Čachtice",
    48.7140,
    17.7870,
    52,
    5,
    "2,9 kW",
    4
  ],

  [
    "Duchonka",
    48.6980,
    18.0700,
    0,
    8,
    "0 kW",
    0
  ],

  [
    "Manínska tiesňava",
    49.1760,
    18.4860,
    88,
    1,
    "4,7 kW",
    7
  ],

  [
    "Stará Turá",
    48.7780,
    17.6950,
    45,
    5,
    "2,6 kW",
    3
  ],

  [
    "Handlová",
    48.7270,
    18.7600,
    67,
    3,
    "3,7 kW",
    5
  ],

  [
    "Inovec",
    48.8100,
    18.0300,
    84,
    1,
    "4,5 kW",
    7
  ],

  [
    "Zelená Voda",
    48.7600,
    17.9880,
    12,
    7,
    "0,6 kW",
    1
  ],

  [
    "Skalka",
    48.8940,
    18.0090,
    0,
    8,
    "0 kW",
    0
  ],

  [
    "Lazy pod Makytou",
    49.2210,
    18.2340,
    54,
    4,
    "3,0 kW",
    4
  ],

  [
    "Kľak",
    48.9940,
    18.6630,
    72,
    2,
    "4,0 kW",
    6
  ]

];


/* =========================================================
   STAV STANICE
========================================================= */

function getStatus(pct){

  if(pct === 0){

    return {

      marker:"station-red",

      bar:"bar-red",

      statusClass:"status-red",

      text:"Úplne vybitá"

    };

  }

  if(pct <= 20){

    return {

      marker:"station-orange",

      bar:"bar-orange",

      statusClass:"status-orange",

      text:"Nízka kapacita"

    };

  }

  if(pct <= 70){

    return {

      marker:"station-green",

      bar:"bar-green",

      statusClass:"status-green",

      text:"Stanica v prevádzke"

    };

  }

  return {

    marker:"station-blue",

    bar:"bar-blue",

    statusClass:"status-blue",

    text:"Vysoká kapacita"

  };

}


/* =========================================================
   VYTVORENIE STANÍC
========================================================= */

stations.forEach(function(d){

  const name = d[0];

  const lat = d[1];

  const lon = d[2];

  const pct = d[3];

  const occupied = d[4];

  const power = d[5];

  const bikes = d[6];

  const status = getStatus(pct);


  /* -------------------------
     MARKER
  ------------------------- */

  const icon = L.divIcon({

    className:"station-icon",

    html:

      '<div class="station-pin ' +
      status.marker +
      '">' +

      '<span>⚡</span>' +

      '</div>',

    iconSize:[30,38],

    iconAnchor:[15,38]

  });


  /* -------------------------
     TEXT STAVU
  ------------------------- */

  let statusText="";

  if(pct === 0){

    statusText=
      "STANICA JE ÚPLNE VYBITÁ";

  }

  else if(pct <= 20){

    statusText=
      "NÍZKA KAPACITA";

  }

  else if(pct <= 70){

    statusText=
      "STANICA V PREVÁDZKE";

  }

  else{

    statusText=
      "VYSOKÁ KAPACITA";

  }


  /* -------------------------
     POPUP
  ------------------------- */

  const popup = `

    <div class="station-card">

      <div class="card-top">

        <div class="card-title">

          <div class="card-logo">
            ⚡
          </div>

          <div>

            <h3>
              E-BIKE POINT ${name}
            </h3>

            <div class="card-location">
              📍 ${name}, Trenčiansky kraj
            </div>

          </div>

        </div>


        <div class="status ${status.statusClass}">

          <div class="status-left">

            <span class="status-dot"></span>

            ${statusText}

          </div>

          <span>
            ${pct} %
          </span>

        </div>

      </div>


      <div class="capacity">

        <div class="capacity-row">

          <span>
            Nabitá kapacita
          </span>

          <strong>
            ${pct} %
          </strong>

        </div>


        <div class="capacity-bar">

          <i
            class="${status.bar}"
            style="width:${pct}%">
          </i>

        </div>

      </div>


      <div class="stats">


        <div class="stat">

          <span class="stat-icon">
            🚲
          </span>

          <b>
            ${bikes} / 8
          </b>

          <small>
            nabíjacie miesta
          </small>

        </div>


        <div class="stat">

          <span class="stat-icon">
            ⚡
          </span>

          <b>
            ${power}
          </b>

          <small>
            aktuálny výkon
          </small>

        </div>


        <div class="stat">

          <span class="stat-icon">
            🔌
          </span>

          <b>
            ${occupied} / 8
          </b>

          <small>
            obsadené konektory
          </small>

        </div>


        <div class="stat">

          <span class="stat-icon">
            📱
          </span>

          <b>
            1× 230 V
          </b>

          <small>
            smartfón / elektronika
          </small>

        </div>


      </div>


      <a

        class="nav-button"

        target="_blank"

        href=
        "https://mapy.com/zakladni?x=${lon}&y=${lat}&z=16"

      >

        ➤ Navigovať v Mapy.com

      </a>

    </div>

  `;


  L.marker(

    [lat,lon],

    {
      icon:icon,
      zIndexOffset:500
    }

  )

  .addTo(map)

  .bindPopup(

    popup,

    {
      maxWidth:310,
      minWidth:310,
      closeButton:true,
      autoPan:true,
      autoPanPaddingTopLeft:[20,80],
      autoPanPaddingBottomRight:[20,20]
    }

  );

});


/* =========================================================
   LEGENDA
========================================================= */

const legend = L.control({

  position:"bottomright"

});


legend.onAdd = function(){

  const div =
    L.DomUtil.create(
      "div",
      "legend"
    );


  div.innerHTML = `

    <div class="legend-title">
      Stav stanice
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-red"></span>
      0 % – vybitá
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-orange"></span>
      1–20 % – nízka
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-green"></span>
      21–70 % – dostupná
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-blue"></span>
      71–100 % – vysoká
    </div>

  `;


  return div;

};


legend.addTo(map);


/* =========================================================
   POČIATOČNÝ ZOOM
========================================================= */

const stationBounds =
  L.latLngBounds(

    stations.map(function(s){

      return [
        s[1],
        s[2]
      ];

    })

  );


map.fitBounds(

  stationBounds,

  {

    padding:[35,35],

    maxZoom:9

  }

);


/* =========================================================
   MOBILNÉ ZOBRAZENIE
========================================================= */

setTimeout(function(){

  map.invalidateSize();

},500);


window.addEventListener(
  "resize",
  function(){

    map.invalidateSize();

  }
);

</script>

</body>
</html>
