}

.mapy-logo img{

/* =========================================================

========================================================= */

.station-marker{
  width:34px;
  height:30px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;
}

/*
  Jemná pulzujúca aura.
  Používame len transform/opacity,
  aby animácia nezaťažovala mapu.
*/

.station-marker::after{
  content:"";

  position:absolute;

  width:28px;
  height:22px;

  border-radius:7px;

  border:
    2px solid
    var(--station-color);

  opacity:.30;

  animation:
    stationPulse 2.8s ease-in-out infinite;

  animation-delay:
    var(--delay);

  pointer-events:none;
}

@keyframes stationPulse{

  0%,100%{
    transform:scale(.90);
    opacity:.15;
  }

  50%{
    transform:scale(1.18);
    opacity:.38;
  }

}

.solar-panel{
  width:29px;
  height:22px;

  border-radius:6px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.24),
      rgba(0,0,0,.08)
    ),
    var(--station-color);

  border:
    2px solid #ffffff;

  box-shadow:
    0 3px 9px rgba(0,0,0,.30);

  position:relative;

  z-index:3;

  overflow:hidden;
}

/* FV články */

.solar-panel::before{
  content:"";

  position:absolute;
  inset:3px;

  border-radius:3px;

  background:
    linear-gradient(
      90deg,
      transparent 46%,
      rgba(255,255,255,.35) 47%,
      rgba(255,255,255,.35) 53%,
      transparent 54%
    ),
    linear-gradient(
      0deg,
      transparent 46%,
      rgba(255,255,255,.35) 47%,
      rgba(255,255,255,.35) 53%,
      transparent 54%
    );

  opacity:.75;
}

/* Blesk */

.solar-bolt{
  position:absolute;

  z-index:5;

  left:50%;
  top:50%;

  transform:

  font-size:14px;

  line-height:1;

  if(percent <= 20){

  }

/*
  800 Wh e-bike.

  Počítame približne s 10 % stratou pri nabíjaní

*/

const EBIKE_CAPACITY_KWH = .8;

const CHARGING_LOSS = 1.10;

const USABLE_STATION_BATTERY = .90;


function calculateFullCharges(
  batteryKwh,
  soc
){

  const available =
    batteryKwh *
    (soc / 100) *
    USABLE_STATION_BATTERY;

  const energyPerBike =
    EBIKE_CAPACITY_KWH *
    CHARGING_LOSS;

  return available / energyPerBike;
}


function formatCharges(value){

  if(value < .1){
    return "0";
  }

  if(value < 10){
    return value.toFixed(1);
  }

  return Math.round(value).toString();

function createStationIcon(
  percent,
  index
){

  const color =
    getColor(percent);

  const statusClass =
    percent <= 20
      ? "station-red"

        : percent <= 60
          ? "station-yellow"
          : "station-green";

  return L.divIcon({

    className:"",

    html:`

      <div
        class="station-marker ${statusClass}"
        style="
          --station-color:${color};
          --delay:${(index % 8) * .16}s;
        "
      >

        <div class="solar-panel">

          <span class="solar-bolt">
            ⚡
          </span>

        </div>

      </div>

    `,

    iconSize:[
      34,
      30
    ],

    iconAnchor:[
      17,
      15
    ],

    popupAnchor:[
      0,
      -12
    ]

  });
}

/* =========================================================
   POINT-IN-POLYGON
========================================================= */

function pointInRing(
  point,
  ring
){

  const x = point[0];
  const y = point[1];

  let inside = false;


  for(
    let i=0,
    j=ring.length-1;

    i<ring.length;

    j=i++
  ){

    const xi = ring[i][0];
    const yi = ring[i][1];

    const xj = ring[j][0];
    const yj = ring[j][1];


    const intersect =
      ((yi > y) !== (yj > y)) &&
      (
        x <
        (xj - xi) *
        (y - yi) /
        (yj - yi) +
        xi
      );


    if(intersect){
      inside = !inside;
    }

  }


  return inside;
}


function pointInGeometry(
  lon,
  lat,
  geometry
){

  if(
    !geometry ||
    !geometry.coordinates
  ){
    return false;
  }


  const point = [
    lon,
    lat
  ];


  if(
    geometry.type ===
    "Polygon"
  ){

    const rings =
      geometry.coordinates;


    if(
      !pointInRing(
        point,
        rings[0]
      )
    ){
      return false;
    }


    for(
      let i=1;
      i<rings.length;
      i++
    ){

      if(
        pointInRing(
          point,
          rings[i]
        )
      ){
        return false;
      }

    }


    return true;
  }


  if(
    geometry.type ===
    "MultiPolygon"
  ){

    return geometry.coordinates.some(
      polygon =>
        pointInRing(
          point,
          polygon[0]
        ) &&
        !polygon
          .slice(1)
          .some(
            ring =>
              pointInRing(
                point,
                ring
              )
          )
    );

  }


  return false;
}


/* =========================================================
   GEOMETRIA PRE MASKU
========================================================= */

function getOuterRings(
  geometry
){

  if(
    geometry.type ===
    "Polygon"
  ){

    return [
      geometry.coordinates[0]
    ];

  }


  if(
    geometry.type ===
    "MultiPolygon"
  ){

    return geometry.coordinates.map(
      polygon =>
        polygon[0]
    );

  }


  return [];
}


/* =========================================================
   NAČÍTANIE KRAJOV
========================================================= */

async function loadRegions(){

  const loading =
    document.getElementById(
      "mapLoading"
    );


  try{

    const response =
      await fetch(
        REGIONS_URL,
        {
          cache:"force-cache"
        }
      );


    if(!response.ok){

      throw new Error(
        "Nepodarilo sa načítať hranice krajov."
      );

    }


    const geojson =
      await response.json();


    /*
      Nájdeme Trenčiansky kraj.
    */

    const trenciansky =
      geojson.features.find(
        feature => {

          const p =
            feature.properties || {};

          const text =
            JSON.stringify(p)
              .toLowerCase();

          return (
            text.includes(
              "trenciansky"
            ) ||
            text.includes(
              "trenčiansky"
            ) ||
            text.includes(
              "sktc"
            )
          );

        }
      );


    if(!trenciansky){

      throw new Error(
        "Trenčiansky kraj sa nenašiel."
      );

    }


    /*
      Hranice Slovenska
      = vonkajšie prstence všetkých krajov.
    */

    const slovakiaRings = [];


    geojson.features.forEach(
      feature => {

        const rings =
          getOuterRings(
            feature.geometry
          );

        rings.forEach(
          ring =>
            slovakiaRings.push(
              ring
            )
        );

      }
    );


    /*
      Veľký obdĺžnik sveta.

      Všetko mimo Slovenska sa
      vyreže jednou maskou.

      Dôležité:
      toto NIE JE tile layer.
      Je to jediný SVG polygon,
      takže pri pohybe mapy
      nevzniká preblikovanie.
    */

    const worldRing = [

      [-179, 85],

      [179, 85],

      [179, -85],

      [-179, -85]

    ];


    const mask =
      L.polygon(

        [
          worldRing,
          ...slovakiaRings
        ],

        {
          color:"transparent",

          weight:0,

          fillColor:"#d7dcd9",

          fillOpacity:.97,

          fillRule:"evenodd",

          interactive:false
        }

      ).addTo(map);


    /*
      Všetky slovenské kraje.

      Ostatné = sivé.

      Trenčiansky = farebný.
    */

    const regionsLayer =
      L.geoJSON(
        geojson,
        {

          interactive:false,

          style:function(feature){

            const geometry =
              feature.geometry;


            const isTrencin =
              geometry ===
              trenciansky.geometry;


            return {

              color:
                isTrencin
                  ? "#ffffff"
                  : "#ffffff",

              weight:
                isTrencin
                  ? 3
                  : 1.5,

              opacity:1,

              fillColor:
                isTrencin
                  ? "#25ad70"
                  : "#cfd5d2",

              fillOpacity:
                isTrencin
                  ? .18
                  : .90
            };

          }

        }
      ).addTo(map);


    /*
      Trenčiansky kraj dáme nad sivé kraje.
    */

    L.geoJSON(
      trenciansky,
      {

        interactive:false,

        style:{

          color:"#ffffff",

          weight:3,

          opacity:1,

          fillColor:"#20ad6a",

          fillOpacity:.17
        }

      }

    ).addTo(map);


    /*
      Hranice Trenčianskeho kraja.
    */

    L.geoJSON(
      trenciansky,
      {

        interactive:false,

        style:{

          color:"#ffffff",

          weight:3,

          fillOpacity:0

        }

      }

    ).addTo(map);


    /*
      Bounds celého Slovenska.
    */

    const slovakiaBounds =
      L.geoJSON(
        geojson
      ).getBounds();


    map.setMaxBounds(
      slovakiaBounds.pad(.035)
    );


    /*
      Stanice.

      Automaticky zobrazíme iba tie,
      ktoré sú v Trenčianskom kraji.

      Tým sa zabráni tomu,
      aby sa vlajočka dostala mimo kraja.
    */

    let visibleStations = 0;


    stations.forEach(
      (station,index) => {

        const [
          name,
          lat,
          lon,
          percent
        ] = station;


        const inside =
          pointInGeometry(
            lon,
            lat,
            trenciansky.geometry
          );


        if(!inside){

          return;
        }


        visibleStations++;


        const marker =
          L.marker(
            [lat,lon],
            {
              icon:
                createStationIcon(
                  percent,
                  index
                ),

              keyboard:false
            }
          );


        marker
          .addTo(map)
          .bindPopup(

            createPopup(
              station
            ),

            {
              maxWidth:360,

              closeButton:true,

              autoPan:true,

              autoPanPaddingTopLeft:[
                20,
                90
              ],

              autoPanPaddingBottomRight:[
                20,
                30
              ]
            }

          );

      }
    );


    /*
      Legenda
    */

    const legend =
      L.control({
        position:"bottomright"
      });


    legend.onAdd =
      function(){

        const div =
          L.DomUtil.create(
            "div",
            "legend"
          );


        div.innerHTML = `

          <div class="legend-title">
            Stav stanice
          </div>

          <div class="legend-row">

            <span
              class="legend-dot legend-red">
            </span>

            0–20 % – veľmi nízka

          </div>


          <div class="legend-row">

            <span
              class="legend-dot legend-orange">
            </span>

            21–40 % – nízka

          </div>


          <div class="legend-row">

            <span
              class="legend-dot legend-yellow">
            </span>

            41–60 % – stredná

          </div>


          <div class="legend-row">

            <span
              class="legend-dot legend-green">
            </span>

            61–100 % – dostupná

          </div>

        `;


        return div;

      };


    legend.addTo(map);


    /*
      Prvé zobrazenie:
      celé Slovensko.

      Potom už maxBounds drží
      používateľa iba v Slovensku.
    */

    map.fitBounds(
      slovakiaBounds,
      {
        padding:[
          10,
          10
        ],

        maxZoom:8.4,

        animate:false
      }
    );


    /*
      Skrytie loading overlay.
    */

    setTimeout(
      function(){

        loading.classList.add(
          "hide"
        );

      },
      250
    );


    /*
      Malá ochrana proti posunu
      mimo hraníc.
    */

    map.on(
      "drag",
      function(){

        map.panInsideBounds(
          slovakiaBounds.pad(.025),
          {
            animate:false
          }
        );

      }
    );


    /*
      Pri resize iPhone/Safari.
    */

    setTimeout(
      function(){

        map.invalidateSize();

      },
      500
    );


    /*
      Počas zmeny orientácie.
    */

    window.addEventListener(
      "resize",
      function(){

        setTimeout(
          () =>
            map.invalidateSize(),
          100
        );

      }
    );


    console.log(
      "ebike-soltech:",
      visibleStations,
      "staníc v Trenčianskom kraji."
    );

  }

  catch(error){

    console.error(
      error
    );


    loading.innerHTML = `

      <div class="loading-box">

        <div class="loading-logo">
          ⚠️
        </div>

        <div class="loading-title">
          Mapu sa nepodarilo načítať
        </div>

        <div class="loading-sub">
          Skontroluj internetové pripojenie
          alebo API kľúč Mapy.com.
        </div>

      </div>

    `;

  }

}


/* =========================================================
   SPUSTENIE
========================================================= */

loadRegions();

</script>
