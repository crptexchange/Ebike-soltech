<body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAPA
========================= */

const map=L.map('map',{
center:[48.72,18.35],
zoom:8,
minZoom:7,
maxZoom:16,
zoomControl:true,
worldCopyJump:false,
closePopupOnClick:true,

/* ŽIADNY MAPY.COM API KĽÚČ */

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
noWrap:true,
updateWhenIdle:true,
keepBuffer:2,
subdomains:['a','b','c']
}
).addTo(map);


/* =========================
   VRSTVA STANÍC
========================= */

const stationPane=map.createPane('stationPane');

stationPane.style.zIndex=800;


/* =========================
   HRANICE
========================= */

const COUNTRY_URL=
'https://raw.githubusercontent.com/drakh/slovakia-gps-data/master/GeoJSON/epsg_4326/slovakia_esri_epsg_4326.geojson';

const REGIONS_URL=
'https://raw.githubusercontent.com/drakh/slovakia-gps-data/master/GeoJSON/epsg_4326/regions_epsg_4326.geojson';


/* Svet - maska */

const WORLD=[
[-85,-180],
[-85,180],
[85,180],
[85,-180],
[-85,-180]
];


/* =========================
   STAV STANICE
========================= */

function statusClass(v){

return v<=20
?'status-red'
:v<=40
?'status-orange'
:v<=60
?'status-yellow'
:'status-green'

}


function statusColor(v){

return v<=20
?'#ef3b38'
:v<=40
?'#f49a13'
:v<=60
?'#f2c400'
:'#18a968'

}


/* =========================
   OBRÁZOK STANICE
========================= */

>

/>

d="M0 190 L100 95 L170 160 L260 65 L350 155 L440 80 L600 190 V300 H0Z"

/>

/>

/* =========================
   POPUP
========================= */

function popupHTML(s){

const c=statusColor(s.energy);

></span>

</div>

/* =========================
   GEOMETRIA
========================= */

function getRings(geometry){

if(!geometry)
return [];

if(geometry.type==='Polygon')
return geometry.coordinates;

if(geometry.type==='MultiPolygon')
return geometry.coordinates.flat();

return [];

}


/* POINT IN POLYGON */

function pointInRing(pt,ring){

let x=pt[0];
let y=pt[1];

let inside=false;

for(
let i=0,j=ring.length-1;
i<ring.length;
j=i++
){

const xi=ring[i][0];
const yi=ring[i][1];

const xj=ring[j][0];
const yj=ring[j][1];

const intersect=
((yi>y)!==(yj>y)) &&
(
x<
(xj-xi)*(y-yi)/(yj-yi)+xi
);

if(intersect)
inside=!inside;

}

return inside;

}


function pointInGeometry(pt,geometry){

const polys=
geometry.type==='Polygon'
?[geometry.coordinates]
:
geometry.type==='MultiPolygon'
?geometry.coordinates
:[];

for(const poly of polys){

if(pointInRing(pt,poly[0])){

let hole=false;

for(
let i=1;
i<poly.length;
i++
){

if(pointInRing(pt,poly[i]))
hole=true;

}

if(!hole)
return true;

}

}

return false;

}


/* =========================
   BBOX
========================= */

function bboxGeometry(g){

const pts=[];

function walk(a){

if(typeof a[0]==='number')
pts.push(a);

else
a.forEach(walk);

}

walk(g.coordinates);

const xs=pts.map(p=>p[0]);
const ys=pts.map(p=>p[1]);

return [
Math.min(...xs),
Math.min(...ys),
Math.max(...xs),
Math.max(...ys)
];

}


/* =========================
   120 ROVNOMERNE ROZLOŽENÝCH STANÍC
========================= */

function chooseEvenPoints(geometry,count){

const b=bboxGeometry(geometry);

const candidates=[];

const cols=58;
const rows=58;

for(
let r=0;
r<=rows;
r++
){

const y=
b[1]+
(b[3]-b[1])*
r/rows;

for(
let c=0;
c<=cols;
c++
){

const x=
b[0]+
(b[2]-b[0])*
c/cols;

if(
pointInGeometry(
[x,y],
geometry
)
){

candidates.push([x,y]);

}

}

}


/* Ak je kandidátov málo */

if(candidates.length<=count)
return candidates;


/* prvý bod */

const chosen=[
candidates[
Math.floor(
candidates.length/2
)
]
];

const used=
new Set([
Math.floor(
candidates.length/2
)
]);


/* maximálna vzdialenosť */

while(
chosen.length<count
){

let best=-1;
let bestIdx=-1;

for(
let i=0;
i<candidates.length;
i++
){

if(
used.has(i)
)
continue;

let min=999;

for(
const q of chosen
){

const dx=
(
candidates[i][0]-q[0]
)*
Math.cos(
candidates[i][1]*
Math.PI/180
);

const dy=
candidates[i][1]-q[1];

const d=
dx*dx+dy*dy;

if(d<min)
min=d;

}

if(min>best){

best=min;
bestIdx=i;

}

}

if(bestIdx<0)
break;

used.add(bestIdx);

chosen.push(
candidates[bestIdx]
);

}

return chosen;

}


/* =========================
   VYTVORENIE STANÍC
========================= */

function addStations(regionGeometry){

const pts=
chooseEvenPoints(
regionGeometry,
120
);


/* rôzne stavy */

const energies=[
88,76,64,91,81,
94,69,73,58,86,
91,72,83,96,61
];


pts.forEach(
(p,i)=>{

const energy=
energies[
i%energies.length
];

const s={

name:
`E-BIKE POINT ${String(i+1).padStart(3,'0')}`,

area:
'Trenčiansky kraj',

lat:
p[1],

lng:
p[0],

energy:
energy

};


const icon=
L.divIcon({

className:'',

html:`

<div
class="station-icon ${statusClass(energy)}"
>
⚡
</div>

`,

iconSize:
[30,30],

iconAnchor:
[15,15],

popupAnchor:
[0,-15]

});


const marker=
L.marker(
[s.lat,s.lng],
{
icon:icon,
pane:'stationPane',
keyboard:true,
riseOnHover:true
}
);


/* dôležité:
   popup neblokuje zoom */

marker.bindPopup(
popupHTML(s),
{
maxWidth:320,
minWidth:285,
closeButton:true,
autoPan:true,
keepInView:true,
closeOnClick:true
}
);

marker.addTo(map);

}

);

}


/* =========================
   NAČÍTANIE HRANÍC
========================= */

async function init(){

try{

const [
countryRes,
regionsRes
]=await Promise.all([

fetch(
COUNTRY_URL,
{
cache:'no-store'
}
),

fetch(
REGIONS_URL,
{
cache:'no-store'
}
)

]);


if(
!countryRes.ok ||
!regionsRes.ok
){

throw new Error(
'Nepodarilo sa načítať hranice'
);

}


const country=
await countryRes.json();

const regions=
await regionsRes.json();


const countryFeature=
country.features?.[0];


const trencinFeature=
regions.features?.find(

f=>
String(
f.properties?.NM4||''
)
.toLowerCase()
===
'trenčiansky'

);


if(!countryFeature)
throw new Error(
'Slovensko sa nenašlo'
);


if(!trencinFeature)
throw new Error(
'Trenčiansky kraj sa nenašiel'
);


const countryGeom=
countryFeature.geometry;

const regionGeom=
trencinFeature.geometry;


/* =========================
   SIVÁ PLOCHA MIMO SLOVENSKA
========================= */

if(
countryGeom.type==='Polygon'
){

const holes=
countryGeom.coordinates;

L.polygon(
[
WORLD,
...holes
],
{
stroke:false,
fillColor:'#dfe4e1',
fillOpacity:0.98,
interactive:false
}
).addTo(map);

}


/* =========================
   OBVOD SLOVENSKA
========================= */

L.geoJSON(
country,
{
style:{
color:'#173d31',
weight:3,
fillOpacity:0,
interactive:false
}
}
).addTo(map);


/* =========================
   TRENČIANSKY KRAJ
========================= */

L.geoJSON(
trencinFeature,
{
style:{
color:'#0d513e',
weight:3,
fillColor:'#35b779',
fillOpacity:0.55,
interactive:false
}
}
).addTo(map);


/* =========================
   ZOOM NA SLOVENSKO
========================= */

const bounds=
L.geoJSON(country)
.getBounds();

map.fitBounds(
bounds,
{
padding:[8,8]
}
);


/* =========================
   120 STANÍC
========================= */

addStations(
regionGeom
);


/* hotovo */

document
.getElementById('loading')
.remove();


}

catch(err){

console.error(err);

const el=
document.getElementById(
'loading'
);

el.textContent=
'Nepodarilo sa načítať hranice mapy.';

el.style.color=
'#a12d2d';

}

}


init();

</script>
