* {

html,

  background: #dfe4e1;

.leaflet-top,

  z-index: 10000 !important;

  border: 0 !important;
  box-shadow: 0 4px 14px rgba(0,0,0,.18) !important;

.leaflet-control-zoom a {
  width: 46px !important;
  height: 46px !important;
  line-height: 46px !important;
  font-size: 27px !important;
  color: #111 !important;
  background: #fff !important;

}

  border-radius: 8px 8px 0 0;

.leaflet-control-zoom a:last-child {

/* ==========================================================
   GEOJSON
========================================================== */

async function loadMapData() {

  try {

    const [
      countryResponse,
      nutsResponse
    ] = await Promise.all([

      fetch(COUNTRY_URL),

      fetch(NUTS_URL)

    ]);


    const countryData =
      await countryResponse.json();

    const nutsData =
      await nutsResponse.json();


    /*
       Nájdeme Slovensko.
    */

    const slovakia =
      countryData.features.find(
        feature =>
          feature.properties &&
          (
            feature.properties.NUTS_ID === "SK" ||
            feature.properties.CNTR_CODE === "SK"
          )
      );


    if (!slovakia) {

      throw new Error(
        "Slovensko sa nenašlo"
      );

    }


    /* ======================================================
       SLOVENSKO

       Sivá priehľadná vrstva.
       Mapa pod ňou zostáva viditeľná.
    ====================================================== */

    L.geoJSON(
      slovakia,
      {

        pane:
          "countryPane",

        interactive:
          false,

        style: {

          fillColor:
            "#aeb7b2",

          fillOpacity:
            .58,

          color:
            "#123f32",

          weight:
            3.5

        }

      }
    ).addTo(map);


    /* ======================================================
       TRENČIANSKY KRAJ

       SK022
    ====================================================== */

    const trencin =
      nutsData.features.filter(
        feature =>
          feature.properties &&
          feature.properties.NUTS_ID === "SK022"
      );


    L.geoJSON(
      {
        type: "FeatureCollection",
        features: trencin
      },
      {

        pane:
          "regionPane",

        interactive:
          false,

        style: {

          fillColor:
            "#18b477",

          fillOpacity:
            .30,

          color:
            "#123f32",

          weight:
            3.5

        }

      }
    ).addTo(map);


    /* ======================================================
       OKRESY SLOVENSKA

       Jemné čiary medzi krajmi.
    ====================================================== */

    const slovakRegions =
      nutsData.features.filter(
        feature =>
          feature.properties &&
          typeof feature.properties.NUTS_ID === "string" &&
          feature.properties.NUTS_ID.startsWith("SK")
      );


    L.geoJSON(
      {
        type: "FeatureCollection",
        features: slovakRegions
      },
      {

        pane:
          "regionPane",

        interactive:
          false,

        style: {

          fillColor:
            "transparent",

          fillOpacity:
            0,

          color:
            "#65716c",

          weight:
            1.4,

          opacity:
            .75

        }

      }
    ).addTo(map);


    /* ======================================================
       VONKAJŠOK SLOVENSKA

       Tu vznikne sivá plocha.

       Slovensko sa nechá ako "diera",
       takže mapa zostane viditeľná iba v SR.
    ====================================================== */

    createOutsideMask(
      slovakia
    );


    document
      .getElementById("loading")
      .style.display = "none";


    /*
       Nastavenie po načítaní.
    */

    map.fitBounds(
      [
        [47.70,16.80],
        [49.65,22.60]
      ],
      {
        padding: [10,10]
      }
    );

  }

  catch(error) {

    console.error(error);

    document
      .getElementById("loading")
      .innerHTML =
        "Nepodarilo sa načítať hranice mapy.";

  }

}


/* ==========================================================
   OUTSIDE MASK
========================================================== */

function createOutsideMask(countryFeature) {

  /*
     Veľký obdĺžnik okolo celého sveta.
  */

  const world = [

    [-89,-179],

    [-89,179],

    [89,179],

    [89,-179]

  ];


  const holes = [];


  const geometry =
    countryFeature.geometry;


  /*
     Polygon
  */

  if (
    geometry.type === "Polygon"
  ) {

    geometry.coordinates
      .forEach(
        ring => {

          holes.push(
            ring.map(
              point => [
                point[1],
                point[0]
              ]
            )
          );

        }
      );

  }


  /*
     MultiPolygon
  */

  if (
    geometry.type === "MultiPolygon"
  ) {

    geometry.coordinates
      .forEach(
        polygon => {

          polygon.forEach(
            ring => {

              holes.push(
                ring.map(
                  point => [
                    point[1],
                    point[0]
                  ]
                )
              );

            }
          );

        }
      );

  }


  /*
     Prvá vrstva = sivá plocha.

     Otvory = Slovensko.

     Preto:
     mimo SR = sivé
     SR = mapa
  */

  L.polygon(

    [

      world,

      ...holes

    ],

    {

      pane:
        "outsidePane",

      stroke:
        false,

      fillColor:
        "#dfe4e1",

      fillOpacity:
        1,

      fillRule:
        "evenodd",

      interactive:
        false

    }

  ).addTo(map);

}
