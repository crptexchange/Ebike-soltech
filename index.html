<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ebike-soltech</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef4f1;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}


/* =========================
   HEADER
========================= */

.header {
  height: 125px;
  min-height: 125px;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 15px 28px;
  z-index: 1000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-bolt {
  font-size: 42px;
  color: #ffb900;
  line-height: 1;
}

.logo-text {
  font-size: 38px;
  font-weight: 800;
  color: #153d31;
  letter-spacing: -1.5px;
}

.subtitle {
  margin-left: 3px;
  margin-top: 4px;
  color: #718078;
  font-size: 18px;
  font-weight: 600;
}


/* =========================
   MAP
========================= */

#map {
  flex: 1;
  width: 100%;
  position: relative;
  background: #eef4f1;
}

.leaflet-container {
  background: #eef4f1;
  font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   ZOOM
========================= */

.leaflet-control-zoom {
  border: none !important;
  box-shadow: 0 4px 14px rgba(0,0,0,.15);
}

.leaflet-control-zoom a {
  width: 52px !important;
  height: 52px !important;
  line-height: 52px !important;
  font-size: 30px !important;
  color: #111 !important;
  background: white !important;
  border: none !important;
}

.leaflet-control-zoom a:first-child {
  border-radius: 8px 8px 0 0;
}

.leaflet-control-zoom a:last-child {
  border-radius: 0 0 8px 8px;
}


/* =========================
   SLOVAKIA OUTLINE
========================= */

.slovakia-outline {
  fill: #eaf1ed;
  fill-opacity: .92;
  stroke: #173d31;
  stroke-width: 3;
  stroke-opacity: .95;
}

.slovakia-label {
  background: transparent;
  border: none;
  box-shadow: none;
  color: #173d31;
  font-size: 24px;
  font-weight: 800;
  text-shadow:
    0 1px 2px white,
    1px 0 2px white,
    0 -1px 2px white,
    -1px 0 2px white;
}


/* =========================
   STATION LABEL
========================= */

.station-label {
  background: rgba(255,255,255,.96);
  border: none;
  border-radius: 7px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);

  color: #173d31;

  font-size: 12px;
  font-weight: 800;

  padding: 5px 8px;

  white-space: nowrap;
}

.station-label:before {
  display: none;
}


/* =========================
   CHARGER MARKER
========================= */

.charger-icon {
  width: 42px;
  height: 32px;
  position: relative;
  transform: translate(-50%, -50%);
}

.charger-body {
  width: 34px;
  height: 27px;

  position: absolute;
  left: 4px;
  top: 2px;

  border-radius: 7px;

  border: 3px solid white;

  box-shadow:
    0 3px 8px rgba(0,0,0,.30),
    inset 0 0 0 1px rgba(0,0,0,.15);

  display: flex;
  justify-content: center;
  align-items: center;
}

.charger-body::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 7px;

  right: -6px;
  top: 8px;

  border-radius: 1px;

  background: white;
}

.charger-bolt {
  color: white;
  font-size: 19px;
  font-weight: 900;
  line-height: 1;

  text-shadow:
    0 1px 2px rgba(0,0,0,.35);
}


/* =========================
   COLORS
========================= */

.status-red {
  background: #ef3b38;
}

.status-orange {
  background: #f49a13;
}

.status-yellow {
  background: #f2c400;
}

.status-green {
  background: #18a968;
}


/* =========================
   POPUP
========================= */

.leaflet-popup-content-wrapper {
  border-radius: 18px !important;
  box-shadow: 0 10px 30px rgba(0,0,0,.20);
}

.leaflet-popup-content {
  margin: 0 !important;
  width: 285px !important;
}

.station-popup {
  overflow: hidden;
  border-radius: 18px;
  background: white;
}

.popup-image {
  width: 100%;
  height: 135px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #173d31,
      #4e806d
    );

  color: white;
  font-size: 46px;
}

.popup-content {
  padding: 14px 16px 16px;
}

.popup-title {
  font-size: 20px;
  font-weight: 800;
  color: #173d31;
  margin-bottom: 3px;
}

.popup-location {
  color: #7a8781;
  font-size: 13px;
  margin-bottom: 14px;
}

.energy-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
}

.energy-label {
  color: #64736c;
  font-size: 13px;
}

.energy-value {
  font-weight: 800;
  color: #173d31;
}

.progress {
  height: 9px;
  background: #e9eeeb;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 14px;
}

.progress-inner {
  height: 100%;
  border-radius: 10px;
}

.popup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 14px;
}

.info-box {
  background: #f4f7f5;
  border-radius: 10px;
  padding: 9px;
}

.info-label {
  color: #7a8781;
  font-size: 11px;
}

.info-value {
  color: #173d31;
  font-size: 14px;
  font-weight: 800;
  margin-top: 3px;
}

.charge-button {
  width: 100%;
  border: none;
  background: #19a968;
  color: white;
  padding: 11px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
}


/* =========================
   LEGEND
========================= */

.legend {
  position: absolute;

  right: 18px;
  bottom: 20px;

  background: rgba(255,255,255,.97);

  border-radius: 18px;

  padding: 18px 20px;

  box-shadow: 0 8px 25px rgba(0,0,0,.18);

  z-index: 900;
}

.legend-title {
  color: #173d31;
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 12px;
}

.legend-row {
  display: flex;
  align-items: center;

  margin: 8px 0;

  color: #3f5149;
  font-size: 14px;
}

.legend-dot {
  width: 15px;
  height: 15px;

  border-radius: 50%;

  margin-right: 10px;
}

.legend-red {
  background: #ef3b38;
}

.legend-orange {
  background: #f49a13;
}

.legend-yellow {
  background: #f2c400;
}

.legend-green {
  background: #18a968;
}


/* =========================
   ERROR
========================= */

.map-error {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: min(90%, 420px);

  background: rgba(255,255,255,.96);

  padding: 25px;

  border-radius: 18px;

  text-align: center;

  box-shadow: 0 8px 30px rgba(0,0,0,.15);

  z-index: 2000;

  display: none;
}

.map-error-icon {
  font-size: 42px;
  margin-bottom: 10px;
}

.map-error-title {
  font-size: 21px;
  font-weight: 800;
  color: #173d31;
  margin-bottom: 8px;
}

.map-error-text {
  color: #74817b;
  font-size: 14px;
  line-height: 1.5;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .header {
    height: 115px;
    min-height: 115px;
    padding: 14px 20px;
  }

  .logo-bolt {
    font-size: 36px;
  }

  .logo-text {
    font-size: 29px;
  }

  .subtitle {
    font-size: 15px;
  }

  .legend {
    right: 12px;
    bottom: 15px;

    padding: 14px 16px;

    border-radius: 16px;
  }

  .legend-title {
    font-size: 17px;
  }

  .legend-row {
    font-size: 13px;
  }

  .leaflet-control-zoom {
    margin-left: 10px !important;
    margin-top: 10px !important;
  }

  .leaflet-control-zoom a {
    width: 48px !important;
    height: 48px !important;
    line-height: 48px !important;
  }

  .station-label {
    font-size: 11px;
    padding: 4px 6px;
  }

}


/* =========================
   SMALL MARKERS
========================= */

.marker-small .charger-body {
  transform: scale(.82);
}

.marker-tiny .charger-body {
  transform: scale(.68);
}

</style>

</head>


<body>

<div id="app">


<header class="header">

  <div class="logo">

    <div class="logo-bolt">
      ϟ
    </div>

    <div class="logo-text">
      ebike-soltech
    </div>

  </div>

  <div class="subtitle">
    Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
  </div>

</header>


<div id="map">


<div class="legend">

  <div class="legend-title">
    Stav stanice
  </div>

  <div class="legend-row">
    <span class="legend-dot legend-red"></span>
    0–20 % – kritická
  </div>

  <div class="legend-row">
    <span class="legend-dot legend-orange"></span>
    21–40 % – nízka
  </div>

  <div class="legend-row">
    <span class="legend-dot legend-yellow"></span>
    41–60 % – stredná
  </div>

  <div class="legend-row">
    <span class="legend-dot legend-green"></span>
    61–100 % – dobrá
  </div>

</div>


<div id="mapError" class="map-error">

  <div class="map-error-icon">
    ⚠️
  </div>

  <div class="map-error-title">
    Mapu sa nepodarilo načítať
  </div>

  <div class="map-error-text">
    API kľúč nemá oprávnenie k službe Map tiles.
  </div>

</div>


</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ==========================================================
   MAPY.COM API KEY

   SEM VLOŽ NOVÝ API KĽÚČ
========================================================== */

const MAPY_API_KEY =
"SEM_DAJ_NOVY_API_KLUC";


/* ==========================================================
   MAP SETTINGS
========================================================== */

const SLOVAKIA_CENTER = [
  48.70,
  19.70
];


/*
   DÔLEŽITÉ:

   minZoom = 5
   → môžeš ísť oveľa viac von

   maxZoom = 20
   → môžeš ísť oveľa viac dnu

   ŽIADNY maxBounds
   → mapou môžeš voľne pohybovať
*/

const map = L.map("map", {

  center: SLOVAKIA_CENTER,

  zoom: 7,

  minZoom: 5,

  maxZoom: 20,

  zoomControl: true,

  preferCanvas: true,

  inertia: true,

  inertiaDeceleration: 3000,

  wheelPxPerZoomLevel: 90,

  zoomAnimation: true,

  fadeAnimation: true,

  markerZoomAnimation: true

});


/* ==========================================================
   MAPY.COM MAP
========================================================== */

const mapyUrl =
  "https://api.mapy.com/v1/maptiles/outdoor/256/" +
  "{z}/{x}/{y}" +
  "?apikey=" +
  encodeURIComponent(MAPY_API_KEY) +
  "&lang=sk";


const mapyLayer = L.tileLayer(
  mapyUrl,
  {

    minZoom: 5,

    maxZoom: 19,

    maxNativeZoom: 19,

    tileSize: 256,

    crossOrigin: true,

    updateWhenIdle: true,

    updateWhenZooming: false,

    keepBuffer: 2,

    attribution:
      '<a href="https://mapy.com/" target="_blank">' +
      'Mapy.com' +
      '</a> © Seznam.cz a ďalší'

  }
);


mapyLayer.addTo(map);


/* ==========================================================
   ERROR
========================================================== */

let tileErrorShown = false;

mapyLayer.on(
  "tileerror",
  function() {

    if (!tileErrorShown) {

      tileErrorShown = true;

      document.getElementById(
        "mapError"
      ).style.display = "block";

    }

  }
);


mapyLayer.on(
  "tileload",
  function() {

    document.getElementById(
      "mapError"
    ).style.display = "none";

  }
);


/* ==========================================================
   SLOVAKIA OUTLINE
========================================================== */

/*
   Zjednodušený obrys Slovenska.
   Pri malom zoome slúži ako hlavný vizuálny podklad.
*/

const slovakiaCoordinates = [

  [49.4962,18.8531],
  [49.4358,18.9096],
  [49.5716,19.3207],
  [49.2171,19.8250],
  [49.4315,20.4158],
  [49.3288,20.8880],
  [49.4701,21.6078],
  [49.0857,22.5581],
  [48.8254,22.2808],
  [48.4223,22.0856],
  [48.3200,21.8722],
  [48.6239,20.8013],
  [48.5629,20.4736],
  [48.3276,20.2391],
  [48.2027,19.7695],
  [48.2666,19.6614],
  [48.1114,19.1744],
  [48.0818,18.7770],
  [47.8810,18.6965],
  [47.7584,17.8571],
  [47.8675,17.4885],
  [48.1235,16.9797],
  [48.4700,16.8800],
  [48.5970,16.9603],
  [48.8170,17.1020],
  [48.8000,17.5450],
  [48.9035,17.8865],
  [48.9965,17.9135],
  [49.0440,18.1050],
  [49.2715,18.1705],
  [49.3150,18.4000],
  [49.4950,18.5550],
  [49.4962,18.8531]

];


const slovakiaPolygon =
  L.polygon(
    slovakiaCoordinates,
    {
      className: "slovakia-outline",
      weight: 3,
      fill: true
    }
  ).addTo(map);


/* ==========================================================
   SLOVAKIA LABEL
========================================================== */

const slovakiaLabel =
  L.marker(
    [48.70,19.70],
    {
      interactive: false,
      icon:
        L.divIcon({
          className: "slovakia-label",
          html: "SLOVENSKO",
          iconSize: [180, 30],
          iconAnchor: [90, 15]
        })
    }
  ).addTo(map);


/* ==========================================================
   STATIONS
========================================================== */

const stations = [

  {
    name: "E-BIKE POINT Trenčín",
    city: "Trenčín",
    lat: 48.894,
    lng: 18.039,
    percent: 78,
    solar: 2.4,
    battery: 10
  },

  {
    name: "E-BIKE POINT Dubnica nad Váhom",
    city: "Dubnica nad Váhom",
    lat: 48.960,
    lng: 18.166,
    percent: 64,
    solar: 2.2,
    battery: 8
  },

  {
    name: "E-BIKE POINT Ilava",
    city: "Ilava",
    lat: 49.000,
    lng: 18.235,
    percent: 54,
    solar: 2.4,
    battery: 10
  },

  {
    name: "E-BIKE POINT Púchov",
    city: "Púchov",
    lat: 49.124,
    lng: 18.326,
    percent: 37,
    solar: 2.2,
    battery: 8
  },

  {
    name: "E-BIKE POINT Považská Bystrica",
    city: "Považská Bystrica",
    lat: 49.115,
    lng: 18.448,
    percent: 82,
    solar: 2.4,
    battery: 10
  },

  {
    name: "E-BIKE POINT Nové Mesto nad Váhom",
    city: "Nové Mesto nad Váhom",
    lat: 48.757,
    lng: 17.830,
    percent: 68,
    solar: 2.2,
    battery: 8
  },

  {
    name: "E-BIKE POINT Beckov",
    city: "Beckov",
    lat: 48.789,
    lng: 17.896,
    percent: 43,
    solar: 2.0,
    battery: 8
  },

  {
    name: "E-BIKE POINT Trenčianske Teplice",
    city: "Trenčianske Teplice",
    lat: 48.910,
    lng: 18.168,
    percent: 72,
    solar: 2.2,
    battery: 10
  },

  {
    name: "E-BIKE POINT Nemšová",
    city: "Nemšová",
    lat: 48.967,
    lng: 18.118,
    percent: 91,
    solar: 2.4,
    battery: 10
  },

  {
    name: "E-BIKE POINT Bojnice",
    city: "Bojnice",
    lat: 48.778,
    lng: 18.585,
    percent: 19,
    solar: 2.4,
    battery: 10
  },

  {
    name: "E-BIKE POINT Prievidza",
    city: "Prievidza",
    lat: 48.774,
    lng: 18.627,
    percent: 58,
    solar: 2.5,
    battery: 10
  },

  {
    name: "E-BIKE POINT Handlová",
    city: "Handlová",
    lat: 48.727,
    lng: 18.760,
    percent: 74,
    solar: 2.2,
    battery: 8
  },

  {
    name: "E-BIKE POINT Partizánske",
    city: "Partizánske",
    lat: 48.628,
    lng: 18.384,
    percent: 34,
    solar: 2.0,
    battery: 8
  },

  {
    name: "E-BIKE POINT Bánovce nad Bebravou",
    city: "Bánovce nad Bebravou",
    lat: 48.720,
    lng: 18.260,
    percent: 63,
    solar: 2.2,
    battery: 10
  }

];


/* ==========================================================
   STATUS
========================================================== */

function getStatusClass(percent) {

  if (percent <= 20) {
    return "status-red";
  }

  if (percent <= 40) {
    return "status-orange";
  }

  if (percent <= 60) {
    return "status-yellow";
  }

  return "status-green";

}


/* ==========================================================
   POPUP
========================================================== */

function createPopup(station) {

  const chargeCapacity =
    station.battery * 1000 * 0.90;

  const ebikeBattery = 800;

  const estimatedCharges =
    Math.floor(
      chargeCapacity /
      ebikeBattery
    );

  const availableEnergy =
    Math.round(
      chargeCapacity *
      station.percent /
      100
    );

  const currentCharges =
    Math.floor(
      availableEnergy /
      ebikeBattery
    );

  const statusClass =
    getStatusClass(
      station.percent
    );


  return `

    <div class="station-popup">

      <div class="popup-image">
        ⚡
      </div>

      <div class="popup-content">

        <div class="popup-title">
          ${station.name}
        </div>

        <div class="popup-location">
          ${station.city},
          Trenčiansky kraj
        </div>

        <div class="energy-row">

          <span class="energy-label">
            Stav energie
          </span>

          <span class="energy-value">
            ${station.percent} %
          </span>

        </div>

        <div class="progress">

          <div
            class="progress-inner ${statusClass}"
            style="width:${station.percent}%"
          ></div>

        </div>

        <div class="popup-grid">

          <div class="info-box">

            <div class="info-label">
              FVE výkon
            </div>

            <div class="info-value">
              ${station.solar} kWp
            </div>

          </div>

          <div class="info-box">

            <div class="info-label">
              Batéria
            </div>

            <div class="info-value">
              ${station.battery} kWh
            </div>

          </div>

          <div class="info-box">

            <div class="info-label">
              e-bike batéria
            </div>

            <div class="info-value">
              800 Wh
            </div>

          </div>

          <div class="info-box">

            <div class="info-label">
              Aktuálne nabitia
            </div>

            <div class="info-value">
              cca ${currentCharges}
            </div>

          </div>

        </div>

        <div
          style="
            font-size:12px;
            color:#74817b;
            line-height:1.4;
            margin-bottom:12px;
          "
        >

          Pri plnej batérii stanica dokáže uložiť
          približne ${estimatedCharges}
          plných nabití pri priemernej kapacite
          e-bike batérie 800 Wh.

        </div>

        <button class="charge-button">
          ⚡ Nabíjacia stanica
        </button>

      </div>

    </div>

  `;

}


/* ==========================================================
   MARKERS
========================================================== */

const markerLayer =
  L.layerGroup().addTo(map);


stations.forEach(
  function(station) {

    const statusClass =
      getStatusClass(
        station.percent
      );


    const icon =
      L.divIcon({

        className: "",

        html: `

          <div class="charger-icon">

            <div
              class="charger-body ${statusClass}"
            >

              <div class="charger-bolt">
                ⚡
              </div>

            </div>

          </div>

        `,

        iconSize: [
          42,
          32
        ],

        iconAnchor: [
          21,
          16
        ],

        popupAnchor: [
          0,
          -15
        ]

      });


    const marker =
      L.marker(
        [
          station.lat,
          station.lng
        ],
        {
          icon: icon,
          riseOnHover: true
        }
      );


    marker.bindPopup(
      createPopup(station),
      {
        maxWidth: 300,

        closeButton: true,

        autoPan: true,

        autoPanPaddingTopLeft:
          [20, 100],

        autoPanPaddingBottomRight:
          [20, 100]

      }
    );


    /*
       POPIS STANICE

       Pri veľkom odzoomovaní
       zostane viditeľný.
    */

    marker.bindTooltip(
      station.city,
      {
        permanent: true,
        direction: "right",
        offset: [16, 0],
        className: "station-label"
      }
    );


    marker.addTo(
      markerLayer
    );

  }
);


/* ==========================================================
   LOW ZOOM MODE
========================================================== */

/*
   Zoom 7 a vyššie:
   → normálna mapa Mapy.com

   Zoom 6 a nižšie:
   → čisté pozadie
   → iba Slovensko
   → nabíjacie stanice
   → názvy staníc
*/

function updateLowZoomMode() {

  const zoom =
    map.getZoom();


  if (zoom <= 6) {

    if (map.hasLayer(mapyLayer)) {
      map.removeLayer(mapyLayer);
    }

    slovakiaPolygon.setStyle({
      fillOpacity: .92,
      opacity: 1
    });

    slovakiaLabel.setOpacity(1);

  }

  else {

    if (!map.hasLayer(mapyLayer)) {
      mapyLayer.addTo(map);
    }

    slovakiaPolygon.setStyle({
      fillOpacity: 0,
      opacity: 0
    });

    slovakiaLabel.setOpacity(0);

  }


  /* =========================
     MARKER SIZE
  ========================= */

  const markers =
    document.querySelectorAll(
      ".charger-icon"
    );


  markers.forEach(
    function(marker) {

      marker.classList.remove(
        "marker-small"
      );

      marker.classList.remove(
        "marker-tiny"
      );


      if (zoom <= 6) {

        marker.classList.add(
          "marker-tiny"
        );

      }

      else if (zoom <= 8) {

        marker.classList.add(
          "marker-small"
        );

      }

    }
  );

}


map.on(
  "zoomend",
  updateLowZoomMode
);


/* ==========================================================
   INITIAL VIEW
========================================================== */

map.setView(
  SLOVAKIA_CENTER,
  7
);


/* ==========================================================
   MAP READY
========================================================== */

map.whenReady(
  function() {

    setTimeout(
      function() {

        map.invalidateSize();

        updateLowZoomMode();

      },
      300
    );

  }
);


/* ==========================================================
   RESIZE
========================================================== */

window.addEventListener(
  "resize",
  function() {

    map.invalidateSize();

  }
);

</script>

</body>

</html>
