<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ebike-soltech</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* ==========================================================
   GLOBAL
========================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: white;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}


/* ==========================================================
   HEADER
========================================================== */

.header {
  height: 115px;
  min-height: 115px;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 14px 24px;
  z-index: 3000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
}

.logo-bolt {
  font-size: 39px;
  color: #ffb900;
  line-height: 1;
}

.logo-text {
  font-size: 34px;
  font-weight: 800;
  color: #153d31;
  letter-spacing: -1.5px;
}

.subtitle {
  margin-left: 3px;
  margin-top: 3px;
  color: #718078;
  font-size: 16px;
  font-weight: 600;
}


/* ==========================================================
   MAP
========================================================== */

#map {
  flex: 1;
  width: 100%;
  position: relative;
  background: #dfe4e1;
}

.leaflet-container {
  background: #dfe4e1;
  font-family: Arial, Helvetica, sans-serif;
}


/* ==========================================================
   MAP PANES
========================================================== */

/*
   Poradie:

   200 - mapa
   350 - stmavenie mimo Slovenska
   450 - sivé kraje
   500 - hranice krajov
   600 - markery
   700 - popup/controls
*/

.leaflet-map-pane {
  z-index: auto;
}


/* ==========================================================
   OUTSIDE SLOVAKIA DIMMER
========================================================== */

.slovakia-dimmer-pane {
  z-index: 350;
  pointer-events: none;
}

.slovakia-dimmer-svg {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.slovakia-dimmer-rect {
  fill: rgba(30, 38, 35, 0.68);
}


/* ==========================================================
   REGIONS
========================================================== */

.regions-pane {
  z-index: 450;
  pointer-events: none;
}

.region-other {
  fill: #7f8884;
  fill-opacity: .58;

  color: #68736e;
  weight: 1.5;
  opacity: .75;
}

.region-trencin {
  fill: transparent;

  color: #173d31;
  weight: 3;
  opacity: 1;
}


/* ==========================================================
   SLOVAKIA BORDER
========================================================== */

.slovakia-border {
  fill: none;

  color: #173d31;

  weight: 3;

  opacity: .95;

  pointer-events: none;
}


/* ==========================================================
   ZOOM
========================================================== */

.leaflet-control-zoom {
  border: none !important;

  box-shadow:
    0 4px 14px rgba(0,0,0,.18);

  z-index: 2500 !important;
}

.leaflet-control-zoom a {
  width: 48px !important;
  height: 48px !important;
  line-height: 48px !important;

  font-size: 28px !important;

  color: #111 !important;
  background: white !important;

  border: none !important;
}

.leaflet-control-zoom a:first-child {
  border-radius: 8px 8px 0 0;
}

.leaflet-control-zoom a:last-child {
  border-radius: 0 0 8px 8px;
}


/* ==========================================================
   CHARGER MARKER
========================================================== */

.charger-wrapper {
  position: relative;

  width: 42px;
  height: 32px;

  transform: translate(-50%, -50%);

  transition:
    transform .18s ease;
}

.charger-body {
  width: 34px;
  height: 27px;

  position: absolute;

  left: 4px;
  top: 2px;

  border-radius: 7px;

  border: 3px solid white;

  box-shadow:
    0 3px 8px rgba(0,0,0,.30),
    inset 0 0 0 1px rgba(0,0,0,.15);

  display: flex;

  justify-content: center;
  align-items: center;
}

.charger-body::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 7px;

  right: -6px;
  top: 8px;

  border-radius: 1px;

  background: white;
}

.charger-bolt {
  color: white;

  font-size: 19px;

  font-weight: 900;

  line-height: 1;

  text-shadow:
    0 1px 2px rgba(0,0,0,.35);
}


/* ==========================================================
   STATUS COLORS
========================================================== */

.status-red {
  background: #ef3b38;
}

.status-orange {
  background: #f49a13;
}

.status-yellow {
  background: #f2c400;
}

.status-green {
  background: #18a968;
}


/* ==========================================================
   CLUSTER
========================================================== */

.station-cluster {
  width: 46px;
  height: 46px;

  border-radius: 50%;

  background: #173d31;

  border: 4px solid white;

  box-shadow:
    0 4px 12px rgba(0,0,0,.30);

  display: flex;

  align-items: center;
  justify-content: center;

  color: white;

  font-size: 15px;
  font-weight: 800;
}

.station-cluster::before {
  content: "⚡";

  font-size: 14px;

  margin-right: 2px;
}


/* ==========================================================
   STATION LABEL
========================================================== */

.station-label {
  position: absolute;

  left: 46px;
  top: -5px;

  white-space: nowrap;

  background: rgba(255,255,255,.96);

  color: #173d31;

  font-size: 12px;

  font-weight: 800;

  padding: 6px 8px;

  border-radius: 8px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.16);

  border: 1px solid rgba(23,61,49,.08);

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .18s ease;
}

.station-label.visible {
  opacity: 1;

  visibility: visible;
}


/* ==========================================================
   POPUP
========================================================== */

.leaflet-popup-content-wrapper {
  border-radius: 18px !important;

  box-shadow:
    0 10px 30px rgba(0,0,0,.20);
}

.leaflet-popup-content {
  margin: 0 !important;

  width: 285px !important;
}

.station-popup {
  overflow: hidden;

  border-radius: 18px;

  background: white;
}

.popup-image {
  width: 100%;

  height: 135px;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #173d31,
      #4e806d
    );

  color: white;

  font-size: 46px;
}

.popup-content {
  padding: 14px 16px 16px;
}

.popup-title {
  font-size: 20px;

  font-weight: 800;

  color: #173d31;

  margin-bottom: 3px;
}

.popup-location {
  color: #7a8781;

  font-size: 13px;

  margin-bottom: 14px;
}

.energy-row {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 9px;
}

.energy-label {
  color: #64736c;

  font-size: 13px;
}

.energy-value {
  font-weight: 800;

  color: #173d31;
}

.progress {
  height: 9px;

  background: #e9eeeb;

  border-radius: 10px;

  overflow: hidden;

  margin-bottom: 14px;
}

.progress-inner {
  height: 100%;

  border-radius: 10px;
}

.popup-grid {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 9px;

  margin-bottom: 14px;
}

.info-box {
  background: #f4f7f5;

  border-radius: 10px;

  padding: 9px;
}

.info-label {
  color: #7a8781;

  font-size: 11px;
}

.info-value {
  color: #173d31;

  font-size: 14px;

  font-weight: 800;

  margin-top: 3px;
}

.charge-button {
  width: 100%;

  border: none;

  background: #19a968;

  color: white;

  padding: 11px;

  border-radius: 10px;

  font-size: 14px;

  font-weight: 800;
}


/* ==========================================================
   LEGEND - COMPACT
========================================================== */

.legend {
  position: absolute;

  right: 10px;
  bottom: 12px;

  background: rgba(255,255,255,.94);

  border-radius: 13px;

  padding: 9px 11px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.16);

  z-index: 2000;

  min-width: 150px;
}

.legend-title {
  color: #173d31;

  font-size: 14px;

  font-weight: 800;

  margin-bottom: 7px;
}

.legend-row {
  display: flex;

  align-items: center;

  margin: 5px 0;

  color: #3f5149;

  font-size: 11px;

  line-height: 1.2;
}

.legend-dot {
  width: 10px;
  height: 10px;

  border-radius: 50%;

  margin-right: 7px;

  flex-shrink: 0;
}

.legend-red {
  background: #ef3b38;
}

.legend-orange {
  background: #f49a13;
}

.legend-yellow {
  background: #f2c400;
}

.legend-green {
  background: #18a968;
}


/* ==========================================================
   ERROR
========================================================== */

.map-error {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: min(90%, 420px);

  background:
    rgba(255,255,255,.97);

  padding: 25px;

  border-radius: 18px;

  text-align: center;

  box-shadow:
    0 8px 30px rgba(0,0,0,.15);

  z-index: 5000;

  display: none;
}

.map-error-icon {
  font-size: 42px;

  margin-bottom: 10px;
}

.map-error-title {
  font-size: 21px;

  font-weight: 800;

  color: #173d31;

  margin-bottom: 8px;
}

.map-error-text {
  color: #74817b;

  font-size: 14px;

  line-height: 1.5;
}


/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 600px) {

  .header {
    height: 108px;
    min-height: 108px;

    padding:
      12px 18px;
  }

  .logo-bolt {
    font-size: 34px;
  }

  .logo-text {
    font-size: 28px;
  }

  .subtitle {
    font-size: 14px;

    line-height: 1.25;
  }

  .legend {
    right: 9px;
    bottom: 10px;

    padding:
      8px 10px;

    min-width: 143px;
  }

  .legend-title {
    font-size: 13px;
  }

  .legend-row {
    font-size: 10px;

    margin: 4px 0;
  }

  .legend-dot {
    width: 9px;
    height: 9px;

    margin-right: 6px;
  }

  .leaflet-control-zoom {
    margin-left: 8px !important;
    margin-top: 8px !important;
  }

  .leaflet-control-zoom a {
    width: 46px !important;
    height: 46px !important;
    line-height: 46px !important;
  }

}


/* ==========================================================
   NO MAP FLICKER
========================================================== */

.leaflet-tile {
  image-rendering: auto;
}

.leaflet-fade-anim .leaflet-tile {
  transition: opacity .15s linear;
}

</style>

</head>


<body>

<div id="app">


<header class="header">

  <div class="logo">

    <div class="logo-bolt">
      ϟ
    </div>

    <div class="logo-text">
      ebike-soltech
    </div>

  </div>

  <div class="subtitle">
    Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
  </div>

</header>


<div id="map">

  <div class="legend">

    <div class="legend-title">
      Stav stanice
    </div>

    <div class="legend-row">
      <span class="legend-dot legend-red"></span>
      0–20 % – kritická
    </div>

    <div class="legend-row">
      <span class="legend-dot legend-orange"></span>
      21–40 % – nízka
    </div>

    <div class="legend-row">
      <span class="legend-dot legend-yellow"></span>
      41–60 % – stredná
    </div>

    <div class="legend-row">
      <span class="legend-dot legend-green"></span>
      61–100 % – dobrá
    </div>

  </div>


  <div id="mapError" class="map-error">

    <div class="map-error-icon">
      ⚠️
    </div>

    <div class="map-error-title">
      Mapu sa nepodarilo načítať
    </div>

    <div class="map-error-text">
      Skontroluj oprávnenie API kľúča pre Map Tiles.
    </div>

  </div>

</div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ==========================================================
   MAPY.COM API KEY
========================================================== */

const MAPY_API_KEY =
"Ld1wDiRmzkSKYG09mz9BiWl-ti-D2b_eEGv4i9eoBe0";


/* ==========================================================
   CONSTANTS
========================================================== */

const SLOVAKIA_CENTER = [
  48.70,
  19.70
];

const INITIAL_ZOOM = 7.6;


/*
   Toto je zámerne iba Slovensko
   + malý priestor okolo hranice.
*/

const SLOVAKIA_BOUNDS = [
  [47.35, 16.70],
  [49.75, 22.75]
];


/* ==========================================================
   MAP
========================================================== */

const map =
  L.map(
    "map",
    {

      center:
        SLOVAKIA_CENTER,

      zoom:
        INITIAL_ZOOM,

      minZoom:
        7.5,

      maxZoom:
        19,

      maxBounds:
        SLOVAKIA_BOUNDS,

      maxBoundsViscosity:
        1.0,

      zoomControl:
        true,

      preferCanvas:
        true,

      inertia:
        true,

      inertiaDeceleration:
        3000,

      wheelPxPerZoomLevel:
        80,

      zoomAnimation:
        true,

      fadeAnimation:
        false,

      markerZoomAnimation:
        true,

      worldCopyJump:
        false

    }
  );


/* ==========================================================
   MAPY.COM OUTDOOR
========================================================== */

const mapyUrl =
  "https://api.mapy.com/v1/maptiles/outdoor/256/" +
  "{z}/{x}/{y}" +
  "?apikey=" +
  encodeURIComponent(MAPY_API_KEY) +
  "&lang=sk";


const mapyLayer =
  L.tileLayer(
    mapyUrl,
    {

      minZoom:
        0,

      maxZoom:
        19,

      tileSize:
        256,

      noWrap:
        true,

      updateWhenIdle:
        true,

      updateWhenZooming:
        false,

      keepBuffer:
        2,

      attribution:
        '<a href="https://mapy.com/" target="_blank">' +
        'Mapy.com' +
        '</a> © Seznam.cz a ďalší'

    }
  );


mapyLayer.addTo(map);


/* ==========================================================
   MAP ERROR
========================================================== */

let tileErrorShown =
  false;


mapyLayer.on(
  "tileerror",
  function() {

    if (!tileErrorShown) {

      tileErrorShown =
        true;

      document.getElementById(
        "mapError"
      ).style.display =
        "block";

    }

  }
);


mapyLayer.on(
  "tileload",
  function() {

    document.getElementById(
      "mapError"
    ).style.display =
      "none";

  }
);


/* ==========================================================
   CUSTOM DIMMER PANE
========================================================== */

map.createPane(
  "slovakiaDimmerPane"
);

map.getPane(
  "slovakiaDimmerPane"
).classList.add(
  "slovakia-dimmer-pane"
);


/* ==========================================================
   REGION PANE
========================================================== */

map.createPane(
  "regionsPane"
);

map.getPane(
  "regionsPane"
).classList.add(
  "regions-pane"
);


/* ==========================================================
   SVG DIMMER
========================================================== */

let dimmerSvg =
  null;

let dimmerMask =
  null;

let dimmerRect =
  null;


/*
   Vytvorí SVG overlay.

   Biela maska = stmavenie
   Čierna maska = priehľadné miesto

   Preto:
   mimo Slovenska = tmavé
   Slovensko = normálna mapa
*/

function createDimmerSVG() {

  const pane =
    map.getPane(
      "slovakiaDimmerPane"
    );


  if (!pane) {
    return;
  }


  pane.innerHTML = "";


  dimmerSvg =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );


  dimmerSvg.setAttribute(
    "class",
    "slovakia-dimmer-svg"
  );


  dimmerSvg.setAttribute(
    "width",
    "100%"
  );


  dimmerSvg.setAttribute(
    "height",
    "100%"
  );


  const defs =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "defs"
    );


  const mask =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "mask"
    );


  mask.setAttribute(
    "id",
    "slovakiaMask"
  );


  mask.setAttribute(
    "maskUnits",
    "userSpaceOnUse"
  );


  const rect =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );


  rect.setAttribute(
    "x",
    "0"
  );

  rect.setAttribute(
    "y",
    "0"
  );

  rect.setAttribute(
    "width",
    "100%"
  );

  rect.setAttribute(
    "height",
    "100%"
  );

  rect.setAttribute(
    "fill",
    "white"
  );


  mask.appendChild(
    rect
  );


  const slovakiaPath =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );


  slovakiaPath.setAttribute(
    "fill",
    "black"
  );


  slovakiaPath.setAttribute(
    "fill-rule",
    "evenodd"
  );


  slovakiaPath.setAttribute(
    "clip-rule",
    "evenodd"
  );


  mask.appendChild(
    slovakiaPath
  );


  defs.appendChild(
    mask
  );


  dimmerSvg.appendChild(
    defs
  );


  dimmerRect =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );


  dimmerRect.setAttribute(
    "class",
    "slovakia-dimmer-rect"
  );


  dimmerRect.setAttribute(
    "x",
    "0"
  );

  dimmerRect.setAttribute(
    "y",
    "0"
  );

  dimmerRect.setAttribute(
    "width",
    "100%"
  );

  dimmerRect.setAttribute(
    "height",
    "100%"
  );


  dimmerRect.setAttribute(
    "mask",
    "url(#slovakiaMask)"
  );


  dimmerSvg.appendChild(
    dimmerRect
  );


  pane.appendChild(
    dimmerSvg
  );


  dimmerMask =
    slovakiaPath;

}


/* ==========================================================
   GEOJSON
========================================================== */

const REGIONS_URL =
"https://simplemaps.com/static/svg/country/sk/admin1/sk.json";


let regionsGeoJSON =
  null;

let regionsLayer =
  null;

let slovakiaBoundary =
  null;


/* ==========================================================
   GEOJSON HELPERS
========================================================== */

function coordinateRingToSvgPath(
  ring
) {

  if (
    !ring ||
    ring.length < 2
  ) {

    return "";

  }


  let d = "";


  ring.forEach(
    function(point, index) {

      const lat =
        point[1];

      const lng =
        point[0];


      const pixel =
        map.latLngToContainerPoint(
          [
            lat,
            lng
          ]
        );


      if (index === 0) {

        d +=
          "M " +
          pixel.x +
          " " +
          pixel.y +
          " ";

      }
      else {

        d +=
          "L " +
          pixel.x +
          " " +
          pixel.y +
          " ";

      }

    }
  );


  d += "Z ";

  return d;

}


/* ==========================================================
   GEOJSON GEOMETRY TO SVG PATH
========================================================== */

function geometryToSvgPath(
  geometry
) {

  if (!geometry) {
    return "";
  }


  let d = "";


  if (
    geometry.type ===
    "Polygon"
  ) {

    geometry.coordinates
      .forEach(
        ring => {

          d +=
            coordinateRingToSvgPath(
              ring
            );

        }
      );

  }


  if (
    geometry.type ===
    "MultiPolygon"
  ) {

    geometry.coordinates
      .forEach(
        polygon => {

          polygon.forEach(
            ring => {

              d +=
                coordinateRingToSvgPath(
                  ring
                );

            }
          );

        }
      );

  }


  return d;

}


/* ==========================================================
   UPDATE DIMMER
========================================================== */

function updateDimmer() {

  if (
    !dimmerMask ||
    !regionsGeoJSON
  ) {

    return;

  }


  const slovakiaFeatures =
    regionsGeoJSON.features;


  /*
     Všetkých 8 krajov tvorí Slovensko.
     Cesty hraníc medzi krajmi nechceme
     používať ako masku jednotlivo.

     Preto spojíme všetky geometrie
     do jedného SVG path.
  */

  let path = "";


  slovakiaFeatures.forEach(
    feature => {

      path +=
        geometryToSvgPath(
          feature.geometry
        );

    }
  );


  dimmerMask.setAttribute(
    "d",
    path
  );


  const size =
    map.getSize();


  dimmerSvg.setAttribute(
    "viewBox",
    `0 0 ${size.x} ${size.y}`
  );

}


/* ==========================================================
   LOAD REGIONS
========================================================== */

fetch(
  REGIONS_URL
)

.then(
  response => {

    if (!response.ok) {

      throw new Error(
        "Regions GeoJSON error"
      );

    }

    return response.json();

  }
)

.then(
  data => {

    regionsGeoJSON =
      data;


    createDimmerSVG();


    /*
       Ostatné kraje sivé.
       Trenčiansky kraj bez sivej výplne.
    */

    regionsLayer =
      L.geoJSON(
        data,
        {

          pane:
            "regionsPane",

          style:
            function(feature) {

              if (
                feature.properties &&
                feature.properties.id ===
                "SKTC"
              ) {

                return {

                  fillColor:
                    "transparent",

                  fillOpacity:
                    0,

                  color:
                    "#173d31",

                  weight:
                    3,

                  opacity:
                    1

                };

              }


              return {

                fillColor:
                  "#858e8a",

                fillOpacity:
                  .58,

                color:
                  "#69736e",

                weight:
                  1.5,

                opacity:
                  .75

              };

            },

          interactive:
            false

        }
      );


    regionsLayer.addTo(
      map
    );


    /*

    */

    slovakiaBoundary =
      L.geoJSON(
        data,
        {

          pane:
            "regionsPane",

          style:
            {

              fill:
                false,

              color:
                "#173d31",

              weight:
                2.5,

              opacity:
                .95

            },

          interactive:
            false

        }
      );


    slovakiaBoundary.addTo(
      map
    );


    updateDimmer();

  }
)

.catch(
  error => {

    console.error(
      "GeoJSON error:",
      error
    );

  }
);

/* ==========================================================

========================================================== */

function getStatusClass(
  percent
) {

  if (
    percent <= 20
  ) {

    return "status-red";

  }

  if (
    percent <= 40
  ) {

    return "status-orange";

  }

  if (
    percent <= 60
  ) {

    return "status-yellow";

  }

  return "status-green";

}

/* ==========================================================

========================================================== */

function createStationMarker(
  station
) {

  const statusClass =
    getStatusClass(
      station.percent
    );


  const icon =
    L.divIcon({

      className:
        "",

      html: `

        <div class="charger-wrapper">

          <div
            class="charger-body ${statusClass}"
          >

            <div class="charger-bolt">
              ⚡
            </div>

          </div>

          <div
            class="station-label"
            data-station="${station.name}"
          >
            ${station.city}
          </div>

        </div>

      `,

      iconSize:
        [42, 32],

      iconAnchor:
        [21, 16],

      popupAnchor:
        [0, -15]

    });


  const marker =
    L.marker(
      [
        station.lat,
        station.lng
      ],
      {

        icon:
          icon,

        riseOnHover:
          true,

        zIndexOffset:
          1000

      }
    );


  marker.bindPopup(
    createPopup(
      station

    {

      maxWidth:
        300,

      closeButton:
        true,

      autoPan:
        true,

      autoPanPaddingTopLeft:
        [20, 100],

      autoPanPaddingBottomRight:
        [20, 100]

    }
  );


  marker.stationData =
    station;


  return marker;

}


/* ==========================================================
   CREATE CLUSTER
========================================================== */

function createClusterMarker(
  items,
  latlng
) {

  const icon =
    L.divIcon({

      className:
        "",

      html: `

        <div class="station-cluster">
          ${items.length}
        </div>

      `,

      iconSize:
        [46, 46],

      iconAnchor:
        [23, 23]

    });


  const marker =
    L.marker(
      latlng,
      {

        icon:
          icon,

        zIndexOffset:
          1200

      }
    );


  marker.on(
    "click",
    function() {

      const bounds =
        L.latLngBounds(
          items.map(
            station => [
              station.lat,
              station.lng
            ]
          )
        );


      map.fitBounds(
        bounds,
        {

          padding:
            [80, 80],

          maxZoom:
            10

        }
      );

    }
  );


  return marker;

}


/* ==========================================================
   GRID CLUSTERING
========================================================== */

function renderMarkers() {

  markerLayer.clearLayers();

  clusterLayer.clearLayers();


  const zoom =
    map.getZoom();


  if (
    zoom >= 7
  ) {

    stations.forEach(
      station => {

        markerLayer.addLayer(
          createStationMarker(
            station
          )
        );

      }
    );

    return;

  }


  const gridSize =
    zoom <= 3
      ? 100
      : zoom <= 4
        ? 90
        : zoom <= 5
          ? 80
          : 70;


  const groups =
    new Map();


  stations.forEach(
    station => {

      const point =
        map.project(
          [
            station.lat,
            station.lng
          ],
          zoom
        );


      const key =
        Math.floor(
          point.x /
          gridSize
        ) +
        "_" +
        Math.floor(
          point.y /
          gridSize
        );


      if (
        !groups.has(key)
      ) {

        groups.set(
          key,
          []
        );

      }


      groups
        .get(key)
        .push(
          station
        );

    }
  );


  groups.forEach(
    items => {

      if (
        items.length === 1
      ) {

        clusterLayer.addLayer(
          createStationMarker(
            items[0]
          )
        );

        return;

      }


      const lat =
        items.reduce(
          (
            sum,
            station
          ) =>
            sum +
            station.lat,
          0
        ) /
        items.length;


      const lng =
        items.reduce(
          (
            sum,
            station
          ) =>
            sum +
            station.lng,
          0
        ) /
        items.length;


      clusterLayer.addLayer(
        createClusterMarker(
          items,
          [
            lat,
            lng
          ]
        )
      );

    }
  );

}


/* ==========================================================
   MARKER SCALING
========================================================== */

function updateMarkerSize() {

  const zoom =
    map.getZoom();


  let scale =
    1;


  if (
    zoom <= 7
  ) {

    scale =
      .84;

  }
  else if (
    zoom <= 8
  ) {

    scale =
      .92;

  }


  document
    .querySelectorAll(
      ".charger-wrapper"
    )
    .forEach(
      element => {

        element.style.transform =
          `translate(-50%, -50%) scale(${scale})`;

      }
    );

}


/* ==========================================================
   LABEL VISIBILITY
========================================================== */

function updateLabels() {

  const zoom =
    map.getZoom();


  const labels =
    document.querySelectorAll(
      ".station-label"
    );


  labels.forEach(
    label => {

      label.classList.remove(
        "visible"
      );

      label.style.display =
        "";

    }
  );


  if (
    zoom < 8
  ) {

    return;

  }


  labels.forEach(
    label => {

      label.classList.add(
        "visible"
      );

    }
  );

}


/* ==========================================================
   LABEL COLLISION
========================================================== */

function avoidLabelCollisions() {

  const zoom =
    map.getZoom();


  if (
    zoom < 8
  ) {

    return;

  }


  const labels =
    Array.from(
      document.querySelectorAll(
        ".station-label.visible"
      )
    );


  const visibleRects =
    [];


  labels.forEach(
    label => {

      label.style.display =
        "block";

    }
  );


  labels.forEach(
    label => {

      const rect =
        label.getBoundingClientRect();


      let collision =
        false;


      for (
        const existingRect
        of visibleRects
      ) {

        const overlaps =
          !(
            rect.right <
              existingRect.left ||
            rect.left >
              existingRect.right ||
            rect.bottom <
              existingRect.top ||
            rect.top >
              existingRect.bottom
          );


        if (
          overlaps
        ) {

          collision =
            true;

          break;

        }

      }


      if (
        collision
      ) {

        label.style.display =
          "none";

      }
      else {

        visibleRects.push(
          rect
        );

      }

    }
  );

}


/* ==========================================================
   UPDATE EVERYTHING
========================================================== */

function updateMapUI() {

  renderMarkers();

  updateMarkerSize();

  updateLabels();


  updateDimmer();


  requestAnimationFrame(
    function() {

      avoidLabelCollisions();

    }
  );

}


/* ==========================================================
   MAP EVENTS
========================================================== */

  function() {

    updateMapUI();

  }

       Počas pohybu aktualizujeme masku,
       aby sa nikdy nerozbila pri posúvaní.
    */

    updateDimmer();

map.on(

  function() {

    updateDimmer();

    updateMapUI();

/* ==========================================================

map.whenReady(

/* ==========================================================

========================================================== */

window.addEventListener(

  function() {

    map.invalidateSize();

    updateMapUI();

  }
);
