<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ebike-soltech</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#app{display:flex;flex-direction:column;background:#fff}
.header{height:112px;min-height:112px;background:#fff;padding:13px 22px;display:flex;flex-direction:column;justify-content:center;z-index:3000}
.logo{display:flex;align-items:center;gap:9px}.logo-bolt{font-size:38px;color:#ffb900;line-height:1}.logo-text{font-size:32px;font-weight:800;color:#153d31;letter-spacing:-1.4px}
.subtitle{margin-left:3px;margin-top:4px;color:#718078;font-size:15px;font-weight:600}
#map{position:relative;flex:1;min-height:0;background:#dfe4e1}
.leaflet-container{background:#dfe4e1;font-family:Arial,Helvetica,sans-serif}
.leaflet-top,.leaflet-bottom{z-index:10000!important}
.leaflet-control-zoom{border:0!important;box-shadow:0 4px 14px rgba(0,0,0,.18)!important}
.leaflet-control-zoom a{width:46px!important;height:46px!important;line-height:46px!important;font-size:27px!important;color:#111!important;background:#fff!important;border:0!important}
.leaflet-control-zoom a:first-child{border-radius:8px 8px 0 0}.leaflet-control-zoom a:last-child{border-radius:0 0 8px 8px}

.outside-pane{z-index:350;pointer-events:none}
.outside-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.outside-fill{fill:#dfe4e1;fill-opacity:1;fill-rule:evenodd}

.regions-pane{z-index:450;pointer-events:none}
.region{stroke:#65716c;stroke-width:1.6;fill:#858e8a;fill-opacity:.62}
.region-trencin{fill:#19a968;fill-opacity:.16;stroke:#173d31;stroke-width:3}
.country-border{fill:none;stroke:#173d31;stroke-width:3;opacity:.98;pointer-events:none}

.station-icon{width:30px;height:30px;border-radius:9px;border:3px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.30);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:900;line-height:1}
.station-icon.status-red{background:#ef3b38}.station-icon.status-orange{background:#f49a13}.station-icon.status-yellow{background:#f2c400}.station-icon.status-green{background:#18a968}

.leaflet-popup-content-wrapper{border-radius:18px!important;box-shadow:0 10px 30px rgba(0,0,0,.22)!important}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-tip{box-shadow:0 3px 8px rgba(0,0,0,.08)}
.station-popup{width:300px;max-height:min(72vh,610px);overflow-y:auto;overflow-x:hidden;border-radius:18px;background:#fff}
.popup-map{display:block;width:100%;height:145px;object-fit:cover;background:#e7ece9}
.popup-content{padding:14px 15px 15px}
.popup-title{font-size:19px;font-weight:800;color:#173d31;margin-bottom:3px;line-height:1.12}
.popup-location{font-size:12px;color:#7a8781;margin-bottom:10px}
.planned-badge{display:inline-block;background:#eef7f2;color:#18764e;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;margin-bottom:10px}
.status-box{display:flex;align-items:center;justify-content:space-between;background:#f4f7f5;border-radius:11px;padding:9px 10px;margin-bottom:10px}
.status-left{display:flex;align-items:center;gap:7px;color:#64736c;font-size:12px;font-weight:700}
.status-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}.status-red{background:#ef3b38}.status-orange{background:#f49a13}.status-yellow{background:#f2c400}.status-green{background:#18a968}
.status-number{font-size:15px;font-weight:900;color:#173d31}
.progress{height:8px;background:#e9eeeb;border-radius:10px;overflow:hidden;margin:-2px 0 12px}
.progress-inner{height:100%;border-radius:10px}
.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.info-box{background:#f4f7f5;border-radius:9px;padding:8px}.info-label{font-size:10px;color:#7a8781}.info-value{font-size:13px;font-weight:800;color:#173d31;margin-top:2px}
.nav-button,.location-button{display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none;border-radius:10px;font-weight:800;cursor:pointer}
.nav-button{background:#173d31;color:#fff;padding:11px;font-size:13px}.location-button{background:#eaf0ed;color:#173d31;padding:9px;font-size:12px;margin-top:7px}

.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.15);z-index:5000;color:#173d31;font-weight:700;font-size:13px}
.error{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,420px);background:#fff;padding:22px;border-radius:16px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:5000;color:#173d31}
@media(max-width:600px){
.header{height:106px;min-height:106px;padding:11px 18px}.logo-bolt{font-size:33px}.logo-text{font-size:27px}.subtitle{font-size:13px}
.station-popup{width:285px;max-height:70vh}.popup-map{height:132px}
}
</style>
</head>
<body>
<div id="app">
<header class="header">
  <div class="logo"><div class="logo-bolt">ϟ</div><div class="logo-text">ebike-soltech</div></div>
  <div class="subtitle">Interaktívna sieť nabíjacích staníc • Trenčiansky kraj</div>
</header>
<div id="map">
  <div id="loading" class="loading">Načítavam mapu…</div>
  <div id="error" class="error"><b>Nepodarilo sa načítať hranice Slovenska.</b><br><br>Skús obnoviť stránku.</div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const MAPY_API_KEY = "Ld1wDiRmzkSKYG09mz9BiWl-ti-D2b_eEGv4i9eoBe0";

const SLOVAKIA_CENTER = [48.72,19.48];
const SLOVAKIA_BOUNDS = [[47.70,16.80],[49.65,22.60]];
const NUTS_URL = "https://raw.githubusercontent.com/eurostat/Nuts2json/master/pub/v2/2024/4326/20M/nutsrg_2.json";
const COUNTRY_URL = "https://raw.githubusercontent.com/eurostat/Nuts2json/master/pub/v2/2024/4326/20M/nutsrg_0.json";


const cities = [
["Trenčín",48.8945,18.0444],["Dubnica nad Váhom",48.9597,18.1663],["Ilava",49.0000,18.2350],
["Púchov",49.1240,18.3258],["Považská Bystrica",49.1150,18.4480],["Bytča",49.2240,18.5580],
["Bojnice",48.7780,18.5850],["Prievidza",48.7740,18.6270],["Handlová",48.7270,18.7600],
["Partizánske",48.6280,18.3840],["Bánovce nad Bebravou",48.7210,18.2580],["Nové Mesto nad Váhom",48.7570,17.8300],
["Beckov",48.7890,17.8960],["Trenčianske Teplice",48.9100,18.1680],["Nemšová",48.9670,18.1180],
["Stará Turá",48.7770,17.6940],["Myjava",48.7580,17.5680],["Skalka nad Váhom",48.8870,18.0200],
["Čachtice",48.7130,17.7860],["Lednica",49.1530,18.2870]
];
const offsets=[[0,0],[.010,.014],[-.009,.012],[.007,-.025],[-.013,-.022],[.015,-.006]];
const percentPattern=[78,64,54,37,82,68];
const stations=[];
let stationId=1;
cities.forEach((c,ci)=>{
  offsets.forEach((o,j)=>{
    stations.push({
      id:stationId++,
      name:"E-BIKE POINT "+c[0]+(j===0?"":" "+(j+1)),
      city:c[0],lat:+(c[1]+o[0]).toFixed(4),lng:+(c[2]+o[1]).toFixed(4),
      percent:percentPattern[(ci*3+j)%6],
      solar:[2.0,2.2,2.4,2.5][(ci+j)%4],
      battery:[8,10,12][(ci+j)%3],ports:6,planned:true
    });
  });
});


const map = L.map("map",{
  center:SLOVAKIA_CENTER,
  zoom:7.55,
  minZoom:7.15,
  maxZoom:19,
  maxBounds:SLOVAKIA_BOUNDS,
  maxBoundsViscosity:1,
  zoomControl:true,
  worldCopyJump:false,
  attributionControl:true,
  tap:true,
  closePopupOnClick:true
});

const mapyUrl =
  "https://api.mapy.com/v1/maptiles/outdoor/256/{z}/{x}/{y}?apikey=" +
  encodeURIComponent(MAPY_API_KEY) + "&lang=sk";

L.tileLayer(mapyUrl,{
  minZoom:0,maxZoom:19,tileSize:256,noWrap:true,
  updateWhenIdle:true,updateWhenZooming:false,keepBuffer:2,
  attribution:'<a href="https://mapy.com/" target="_blank">Mapy.com</a> © Seznam.cz a ďalší'
}).addTo(map);

const outsidePane = map.createPane("outsidePane");
outsidePane.style.zIndex=350;
outsidePane.style.pointerEvents="none";
const regionsPane = map.createPane("regionsPane");
regionsPane.style.zIndex=450;
regionsPane.style.pointerEvents="none";

let outsideSvg=null, outsidePath=null;
let slovakiaFeature=null;
let regionLayer=null;
let countryLayer=null;

function coordsToPath(coords){
  let d="";
  if(!Array.isArray(coords)) return d;
  for(const ring of coords){
    if(!ring || ring.length<2) continue;
    ring.forEach((p,i)=>{
      const q=map.latLngToContainerPoint([p[1],p[0]]);
      d += (i===0 ? "M " : "L ") + q.x + " " + q.y + " ";
    });
    d+="Z ";
  }
  return d;
}

function geometryToPath(g){
  if(!g) return "";
  if(g.type==="Polygon") return coordsToPath(g.coordinates);
  if(g.type==="MultiPolygon"){
    return g.coordinates.map(poly=>coordsToPath(poly)).join("");
  }
  return "";
}

function buildOutsideOverlay(){
  outsidePane.innerHTML="";
  outsideSvg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  outsideSvg.setAttribute("class","outside-svg");
  outsideSvg.setAttribute("width","100%");
  outsideSvg.setAttribute("height","100%");
  outsidePath=document.createElementNS("http://www.w3.org/2000/svg","path");
  outsidePath.setAttribute("class","outside-fill");
  outsidePath.setAttribute("fill-rule","evenodd");
  outsideSvg.appendChild(outsidePath);
  outsidePane.appendChild(outsideSvg);
  updateOutsideOverlay();
}

function updateOutsideOverlay(){
  if(!outsideSvg || !outsidePath || !slovakiaFeature) return;
  const size=map.getSize();
  outsideSvg.setAttribute("viewBox",`0 0 ${size.x} ${size.y}`);
  const outer=`M 0 0 L ${size.x} 0 L ${size.x} ${size.y} L 0 ${size.y} Z `;
  outsidePath.setAttribute("d",outer+geometryToPath(slovakiaFeature.geometry));
}

function statusClass(p){
  if(p<=20) return "status-red";
  if(p<=40) return "status-orange";
  if(p<=60) return "status-yellow";
  return "status-green";
}
function statusText(p){
  if(p<=20) return "kritická";
  if(p<=40) return "nízka";
  if(p<=60) return "stredná";
  return "dobrá";
}

function popupHtml(s){
  const sc=statusClass(s.percent);
  const mapImg =
    "https://api.mapy.com/v1/static/map?lon="+encodeURIComponent(s.lng)+
    "&lat="+encodeURIComponent(s.lat)+"&zoom=14&width=600&height=290&scale=1&mapset=outdoor&apikey="+
    encodeURIComponent(MAPY_API_KEY);
  const navUrl =
    "https://mapy.com/fnc/v1/route?end="+encodeURIComponent(s.lng+","+s.lat)+
    "&routeType=bike_mountain&navigate=true";
  const showUrl =
    "https://mapy.com/fnc/v1/showmap?mapset=outdoor&center="+
    encodeURIComponent(s.lng+","+s.lat)+"&zoom=16&marker=true";
  return `
    <div class="station-popup">
      <img class="popup-map" src="${mapImg}" alt="Mapa lokality ${s.city}" loading="lazy">
      <div class="popup-content">
        <div class="popup-title">⚡ ${s.name}</div>
        <div class="popup-location">📍 ${s.city}, Trenčiansky kraj</div>
        <div class="planned-badge">PLÁNOVANÁ LOKALITA SIETE</div>
        <div class="status-box">
          <div class="status-left"><span class="status-dot ${sc}"></span>Stav stanice · ${statusText(s.percent)}</div>
          <div class="status-number">${s.percent} %</div>
        </div>
        <div class="progress"><div class="progress-inner ${sc}" style="width:${s.percent}%"></div></div>
        <div class="popup-grid">
          <div class="info-box"><div class="info-label">FVE výkon</div><div class="info-value">${s.solar} kWp</div></div>
          <div class="info-box"><div class="info-label">Batéria</div><div class="info-value">${s.battery} kWh</div></div>
          <div class="info-box"><div class="info-label">Nabíjacie porty</div><div class="info-value">${s.ports}</div></div>
          <div class="info-box"><div class="info-label">Aktuálne nabitia</div><div class="info-value">cca ${Math.max(1,Math.floor((s.battery*1000*s.percent/100)/800))}</div></div>
        </div>
        <a class="nav-button" href="${navUrl}" target="_blank" rel="noopener">🧭 NAVIGOVAŤ K STANICI</a>
        <a class="location-button" href="${showUrl}" target="_blank" rel="noopener">📍 Zobraziť presnú lokalitu</a>
      </div>
    </div>`;
}

const markerLayer=L.layerGroup().addTo(map);

function createMarker(s){
  const icon=L.divIcon({
    className:"",
    html:`<div class="station-icon ${statusClass(s.percent)}">⚡</div>`,
    iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-13]
  });
  const m=L.marker([s.lat,s.lng],{icon,keyboard:true,riseOnHover:true,zIndexOffset:1000});
  m.bindPopup(popupHtml(s),{
    maxWidth:310,
    minWidth:285,
    closeButton:true,
    autoPan:false,
    keepInView:false,
    className:"ebike-popup"
  });
  return m;
}
stations.forEach(s=>markerLayer.addLayer(createMarker(s)));

function styleRegions(data){
  return {
    fillColor:data.properties && data.properties.id==="SK022" ? "#19a968" : "#858e8a",
    fillOpacity:data.properties && data.properties.id==="SK022" ? .16 : .62,
    color:data.properties && data.properties.id==="SK022" ? "#173d31" : "#65716c",
    weight:data.properties && data.properties.id==="SK022" ? 3 : 1.6,
    opacity:1
  };
}

Promise.all([fetch(NUTS_URL).then(r=>r.json()),fetch(COUNTRY_URL).then(r=>r.json())])
.then(([nuts,countries])=>{
  const skRegions={
    type:"FeatureCollection",
    features:nuts.features.filter(f=>f.properties && /^SK/.test(f.properties.id))
  };
  slovakiaFeature=countries.features.find(f=>f.properties && f.properties.id==="SK");
  if(!slovakiaFeature) throw new Error("SK country geometry missing");

  regionLayer=L.geoJSON(skRegions,{pane:"regionsPane",style:styleRegions,interactive:false}).addTo(map);
  countryLayer=L.geoJSON(slovakiaFeature,{pane:"regionsPane",style:{fill:false,color:"#173d31",weight:3,opacity:1},interactive:false}).addTo(map);

  buildOutsideOverlay();
  document.getElementById("loading").style.display="none";
  map.fitBounds(L.geoJSON(slovakiaFeature).getBounds(),{padding:[15,15]});
  map.setZoom(Math.max(map.getZoom(),7.35));
})
.catch(err=>{
  console.error(err);
  document.getElementById("loading").style.display="none";
  document.getElementById("error").style.display="block";
});

map.on("move zoom resize",()=>{
  updateOutsideOverlay();
});

map.on("zoomstart",()=>{
  if(map._popup) map.closePopup();
});

map.on("popupopen",()=>{
  // Popup never pans the map; zoom controls remain usable.
  setTimeout(()=>map.invalidateSize(),50);
});

window.addEventListener("resize",()=>{
  map.invalidateSize();
  updateOutsideOverlay();
});
</script>
</body>
</html>
