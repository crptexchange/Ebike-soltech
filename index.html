<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ebike-soltech</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

*{
  box-sizing:border-box;
}

html,body,#app{
  height:100%;
  margin:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#eef3ef;
  color:#17372b;
  overflow:hidden;
}

#app{
  display:flex;
  flex-direction:column;
}

/* HEADER */

.top{
  min-height:66px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:10px 18px;
  box-shadow:0 2px 14px #0002;
  z-index:1000;
}

.brand{
  font-size:20px;
  font-weight:900;
  line-height:1.1;
}

.brand small{
  display:block;
  font-size:10px;
  color:#77847e;
  font-weight:600;
  margin-top:4px;
}

/* MAP */

#map{
  flex:1;
  min-height:0;
  width:100%;
  background:#dfe8e2;
}

.leaflet-control-attribution{
  font-size:9px;
}

/* STATION MARKER */

.station-pin{
  width:34px;
  height:42px;
  position:relative;
}

.station-pin:before{
  content:"";
  position:absolute;
  left:3px;
  top:2px;
  width:27px;
  height:27px;

  border:3px solid #fff;

  border-radius:50% 50% 50% 0;

  transform:rotate(-45deg);

  box-shadow:0 3px 8px #0005;
}

.station-pin span{
  position:absolute;
  z-index:2;
  left:0;
  top:6px;
  width:33px;
  text-align:center;
  color:#fff;
  font-size:13px;
  font-weight:900;
}

/* FARBY VLajočiek */

.station-red:before{
  background:#e53935;
}

.station-orange:before{
  background:#f39c12;
}

.station-green:before{
  background:#19a766;
}

.station-blue:before{
  background:#2777d4;
}

/* POPUP */

.popup h3{
  margin:0 0 4px;
  font-size:18px;
}

.sub{
  color:#718079;
  font-size:12px;
}

.ok{
  color:#0d9d5a;
  font-weight:800;
  font-size:12px;
  margin:10px 0;
}

.empty{
  color:#e53935;
  font-weight:900;
  font-size:12px;
  margin:10px 0;
}

.low{
  color:#f39c12;
  font-weight:900;
  font-size:12px;
  margin:10px 0;
}

.meter{
  height:9px;
  background:#e5ebe7;
  border-radius:9px;
  overflow:hidden;
  margin-top:5px;
}

.meter i{
  display:block;
  height:100%;
}

.meter-red{
  background:#e53935;
}

.meter-orange{
  background:#f39c12;
}

.meter-green{
  background:#19a766;
}

.meter-blue{
  background:#2777d4;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.stat{
  border:1px solid #e4e9e6;
  border-radius:9px;
  padding:8px;
}

.stat b{
  display:block;
  font-size:15px;
}

.stat small{
  color:#718079;
  font-size:10px;
}

.nav{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:9px;
  background:#16a566;
  color:#fff;
  text-decoration:none;
  border-radius:9px;
  font-weight:800;
}

/* LEGENDA */

.legend{
  background:#fff;
  padding:10px 12px;
  border-radius:10px;
  box-shadow:0 2px 8px #0003;
  font-size:11px;
  line-height:18px;
}

.legend-title{
  font-weight:900;
  margin-bottom:4px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:6px;
}

.legend-dot{
  width:11px;
  height:11px;
  border-radius:50%;
}

.dot-red{
  background:#e53935;
}

.dot-orange{
  background:#f39c12;
}

.dot-green{
  background:#19a766;
}

.dot-blue{
  background:#2777d4;
}

</style>

</head>

<body>

<div id="app">

  <div class="top">

    <div class="brand">

      ⚡ ebike-soltech

      <small>
        Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
      </small>

    </div>

  </div>

  <div id="map"></div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================
   MAPA
========================= */

const map = L.map("map",{
  zoomControl:true,
  minZoom:7,
  maxZoom:18
}).setView(
  [48.82,18.15],
  9
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);


setTimeout(function(){

  map.invalidateSize();

},500);


/* =========================
   STANICE
========================= */

/*
  názov
  latitude
  longitude
  percentá
  obsadené konektory
*/

const stations = [

  ["Trenčín",48.8945,18.044,0,8],

  ["Beckov",48.788,17.898,92,1],

  ["Nové Mesto nad Váhom",48.757,17.830,33,6],

  ["Myjava",48.758,17.568,82,1],

  ["Dubnica nad Váhom",48.961,18.167,64,5],

  ["Ilava",49.001,18.236,41,7],

  ["Púchov",49.124,18.325,0,8],

  ["Považská Bystrica",49.115,18.449,58,4],

  ["Trenčianske Teplice",48.910,18.168,56,4],

  ["Nemšová",48.967,18.119,17,7],

  ["Bánovce nad Bebravou",48.721,18.257,73,2],

  ["Bojnice",48.781,18.585,0,8],

  ["Partizánske",48.629,18.384,61,3],

  ["Brezová pod Bradlom",48.664,17.540,69,2],

  ["Čachtice",48.714,17.787,52,5],

  ["Duchonka",48.698,18.070,0,8],

  ["Manínska tiesňava",49.176,18.486,88,1],

  ["Stará Turá",48.778,17.695,45,5],

  ["Handlová",48.727,18.760,67,3],

  ["Inovec",48.810,18.030,84,1],

  ["Zelená Voda",48.760,17.988,12,7],

  ["Skalka",48.894,18.009,0,8],

  ["Lazy pod Makytou",49.221,18.234,54,4],

  ["Kľak",48.994,18.663,72,2]

];


/* =========================
   URČENIE FARBY
========================= */

function getStatus(pct){

  if(pct === 0){
    return {
      marker:"station-red",
      meter:"meter-red",
      text:"Stanica je úplne vybitá"
    };
  }

  if(pct <= 20){
    return {
      marker:"station-orange",
      meter:"meter-orange",
      text:"Nízka kapacita"
    };
  }

  if(pct <= 70){
    return {
      marker:"station-green",
      meter:"meter-green",
      text:"Stanica v prevádzke"
    };
  }

  return {
    marker:"station-blue",
    meter:"meter-blue",
    text:"Vysoká kapacita"
  };

}


/* =========================
   STANICE NA MAPE
========================= */

stations.forEach(function(d){

  const name = d[0];

  const lat = d[1];

  const lon = d[2];

  const pct = d[3];

  const occupied = d[4];

  const status = getStatus(pct);


  const icon = L.divIcon({

    className:"",

    html:
      '<div class="station-pin ' +
      status.marker +
      '">' +
      '<span>⚡</span>' +
      '</div>',

    iconSize:[34,42],

    iconAnchor:[17,42]

  });


  let statusHTML="";

  if(pct===0){

    statusHTML=
      '<div class="empty">' +
      '● STANICA JE ÚPLNE VYBITÁ' +
      '</div>';

  }

  else if(pct<=20){

    statusHTML=
      '<div class="low">' +
      '● NÍZKA KAPACITA' +
      '</div>';

  }

  else{

    statusHTML=
      '<div class="ok">' +
      '● Stanica v prevádzke' +
      '</div>';

  }


  const full = `

    <div class="popup">

      <h3>
        ⚡ ebike-soltech
      </h3>

      <div class="sub">
        📍 ${name}
      </div>

      ${statusHTML}

      <b>
        Nabitá kapacita: ${pct}%
      </b>

      <div class="meter">

        <i
          class="${status.meter}"
          style="width:${pct}%">
        </i>

      </div>


      <div class="stats">

        <div class="stat">

          <b>
            ${occupied} / 8
          </b>

          <small>
            obsadené konektory
          </small>

        </div>


        <div class="stat">

          <b>
            ${pct===0 ? "0" : (pct/25).toFixed(1)}
          </b>

          <small>
            ekvivalent plných e-bikov
          </small>

        </div>


        <div class="stat">

          <b>
            8×
          </b>

          <small>
            e-bike konektor
          </small>

        </div>


        <div class="stat">

          <b>
            1×
          </b>

          <small>
            230 V smartfón
          </small>

        </div>

      </div>


      <a
        class="nav"
        target="_blank"
        href="https://mapy.com/zakladni?x=${lon}&y=${lat}&z=15"
      >
        ➤ Navigovať v Mapy.com
      </a>

    </div>

  `;


  L.marker(
    [lat,lon],
    {
      icon:icon
    }
  )
  .addTo(map)
  .bindPopup(
    full,
    {
      maxWidth:330
    }
  );

});


/* =========================
   TRENČIANSKY KRAJ
   DOČASNÉ VIZUÁLNE ZVÝRAZNENIE
========================= */

const trenCianskyKraj = [

  [49.33,17.95],

  [49.25,18.15],

  [49.28,18.45],

  [49.12,18.67],

  [48.86,18.78],

  [48.55,18.63],

  [48.50,18.30],

  [48.55,17.78],

  [48.72,17.50],

  [48.94,17.48],

  [49.10,17.67],

  [49.33,17.95]

];


L.polygon(

  trenCianskyKraj,

  {

    color:"#ffffff",

    weight:3,

    fillColor:"#20ad6a",

    fillOpacity:0.18

  }

)

.addTo(map)

.bindTooltip(
  "TRENČIANSKY KRAJ",
  {
    sticky:true
  }
);


/* =========================
   LEGENDA
========================= */

const legend = L.control({
  position:"bottomright"
});


legend.onAdd = function(){

  const div = L.DomUtil.create(
    "div",
    "legend"
  );

  div.innerHTML = `

    <div class="legend-title">
      Stav stanice
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-red"></span>
      0 % – vybitá
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-orange"></span>
      1–20 % – nízka
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-green"></span>
      21–70 % – dostupná
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-blue"></span>
      71–100 % – vysoká
    </div>

  `;

  return div;

};


legend.addTo(map);


/* =========================
   ZOOM NA STANICE
========================= */

const bounds = L.latLngBounds(

  stations.map(function(s){

    return [
      s[1],
      s[2]
    ];

  })

);


map.fitBounds(
  bounds,
  {
    padding:[25,25]
  }
);

</script>

</body>
</html>
