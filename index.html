<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ebike-soltech</title>

<link
  rel="stylesheet"

/>

<style>

/* ==========================================================
   GLOBAL
========================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: white;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}


/* ==========================================================
   HEADER
========================================================== */

.header {
  height: 125px;
  min-height: 125px;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 15px 28px;
  z-index: 3000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-bolt {
  font-size: 42px;
  color: #ffb900;
  line-height: 1;
}

.logo-text {
  font-size: 38px;
  font-weight: 800;
  color: #153d31;
  letter-spacing: -1.5px;
}

.subtitle {
  margin-left: 3px;
  margin-top: 4px;
  color: #718078;
  font-size: 18px;
  font-weight: 600;
}


/* ==========================================================
   MAP
========================================================== */

#map {
  flex: 1;
  width: 100%;
  position: relative;
  background: white;
}

.leaflet-container {
  background: white;
  font-family: Arial, Helvetica, sans-serif;
}


/* ==========================================================
   ZOOM
========================================================== */

.leaflet-control-zoom {
  border: none !important;

  box-shadow:
    0 4px 14px rgba(0,0,0,.15);

  z-index: 2500 !important;
}

.leaflet-control-zoom a {
  width: 52px !important;
  height: 52px !important;
  line-height: 52px !important;
  font-size: 30px !important;
  color: #111 !important;
  background: white !important;
  border: none !important;
}

.leaflet-control-zoom a:first-child {
  border-radius: 8px 8px 0 0;
}

.leaflet-control-zoom a:last-child {
  border-radius: 0 0 8px 8px;
}


/* ==========================================================
   CHARGER MARKER
========================================================== */

.charger-wrapper {
  position: relative;
  width: 42px;
  height: 32px;
  transform: translate(-50%, -50%);
  transition: transform .18s ease;
}

.charger-body {
  width: 34px;
  height: 27px;

  position: absolute;

  left: 4px;
  top: 2px;

  border-radius: 7px;

  border: 3px solid white;

  box-shadow:
    0 3px 8px rgba(0,0,0,.30),
    inset 0 0 0 1px rgba(0,0,0,.15);

  display: flex;
  justify-content: center;
  align-items: center;
}

.charger-body::after {
  content: "";

  position: absolute;

  width: 4px;
  height: 7px;

  right: -6px;
  top: 8px;

  border-radius: 1px;

  background: white;
}

.charger-bolt {
  color: white;
  font-size: 19px;
  font-weight: 900;
  line-height: 1;

  text-shadow:
    0 1px 2px rgba(0,0,0,.35);
}


/* ==========================================================
   STATUS COLORS
========================================================== */

.status-red {
  background: #ef3b38;
}

.status-orange {
  background: #f49a13;
}

.status-yellow {
  background: #f2c400;
}

.status-green {
  background: #18a968;
}


/* ==========================================================
   CLUSTER
========================================================== */

.station-cluster {
  width: 46px;
  height: 46px;

  border-radius: 50%;

  background: #173d31;

  border: 4px solid white;

  box-shadow:
    0 4px 12px rgba(0,0,0,.30);

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;

  font-size: 15px;
  font-weight: 800;
}

.station-cluster::before {
  content: "⚡";
  font-size: 14px;
  margin-right: 2px;
}


/* ==========================================================
   STATION LABEL
========================================================== */

.station-label {
  position: absolute;

  left: 46px;
  top: -5px;

  white-space: nowrap;

  background: rgba(255,255,255,.96);

  color: #173d31;

  font-size: 13px;
  font-weight: 800;

  padding: 7px 10px;

  border-radius: 9px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.16);

  border: 1px solid rgba(23,61,49,.08);

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .18s ease;
}

.station-label.visible {
  opacity: 1;
  visibility: visible;
}


/* ==========================================================
   POPUP
========================================================== */

.leaflet-popup-content-wrapper {
  border-radius: 18px !important;

  box-shadow:
    0 10px 30px rgba(0,0,0,.20);
}

.leaflet-popup-content {
  margin: 0 !important;
  width: 285px !important;
}

.station-popup {
  overflow: hidden;
  border-radius: 18px;
  background: white;
}

.popup-image {
  width: 100%;
  height: 135px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #173d31,
      #4e806d
    );

  color: white;
  font-size: 46px;
}

.popup-content {
  padding: 14px 16px 16px;
}

.popup-title {
  font-size: 20px;
  font-weight: 800;
  color: #173d31;
  margin-bottom: 3px;
}

.popup-location {
  color: #7a8781;
  font-size: 13px;
  margin-bottom: 14px;
}

.energy-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
}

.energy-label {
  color: #64736c;
  font-size: 13px;
}

.energy-value {
  font-weight: 800;
  color: #173d31;
}

.progress {
  height: 9px;

  background: #e9eeeb;

  border-radius: 10px;

  overflow: hidden;

  margin-bottom: 14px;
}

.progress-inner {
  height: 100%;
  border-radius: 10px;
}

.popup-grid {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 9px;

  margin-bottom: 14px;
}

.info-box {
  background: #f4f7f5;

  border-radius: 10px;

  padding: 9px;
}

.info-label {
  color: #7a8781;
  font-size: 11px;
}

.info-value {
  color: #173d31;

  font-size: 14px;

  font-weight: 800;

  margin-top: 3px;
}

.charge-button {
  width: 100%;

  border: none;

  background: #19a968;

  color: white;

  padding: 11px;

  border-radius: 10px;

  font-size: 14px;

  font-weight: 800;
}


/* ==========================================================
   LEGEND
========================================================== */

.legend {
  position: absolute;

  right: 18px;
  bottom: 20px;

  background: rgba(255,255,255,.97);

  border-radius: 18px;

  padding: 18px 20px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.18);

  z-index: 2000;
}

.legend-title {
  color: #173d31;

  font-size: 19px;

  font-weight: 800;

  margin-bottom: 12px;
}

.legend-row {
  display: flex;

  align-items: center;

  margin: 8px 0;

  color: #3f5149;

  font-size: 14px;
}

.legend-dot {
  width: 15px;
  height: 15px;

  border-radius: 50%;

  margin-right: 10px;
}

.legend-red {
  background: #ef3b38;
}

.legend-orange {
  background: #f49a13;
}

.legend-yellow {
  background: #f2c400;
}

.legend-green {
  background: #18a968;

/* ==========================================================
   ERROR
========================================================== */

.map-error {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: min(90%, 420px);

  background: rgba(255,255,255,.97);

  padding: 25px;

  border-radius: 18px;

  text-align: center;

  box-shadow:
    0 8px 30px rgba(0,0,0,.15);

  z-index: 5000;

  display: none;
}

.map-error-icon {
  font-size: 42px;
  margin-bottom: 10px;
}

.map-error-title {
  font-size: 21px;

  font-weight: 800;

  color: #173d31;

  margin-bottom: 8px;
}

.map-error-text {
  color: #74817b;

  font-size: 14px;

  line-height: 1.5;
}


/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 600px) {

  .header {
    height: 115px;
    min-height: 115px;
    padding: 14px 20px;
  }

  .logo-bolt {
    font-size: 36px;
  }

  .logo-text {
    font-size: 29px;
  }

  .subtitle {
    font-size: 15px;
  }

  .legend {
    right: 12px;
    bottom: 15px;

    border-radius: 16px;
  }

  .legend-title {
    font-size: 17px;
  }

  .legend-row {
    font-size: 13px;
  }

  .leaflet-control-zoom {
    margin-left: 10px !important;
    margin-top: 10px !important;
  }

  .leaflet-control-zoom a {
    width: 48px !important;
    height: 48px !important;
    line-height: 48px !important;
  }

  .station-label {
    font-size: 12px;
    padding: 6px 8px;
  }

}

</style>

</head>

<script>

/* ==========================================================
   MAPY.COM API KEY
========================================================== */

const MAPY_API_KEY =
"Ld1wDiRmzkSKYG09mz9BiWl-ti-D2b_eEGv4i9eoBe0";


/* ==========================================================
   INITIAL VIEW
========================================================== */

const SLOVAKIA_CENTER = [
  48.70,
  19.70
];


/* ==========================================================
   MAP
========================================================== */

const map = L.map("map", {

  center: SLOVAKIA_CENTER,

  zoom: 7,

  /*
     ŽIADNY maxBounds.
     Voľné posúvanie mapy.
  */

  minZoom: 0,

  maxZoom: 19,

  zoomControl: true,

  preferCanvas: true,

  inertia: true,

  inertiaDeceleration: 3000,

  wheelPxPerZoomLevel: 80,

  zoomAnimation: true,

  fadeAnimation: true,

  markerZoomAnimation: true

});


/* ==========================================================
   MAPY.COM OUTDOOR
========================================================== */

const mapyUrl =
  "https://api.mapy.com/v1/maptiles/outdoor/256/" +
  "{z}/{x}/{y}" +
  "?apikey=" +
  encodeURIComponent(MAPY_API_KEY) +
  "&lang=sk";


const mapyLayer =
  L.tileLayer(
    mapyUrl,
    {

      minZoom: 0,

      maxZoom: 19,

      tileSize: 256,

      crossOrigin: true,

      updateWhenIdle: true,

      updateWhenZooming: false,

      keepBuffer: 2,

      attribution:
        '<a href="https://mapy.com/" target="_blank">' +
        'Mapy.com' +
        '</a> © Seznam.cz a ďalší'

    }
  );


mapyLayer.addTo(map);


/* ==========================================================
   MAPY.COM NAMES OVERLAY
========================================================== */

const namesUrl =
  "https://api.mapy.com/v1/maptiles/names-overlay/256/" +
  "{z}/{x}/{y}" +
  "?apikey=" +
  encodeURIComponent(MAPY_API_KEY) +
  "&lang=sk";


const namesLayer =
  L.tileLayer(
    namesUrl,
    {

      minZoom: 0,

      maxZoom: 19,

      tileSize: 256,

      crossOrigin: true,

      updateWhenIdle: true,

      updateWhenZooming: false,

      keepBuffer: 2,

      opacity: 1,

      attribution: ""

    }
  );


namesLayer.addTo(map);


/* ==========================================================
   MAP ERROR
========================================================== */

let tileErrorShown = false;


mapyLayer.on(
  "tileerror",
  function() {

    if (!tileErrorShown) {

      tileErrorShown = true;

      document.getElementById(
        "mapError"
      ).style.display = "block";

    }

  }
);


mapyLayer.on(
  "tileload",
  function() {

    document.getElementById(
      "mapError"
    ).style.display = "none";

  }
);


/* ==========================================================
   SLOVAKIA GEOJSON
========================================================== */

const SLOVAKIA_GEOJSON_URL =
"https://cdn.jsdelivr.net/gh/johan/world.geo.json/countries/SVK.geo.json";


let slovakiaGeoJSON = null;

let slovakiaBoundaryLayer = null;

let slovakiaMaskLayer = null;


/* ==========================================================
   LOAD SLOVAKIA
========================================================== */

fetch(SLOVAKIA_GEOJSON_URL)

  .then(
    response => {

      if (!response.ok) {

        throw new Error(
          "Slovakia GeoJSON error"
        );

      }

      return response.json();

    }
  )

  .then(
    data => {

      slovakiaGeoJSON = data;

      createSlovakiaLayers();

    }
  )

  .catch(
    error => {

      console.error(
        "Slovakia boundary error:",
        error
      );

    }
  );


/* ==========================================================
   CREATE SLOVAKIA BORDER + WHITE MASK
========================================================== */

function createSlovakiaLayers() {

  if (!slovakiaGeoJSON) {
    return;
  }


  /*
     Slovak border
  */

  slovakiaBoundaryLayer =
    L.geoJSON(
      slovakiaGeoJSON,
      {

        style: {

          color: "#173d31",

          weight: 3,

          opacity: .9,

          fill: false

        },

        interactive: false

      }
    );


  slovakiaBoundaryLayer.addTo(map);


  /*
     White world with Slovakia cut out.
  */

  const worldRing = [

    [90, -180],

    [90, 180],

    [-90, 180],

    [-90, -180],

    [90, -180]

  ];


  let coordinates;


  if (
    slovakiaGeoJSON.geometry &&
    slovakiaGeoJSON.geometry.type === "Polygon"
  ) {

    coordinates =
      slovakiaGeoJSON.geometry.coordinates;

  }


  if (
    slovakiaGeoJSON.geometry &&
    slovakiaGeoJSON.geometry.type === "MultiPolygon"
  ) {

    coordinates =
      slovakiaGeoJSON.geometry.coordinates[0];

  }


  if (!coordinates) {
    return;
  }


  const slovakiaHole =
    coordinates[0].map(
      point => [
        point[1],
        point[0]
      ]
    );


  slovakiaMaskLayer =
    L.polygon(
      [
        worldRing,
        slovakiaHole
      ],
      {

        stroke: false,

        fillColor: "white",

        fillOpacity: 1,

        fillRule: "evenodd",

        interactive: false

      }
    );


  slovakiaMaskLayer.addTo(map);


  /*
     Maska musí byť nad mapou,
     ale pod hranicou a markermi.
  */

  const maskPane =
    slovakiaMaskLayer.getPane();

  if (maskPane) {

    maskPane.style.zIndex = 700;

  }


  const borderPane =
    slovakiaBoundaryLayer.getPane();

  if (borderPane) {

    borderPane.style.zIndex = 850;

  }


  slovakiaMaskLayer.bringToFront();

  slovakiaBoundaryLayer.bringToFront();

}


/* ==========================================================

========================================================== */

const stations = [

  },

  {

  },

  {

  }

];


/* ==========================================================
   STATUS
========================================================== */

function getStatusClass(percent) {

  if (percent <= 20) {
    return "status-red";
  }

  if (percent <= 40) {
    return "status-orange";
  }

  if (percent <= 60) {
    return "status-yellow";
  }

  return "status-green";

}


/* ==========================================================
   POPUP
========================================================== */

function createPopup(station) {

  const chargeCapacity =
    station.battery * 1000 * 0.90;

  const ebikeBattery =
    800;

  const estimatedCharges =
    Math.floor(
      chargeCapacity /
      ebikeBattery
    );

  const availableEnergy =
    Math.round(
      chargeCapacity *
      station.percent /
      100
    );

  const currentCharges =
    Math.floor(
      availableEnergy /
      ebikeBattery
    );

  const statusClass =
    getStatusClass(
      station.percent
    );


  return `

    <div class="station-popup">

      <div class="popup-image">
        ⚡
      </div>

      <div class="popup-content">

        <div class="popup-title">
          ${station.name}
        </div>

        <div class="popup-location">
          ${station.city},
          Trenčiansky kraj
        </div>

        <div class="energy-row">

          <span class="energy-label">
            Stav energie
          </span>

          <span class="energy-value">
            ${station.percent} %
          </span>

        </div>

        <div class="progress">

          <div
            class="progress-inner ${statusClass}"
            style="width:${station.percent}%"
          ></div>

        </div>

        <div class="popup-grid">

          <div class="info-box">

            <div class="info-label">
              FVE výkon
            </div>

            <div class="info-value">
              ${station.solar} kWp
            </div>

          </div>

          <div class="info-box">

            <div class="info-label">
              Batéria
            </div>

            <div class="info-value">
              ${station.battery} kWh
            </div>

          </div>

          <div class="info-box">

            <div class="info-label">
              e-bike batéria
            </div>

            <div class="info-value">
              800 Wh
            </div>

          </div>

          <div class="info-box">

            <div class="info-label">
              Aktuálne nabitia
            </div>

            <div class="info-value">
              cca ${currentCharges}
            </div>

          </div>

        </div>

        <div
          style="
            font-size:12px;
            color:#74817b;
            line-height:1.4;
            margin-bottom:12px;
          "
        >

          Pri plnej batérii stanica dokáže uložiť
          približne ${estimatedCharges}
          plných nabití pri priemernej kapacite
          e-bike batérie 800 Wh.

        </div>

        <button class="charge-button">
          ⚡ Nabíjacia stanica
        </button>

      </div>

    </div>

  `;

}


/* ==========================================================
   MARKER LAYERS
========================================================== */

const markerLayer =
  L.layerGroup().addTo(map);

const clusterLayer =
  L.layerGroup().addTo(map);


/* ==========================================================
   CREATE INDIVIDUAL MARKER
========================================================== */

function createStationMarker(station) {

  const statusClass =
    getStatusClass(
      station.percent
    );


  const icon =
    L.divIcon({

      className: "",

      html: `

        <div class="charger-wrapper">

          <div
            class="charger-body ${statusClass}"
          >

            <div class="charger-bolt">
              ⚡
            </div>

          </div>

          <div
            class="station-label"
            data-station="${station.name}"
          >
            ${station.city}
          </div>

        </div>

      `,

      iconSize: [
        42,
        32
      ],

      iconAnchor: [
        21,
        16
      ],

      popupAnchor: [
        0,
        -15
      ]

    });


  const marker =
    L.marker(
      [
        station.lat,
        station.lng
      ],
      {

        icon: icon,

        riseOnHover: true,

        zIndexOffset: 1000

      }
    );


  marker.bindPopup(
    createPopup(station),
    {

      maxWidth: 300,

      closeButton: true,

      autoPan: true,

      autoPanPaddingTopLeft:
        [20, 100],

      autoPanPaddingBottomRight:
        [20, 100]

    }
  );


  marker.stationData =
    station;


  return marker;

}


/* ==========================================================
   CREATE CLUSTER
========================================================== */

function createClusterMarker(
  items,
  latlng
) {

  const icon =
    L.divIcon({

      className: "",

      html: `

        <div class="station-cluster">
          ${items.length}
        </div>

      `,

      iconSize: [
        46,
        46
      ],

      iconAnchor: [
        23,
        23
      ]

    });


  const marker =
    L.marker(
      latlng,
      {

        icon: icon,

        zIndexOffset: 1200

      }
    );


  marker.on(
    "click",
    function() {

      const bounds =
        L.latLngBounds(
          items.map(
            station => [
              station.lat,
              station.lng
            ]
          )
        );

      map.fitBounds(
        bounds,
        {
          padding: [
            80,
            80
          ],
          maxZoom: 10
        }
      );

    }
  );


  return marker;

}


/* ==========================================================
   GRID CLUSTERING
========================================================== */

function renderMarkers() {

  markerLayer.clearLayers();

  clusterLayer.clearLayers();


  const zoom =
    map.getZoom();


  /*
     Od zoom 7 vyššie:
     normálne jednotlivé nabíjačky.
  */

  if (zoom >= 7) {

    stations.forEach(
      station => {

        markerLayer.addLayer(
          createStationMarker(
            station
          )
        );

      }
    );

    return;

  }


  /*
     Pri oddialení zoskupujeme
     stanice podľa pixelovej mriežky.
  */

  const gridSize =
    zoom <= 3
      ? 100
      : zoom <= 4
        ? 90
        : zoom <= 5
          ? 80
          : 70;


  const groups =
    new Map();


  stations.forEach(
    station => {

      const point =
        map.project(
          [
            station.lat,
            station.lng
          ],
          zoom
        );


      const key =
        Math.floor(
          point.x / gridSize
        ) +
        "_" +
        Math.floor(
          point.y / gridSize
        );


      if (!groups.has(key)) {

        groups.set(
          key,
          []
        );

      }


      groups
        .get(key)
        .push(station);

    }
  );


  groups.forEach(
    items => {

      if (items.length === 1) {

        clusterLayer.addLayer(
          createStationMarker(
            items[0]
          )
        );

        return;

      }


      const lat =
        items.reduce(
          (sum, station) =>
            sum + station.lat,
          0
        ) / items.length;


      const lng =
        items.reduce(
          (sum, station) =>
            sum + station.lng,
          0
        ) / items.length;


      clusterLayer.addLayer(
        createClusterMarker(
          items,
          [
            lat,
            lng
          ]
        )
      );

    }
  );

}


/* ==========================================================
   MARKER SCALING
========================================================== */

function updateMarkerSize() {

  const zoom =
    map.getZoom();


  let scale = 1;


  if (zoom <= 3) {

    scale = .42;

  }
  else if (zoom <= 4) {

    scale = .50;

  }
  else if (zoom <= 5) {

    scale = .60;

  }
  else if (zoom <= 6) {

    scale = .72;

  }
  else if (zoom <= 7) {

    scale = .84;

  }
  else if (zoom <= 8) {

    scale = .92;

  }


  document
    .querySelectorAll(
      ".charger-wrapper"
    )
    .forEach(
      element => {

        element.style.transform =
          `translate(-50%, -50%) scale(${scale})`;

      }
    );

}


/* ==========================================================
   LABEL VISIBILITY
========================================================== */

function updateLabels() {

  const zoom =
    map.getZoom();


  const labels =
    document.querySelectorAll(
      ".station-label"
    );


  labels.forEach(
    label => {

      label.classList.remove(
        "visible"
      );

      label.style.display =
        "";

    }
  );


  /*
     Pri veľkom oddialení
     žiadne názvy.
  */

  if (zoom < 8) {
    return;
  }


  labels.forEach(
    label => {

      label.classList.add(
        "visible"
      );

    }
  );

}


/* ==========================================================
   LABEL COLLISION
========================================================== */

function avoidLabelCollisions() {

  const zoom =
    map.getZoom();


  if (zoom < 8) {
    return;
  }


  const labels =
    Array.from(
      document.querySelectorAll(
        ".station-label.visible"
      )
    );


  const visibleRects = [];


  labels.forEach(
    label => {

      label.style.display =
        "block";

    }
  );


  labels.forEach(
    label => {

      const rect =
        label.getBoundingClientRect();


      let collision =
        false;


      for (
        const existingRect
        of visibleRects
      ) {

        const overlaps =
          !(
            rect.right <
              existingRect.left ||
            rect.left >
              existingRect.right ||
            rect.bottom <
              existingRect.top ||
            rect.top >
              existingRect.bottom
          );


        if (overlaps) {

          collision = true;

          break;

        }

      }


      if (collision) {

        label.style.display =
          "none";

      }
      else {

        visibleRects.push(
          rect
        );

      }

    }
  );

}


/* ==========================================================
   UPDATE UI
========================================================== */

function updateMapUI() {

  renderMarkers();

  updateMarkerSize();

  updateLabels();


  requestAnimationFrame(
    function() {

      avoidLabelCollisions();

    }
  );


  /*
     Správne poradie vrstiev:
     mapa
     → names overlay
     → biela maska
     → hranica
     → markery
  */

  if (slovakiaMaskLayer) {

    slovakiaMaskLayer.bringToFront();

  }


  if (slovakiaBoundaryLayer) {

    slovakiaBoundaryLayer.bringToFront();

  }


  clusterLayer.bringToFront();

  markerLayer.bringToFront();

}


/* ==========================================================
   MAP EVENTS
========================================================== */

map.on(
  "zoomend",
  function() {

    updateMapUI();

  }
);


map.on(
  "moveend",
  function() {

    updateMapUI();

  }
);


map.on(
  "resize",
  function() {

    updateMapUI();

  }
);


/* ==========================================================
   INITIAL VIEW
========================================================== */

map.setView(
  SLOVAKIA_CENTER,
  7
);


/* ==========================================================
   READY
========================================================== */

map.whenReady(
  function() {

    setTimeout(
      function() {

        map.invalidateSize();

        updateMapUI();

      },
      500
    );

  }
);


/* ==========================================================
   RESIZE
========================================================== */

window.addEventListener(
  "resize",
  function() {

    map.invalidateSize();

    updateMapUI();

  }
);

</script>

</body>

</html>
