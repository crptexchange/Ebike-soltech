<!doctype html>
<html lang="sk">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>ebike-soltech</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

*{
  box-sizing:border-box;
}

html,body,#app{
  height:100%;
  margin:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#eef3ef;
  color:#17372b;
  overflow:hidden;
}

#app{
  display:flex;
  flex-direction:column;
}


/* =========================
   HEADER
========================= */

.top{
  height:74px;
  min-height:74px;

  background:#fff;

  display:flex;
  align-items:center;

  padding:10px 18px;

  box-shadow:0 2px 12px rgba(0,0,0,.12);

  z-index:1000;
}

.brand{
  font-size:24px;
  font-weight:900;
  line-height:1.05;
  color:#17372b;
}

.brand small{
  display:block;

  font-size:11px;

  color:#77847e;

  font-weight:600;

  margin-top:5px;
}


/* =========================
   MAPA
========================= */

#map{
  flex:1;
  min-height:0;
  width:100%;
  background:#dfe4e1;
}

.leaflet-container{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.leaflet-control-attribution{
  font-size:9px;
}


/* =========================
   STANICA
========================= */

.station-icon{
  background:transparent;
  border:none;
}

.station-pin{
  width:30px;
  height:38px;

  position:relative;

  filter:
    drop-shadow(
      0 3px 4px rgba(0,0,0,.30)
    );
}

.station-pin::before{

  content:"";

  position:absolute;

  left:3px;
  top:2px;

  width:25px;
  height:25px;

  border:2.5px solid #fff;

  border-radius:
    50% 50% 50% 0;

  transform:rotate(-45deg);

  box-shadow:
    0 1px 3px rgba(0,0,0,.18);
}

.station-pin span{

  position:absolute;

  z-index:2;

  left:0;
  top:6px;

  width:30px;

  text-align:center;

  color:#fff;

  font-size:11px;

  font-weight:900;

  text-shadow:
    0 1px 2px rgba(0,0,0,.4);
}


/* FARBY */

.station-red::before{
  background:#ed3b3b;
}

.station-orange::before{
  background:#f39c12;
}

.station-green::before{
  background:#16a766;
}

.station-blue::before{
  background:#2878d5;
}


/* =========================
   POPUP
========================= */

.leaflet-popup-content-wrapper{

  border-radius:16px;

  padding:0;

  overflow:hidden;

  box-shadow:
    0 8px 30px rgba(0,0,0,.22);
}

.leaflet-popup-content{

  margin:0;

  width:310px !important;
}

.leaflet-popup-tip{

  box-shadow:
    3px 3px 8px rgba(0,0,0,.12);
}

.station-card{
  background:#fff;
}

.card-top{
  padding:14px 15px 10px;
}

.card-title{

  display:flex;

  align-items:center;

  gap:9px;
}

.card-logo{

  width:35px;
  height:35px;

  border-radius:10px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#e8f5ee;

  font-size:19px;
}

.card-title h3{

  margin:0;

  font-size:17px;

  line-height:1.1;

  color:#17372b;
}

.card-location{

  margin-top:3px;

  color:#75827c;

  font-size:11px;
}


/* =========================
   STATUS
========================= */

.status{

  margin-top:12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  font-size:12px;

  font-weight:800;
}

.status-left{

  display:flex;

  align-items:center;

  gap:6px;
}

.status-dot{

  width:9px;
  height:9px;

  border-radius:50%;
}

.status-green{
  color:#11985c;
}

.status-green .status-dot{
  background:#16a766;
}

.status-orange{
  color:#e38b00;
}

.status-orange .status-dot{
  background:#f39c12;
}

.status-red{
  color:#df3636;
}

.status-red .status-dot{
  background:#ed3b3b;
}

.status-blue{
  color:#2878d5;
}

.status-blue .status-dot{
  background:#2878d5;
}


/* =========================
   KAPACITA
========================= */

.capacity{

  padding:
    0 15px 13px;
}

.capacity-row{

  display:flex;

  justify-content:space-between;

  font-size:12px;

  margin-bottom:6px;
}

.capacity-row strong{
  font-size:14px;
}

.capacity-bar{

  width:100%;

  height:8px;

  border-radius:20px;

  background:#e7ece9;

  overflow:hidden;
}

.capacity-bar i{

  display:block;

  height:100%;

  border-radius:20px;
}

.bar-red{
  background:#ed3b3b;
}

.bar-orange{
  background:#f39c12;
}

.bar-green{
  background:#16a766;
}

.bar-blue{
  background:#2878d5;
}


/* =========================
   ŠTATISTIKY
========================= */

.stats{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;

  padding:
    0 15px 13px;
}

.stat{

  background:#f5f8f6;

  border-radius:10px;

  padding:9px;
}

.stat-icon{
  font-size:14px;
}

.stat b{

  display:block;

  margin-top:3px;

  font-size:14px;

  color:#17372b;
}

.stat small{

  display:block;

  margin-top:2px;

  color:#75827c;

  font-size:9px;
}


/* =========================
   NAVIGÁCIA
========================= */

.nav-button{

  display:block;

  margin:
    0 15px 15px;

  padding:11px;

  text-align:center;

  background:#16a766;

  color:#fff;

  border-radius:10px;

  text-decoration:none;

  font-size:12px;

  font-weight:900;

  box-shadow:
    0 3px 8px
    rgba(22,167,102,.25);
}


/* =========================
   LEGENDA
========================= */

.legend{

  background:#fff;

  padding:12px 14px;

  border-radius:14px;

  box-shadow:
    0 4px 18px rgba(0,0,0,.16);

  font-size:11px;

  line-height:20px;
}

.legend-title{

  font-weight:900;

  font-size:13px;

  margin-bottom:5px;
}

.legend-row{

  display:flex;

  align-items:center;

  gap:7px;
}

.legend-dot{

  width:10px;
  height:10px;

  border-radius:50%;
}

.dot-red{
  background:#ed3b3b;
}

.dot-orange{
  background:#f39c12;
}

.dot-green{
  background:#16a766;
}

.dot-blue{
  background:#2878d5;
}


/* =========================
   LOADING
========================= */

.loading{

  position:absolute;

  z-index:3000;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:#fff;

  padding:
    12px 17px;

  border-radius:12px;

  box-shadow:
    0 4px 20px rgba(0,0,0,.18);

  font-size:12px;

  font-weight:700;

  color:#17372b;
}

</style>

</head>


<body>

<div id="app">

  <div class="top">

    <div class="brand">

      ⚡ ebike-soltech

      <small>
        Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
      </small>

    </div>

  </div>

  <div id="map"></div>

  <div
    id="loading"
    class="loading"
  >
    Načítavam mapu…
  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   MAPA
========================================================= */

const map = L.map("map",{

  zoomControl:true,

  minZoom:7,

  maxZoom:18,

  preferCanvas:true,

  inertia:true,

  zoomAnimation:true,

  fadeAnimation:true

});


map.setView(
  [48.70,19.70],
  8
);


/* =========================================================
   OSM MAPA
========================================================= */

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:19,

    attribution:
      "© OpenStreetMap contributors"

  }

).addTo(map);


/* =========================================================
   PRESNÁ HRANICA SLOVENSKA
========================================================= */

const SLOVAKIA_URL =
"https://raw.githubusercontent.com/openplanetdata/openplanetdata-boundaries/main/boundaries/countries/sk/geojson/v2/sk.geojson";


/* =========================================================
   TRENČIANSKY KRAJ
========================================================= */

const TRENCIANSKY_URL =
"https://raw.githubusercontent.com/openplanetdata/openplanetdata-boundaries/main/boundaries/regions/SK-TC/geojson/v2/sk-tc.geojson";


/*
  Použijeme samostatné hranice.

  Slovensko:
  -> definuje čo je ešte viditeľná mapa

  Trenčiansky kraj:
  -> definuje farebnú časť

*/


/* =========================================================
   VRSTVA MIMO SLOVENSKA
========================================================= */

let outsideMask;


/* =========================================================
   NAČÍTANIE SLOVENSKA
========================================================= */

fetch(SLOVAKIA_URL)

.then(function(response){

  if(!response.ok){

    throw new Error(
      "Slovakia boundary error"
    );

  }

  return response.json();

})

.then(function(sl){

  /*
    ČIERNO-SIVÁ MASKA OKOLO SLOVENSKA.

    Použijeme obrovský polygon
    a do jeho stredu vložíme
    dieru v tvare Slovenska.

    Výsledok:
    mimo Slovenska je sivá plocha.
  */

  const worldRing = [

    [-180,-85],

    [180,-85],

    [180,85],

    [-180,85],

    [-180,-85]

  ];


  let slovakiaCoordinates;


  if(
    sl.geometry &&
    sl.geometry.type === "Polygon"
  ){

    slovakiaCoordinates =
      sl.geometry.coordinates;

  }

  else if(
    sl.geometry &&
    sl.geometry.type === "MultiPolygon"
  ){

    /*
      Slovensko je normálne jeden polygon,
      ale podpora MultiPolygon je tu tiež.
    */

    slovakiaCoordinates =
      sl.geometry.coordinates[0];

  }


  /*
    MASKA

    vonkajší polygon = celý svet
    vnútorný polygon = Slovensko
  */

  outsideMask =
    L.polygon(

      [
        worldRing,
        slovakiaCoordinates[0]
      ],

      {

        stroke:false,

        fillColor:"#6f7572",

        fillOpacity:.90,

        interactive:false

      }

    ).addTo(map);


  /*
    Hranica Slovenska.
  */

  L.geoJSON(

    sl,

    {

      interactive:false,

      style:function(){

        return {

          color:"#ffffff",

          weight:2.5,

          opacity:1,

          fill:false

        };

      }

    }

  ).addTo(map);

});


/* =========================================================
   TRENČIANSKY KRAJ
========================================================= */

fetch(TRENCIANSKY_URL)

.then(function(response){

  if(!response.ok){

    throw new Error(
      "Trencin region boundary error"
    );

  }

  return response.json();

})

.then(function(tc){

  /*
    Farebná výplň Trenčianskeho kraja.

    Bez ručne kreslenej machule.
    Geometria pochádza z reálnej hranice kraja.
  */

  L.geoJSON(

    tc,

    {

      interactive:false,

      style:function(){

        return {

          color:"#ffffff",

          weight:3,

          opacity:1,

          fillColor:"#20ad6a",

          fillOpacity:.20

        };

      }

    }

  ).addTo(map);


  /*
    Názov kraja.
  */

  L.geoJSON(

    tc,

    {

      interactive:false,

      style:function(){

        return {

          color:"#ffffff",

          weight:3,

          fillOpacity:0

        };

      }

    }

  ).addTo(map);

});


/* =========================================================
   STANICE
========================================================= */

const stations = [

[

18.0440,
78,
3,
"4,2 kW",
4
],

[
"Beckov",

92,

7
],

[
"Nové Mesto nad Váhom",

6,

2
],

[
"Myjava",

17.5680,
82,

"4,5 kW",
6
],

[
"Dubnica nad Váhom",
48.9610,

],

[
"Ilava",

],

[

0,

],

[
"Považská Bystrica",
49.1150,

58,

],

[
"Trenčianske Teplice",
48.9100,

"3,1 kW",
4
],

[
"Nemšová",

18.1190,
17,

"0,9 kW",
1
],

[
"Bánovce nad Bebravou",
48.7210,
18.2570,
73,
2,
"4,0 kW",

],

[
"Bojnice",
48.7810,
18.5850,
0,

"0 kW",
0
],

[
"Partizánske",
48.6290,
18.3840,
61,
3,
"3,6 kW",
5
],

[
"Brezová pod Bradlom",
48.6640,
17.5400,
69,
2,
"3,9 kW",
5
],

[
"Čachtice",
48.7140,

52,

],

[
"Duchonka",

],

[

],

],

],

],

],

[

]

];


/* =========================================================
   STAV
========================================================= */

function getStatus(pct){

  if(pct===0){

    return {

      marker:"station-red",

      bar:"bar-red",

      status:"status-red",

      text:"Úplne vybitá"

    };

  }


  if(pct<=20){

    return {

      marker:"station-orange",

      bar:"bar-orange",

      status:"status-orange",

      text:"Nízka kapacita"

    };

  }


  if(pct<=70){

    return {

      marker:"station-green",

      bar:"bar-green",

      status:"status-green",

      text:"Stanica v prevádzke"

    };

  }


  return {

    marker:"station-blue",

    bar:"bar-blue",

    status:"status-blue",

    text:"Vysoká kapacita"

  };

}


/* =========================================================
   MARKERY
========================================================= */

stations.forEach(function(d){

  const name=d[0];

  const lat=d[1];

  const lon=d[2];

  const pct=d[3];

  const occupied=d[4];

  const power=d[5];

  const bikes=d[6];


  const status=
    getStatus(pct);


  const icon=
    L.divIcon({

      className:"station-icon",

      html:

        '<div class="station-pin '+
        status.marker+
        '">' +

        '<span>⚡</span>' +

        '</div>',

      iconSize:[30,38],

      iconAnchor:[15,38]

    });


  let statusText;


  if(pct===0){

    statusText=
      "STANICA JE ÚPLNE VYBITÁ";

  }

  else if(pct<=20){

    statusText=
      "NÍZKA KAPACITA";

  }

  else if(pct<=70){

    statusText=
      "STANICA V PREVÁDZKE";

  }

  else{

    statusText=
      "VYSOKÁ KAPACITA";

  }


  const popup=`

    <div class="station-card">

      <div class="card-top">

        <div class="card-title">

          <div class="card-logo">
            ⚡
          </div>

          <div>

            <h3>
              E-BIKE POINT ${name}
            </h3>

            <div class="card-location">
              📍 ${name}, Trenčiansky kraj
            </div>

          </div>

        </div>


        <div class="status ${status.status}">

          <div class="status-left">

            <span class="status-dot"></span>

            ${statusText}

          </div>

          <span>
            ${pct} %
          </span>

        </div>

      </div>


      <div class="capacity">

        <div class="capacity-row">

          <span>
            Nabitá kapacita
          </span>

          <strong>
            ${pct} %
          </strong>

        </div>

        <div class="capacity-bar">

          <i
            class="${status.bar}"
            style="width:${pct}%"
          ></i>

        </div>

      </div>


      <div class="stats">


        <div class="stat">

          <span class="stat-icon">
            🚲
          </span>

          <b>
            ${bikes} / 8
          </b>

          <small>
            nabíjacie miesta
          </small>

        </div>


        <div class="stat">

          <span class="stat-icon">
            ⚡
          </span>

          <b>
            ${power}
          </b>

          <small>
            aktuálny výkon
          </small>

        </div>


        <div class="stat">

          <span class="stat-icon">
            🔌
          </span>

          <b>
            ${occupied} / 8
          </b>

          <small>
            obsadené konektory
          </small>

        </div>


        <div class="stat">

          <span class="stat-icon">
            📱
          </span>

          <b>
            1× 230 V
          </b>

          <small>
            smartfón / elektronika
          </small>

        </div>


      </div>


      <a

        class="nav-button"

        target="_blank"

        href="https://mapy.com/zakladni?x=${lon}&y=${lat}&z=16"

      >

        ➤ Navigovať v Mapy.com

      </a>

    </div>

  `;


  L.marker(

    [lat,lon],

    {

      icon:icon,

      zIndexOffset:500

    }

  )

  .addTo(map)

  .bindPopup(

    popup,

    {

      maxWidth:310,

      minWidth:310,

      closeButton:true,

      autoPan:true,

      autoPanPaddingTopLeft:
        [20,80],

      autoPanPaddingBottomRight:
        [20,20]

    }

  );

});


/* =========================================================
   LEGENDA
========================================================= */

const legend=
  L.control({

    position:"bottomright"

  });


legend.onAdd=function(){

  const div=
    L.DomUtil.create(
      "div",
      "legend"
    );


  div.innerHTML=`

    <div class="legend-title">
      Stav stanice
    </div>

    <div class="legend-row">

      <span class="legend-dot dot-red"></span>

      0 % – vybitá

    </div>

    <div class="legend-row">

      <span class="legend-dot dot-orange"></span>

      1–20 % – nízka

    </div>

    <div class="legend-row">

      <span class="legend-dot dot-green"></span>

      21–70 % – dostupná

    </div>

    <div class="legend-row">

      <span class="legend-dot dot-blue"></span>

      71–100 % – vysoká

    </div>

  `;


  return div;

};


legend.addTo(map);


/* =========================================================
   ZAČIATOČNÉ ZOBRAZENIE
========================================================= */

const bounds=
  L.latLngBounds(

    stations.map(function(s){

      return [
        s[1],
        s[2]
      ];

    })

  );


map.fitBounds(

  bounds,

  {

    padding:[40,40],

    maxZoom:9

  }

);


/* =========================================================
   MOBIL
========================================================= */

setTimeout(function(){

  map.invalidateSize();

},500);


window.addEventListener(
  "resize",
  function(){

    map.invalidateSize();

  }
);


/* =========================================================
   LOADING
========================================================= */

setTimeout(function(){

  const loading=
    document.getElementById(
      "loading"
    );

  if(loading){

    loading.style.display="none";

  }

},3000);

</script>

</body>
</html>
