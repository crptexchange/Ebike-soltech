<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ebike-soltech</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}#app{display:flex;flex-direction:column}.header{height:106px;min-height:106px;padding:10px 20px;display:flex;flex-direction:column;justify-content:center;background:#fff;z-index:10}.logo{display:flex;align-items:center;gap:8px}.bolt{font-size:35px;color:#ffb900}.title{font-size:30px;font-weight:800;color:#153d31;letter-spacing:-1.4px}.sub{font-size:13px;color:#718078;font-weight:600;margin-top:3px}#map{flex:1;min-height:0;background:#dfe4e1}.leaflet-container{background:#dfe4e1}.leaflet-top,.leaflet-bottom{z-index:10000!important}.leaflet-control-zoom{border:0!important;box-shadow:0 4px 14px #0003!important}.leaflet-control-zoom a{width:46px!important;height:46px!important;line-height:46px!important;font-size:27px!important;border:0!important;color:#111!important}.loading,.error{position:absolute;z-index:5000;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 8px 28px #0002;color:#173d31;font-weight:700;text-align:center}.error{display:none;width:300px}.credit{position:absolute;right:5px;bottom:3px;background:#ffffffe6;padding:3px 6px;font-size:10px;color:#555;z-index:10001;pointer-events:none}.station{width:23px;height:23px;border:2px solid white;border-radius:7px;background:#18a968;box-shadow:0 2px 7px #0005;display:flex;align-items:center;justify-content:center;color:white;font-weight:900}.red{background:#ef3b38}.orange{background:#f49a13}.yellow{background:#f2c400}.green{background:#18a968}.popup{width:280px;max-height:68vh;overflow:auto;background:white;border-radius:16px}.pic{height:125px;background:linear-gradient(155deg,#dcece5,#73a77f);position:relative;overflow:hidden}.roof{position:absolute;left:35px;right:35px;top:30px;height:45px;background:#173d31;transform:skew(-18deg);border:3px solid white}.panel{position:absolute;top:36px;left:55px;width:150px;height:30px;background:#1d4f43;border:2px solid #6db4a0;box-shadow:35px 0 #1d4f43,70px 0 #1d4f43,105px 0 #1d4f43}.charger{position:absolute;left:124px;top:65px;width:38px;height:58px;background:#f5f7f6;border:3px solid #173d31;border-radius:6px}.charger:after{content:'ϟ';position:absolute;left:9px;top:8px;font-size:20px;color:#ffb900}.wheels{position:absolute;bottom:-8px;left:70px;width:140px;height:35px;border-bottom:5px solid #173d31;border-radius:50%}.body{padding:12px}.pt{font-size:18px;font-weight:800;color:#173d31}.loc{font-size:12px;color:#7a8781;margin:3px 0 8px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eef7f2;color:#18764e;font-size:10px;font-weight:800;margin-bottom:9px}.status{display:flex;justify-content:space-between;background:#f4f7f5;padding:8px;border-radius:10px;font-size:12px;font-weight:700;color:#64736c}.num{font-size:15px;color:#173d31}.bar{height:7px;background:#e9eeeb;border-radius:8px;overflow:hidden;margin:7px 0 10px}.fill{height:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.box{background:#f4f7f5;border-radius:8px;padding:7px}.lab{font-size:9px;color:#7a8781}.val{font-size:12px;font-weight:800;color:#173d31;margin-top:2px}.nav{display:block;margin-top:9px;padding:10px;background:#173d31;color:#fff;text-align:center;text-decoration:none;border-radius:9px;font-size:12px;font-weight:800}</style></head><body><div id="app"><header class="header"><div class="logo"><div class="bolt">ϟ</div><div class="title">ebike-soltech</div></div><div class="sub">Interaktívna sieť nabíjacích staníc • Trenčiansky kraj</div></header><div id="map"><div id="loading" class="loading">Načítavam mapu…</div><div id="error" class="error"></div><div class="credit">© OpenStreetMap contributors</div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/topojson-client@3"></script><script>
const map=L.map('map',{center:[48.8,18.1],zoom:8,minZoom:7,maxZoom:16,zoomControl:true,worldCopyJump:false,preferCanvas:true,closePopupOnClick:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,noWrap:true,updateWhenIdle:true,keepBuffer:2,subdomains:['a','b','c'],attribution:''}).addTo(map);
const pane=map.createPane('stations');pane.style.zIndex=800;
const WORLD=[[-85,-180],[-85,180],[85,180],[85,-180],[-85,-180]];
const countryURL='https://raw.githubusercontent.com/glynnbird/countriesgeojson/master/slovakia.geojson';
const regionsURL='https://raw.githubusercontent.com/mlajtos/slovakia-topojson/master/slovakia.json';
function rings(g){return g.type==='Polygon'?g.coordinates:g.type==='MultiPolygon'?g.coordinates.flat():[]}
function inside(p,r){let x=p[0],y=p[1],v=false;for(let i=0,j=r.length-1;i<r.length;j=i++){let a=r[i],b=r[j];if(((a[1]>y)!=(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))v=!v}return v}
function ingeo(p,g){return rings(g).some(r=>inside(p,r[0]))}
function props(f){return f&&f.properties||{}}
function isTN(f){let p=props(f);return String(p.NUTS_ID||p.nuts||p.NUTS||p.id||'').toUpperCase()==='SK022'||Object.values(p).join(' ').toLowerCase().includes('trenčians')||Object.values(p).join(' ').toLowerCase().includes('trencians')}
function visual(){return '<div class="pic"><div class="roof"></div><div class="panel"></div><div class="charger"></div><div class="wheels"></div></div>'}
function col(v){return v<=20?'#ef3b38':v<=40?'#f49a13':v<=60?'#f2c400':'#18a968'}
function pop(s){let c=col(s.energy);return `<div class="popup">${visual()}<div class="body"><div class="pt">⚡ ${s.name}</div><div class="loc">📍 ${s.area}, Trenčiansky kraj</div><span class="badge">PLÁNOVANÁ LOKALITA SIETE</span><div class="status"><span>Stav energie</span><span class="num">${s.energy} %</span></div><div class="bar"><div class="fill" style="width:${s.energy}%;background:${c}"></div></div><div class="grid"><div class="box"><div class="lab">FVE výkon</div><div class="val">2,4 kWp</div></div><div class="box"><div class="lab">Batéria</div><div class="val">12 kWh</div></div><div class="box"><div class="lab">Nabíjacie porty</div><div class="val">6</div></div><div class="box"><div class="lab">Aktuálne nabíjanie</div><div class="val">cca 12 kW</div></div></div><a class="nav" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">🧭 NAVIGOVAŤ K STANICI</a></div></div>`}
function stations(g){let b=L.geoJSON(g).getBounds(),south=b.getSouth(),north=b.getNorth(),west=b.getWest(),east=b.getEast(),candidates=[];for(let r=0;r<70;r++)for(let c=0;c<70;c++){let lon=west+(c+.5+(r%2?.23:-.23))*(east-west)/70,lat=south+(r+.5)*(north-south)/70;if(ingeo([lon,lat],g.geometry))candidates.push([lat,lon])}let pts=[],minDist=0.045;for(let pass=0;pass<3&&pts.length<125;pass++){let d=minDist-pass*.009;for(let i=0;i<candidates.length&&pts.length<125;i++){let p=candidates[i],ok=true;for(let q of pts){let dy=p[0]-q[0],dx=(p[1]-q[1])*Math.cos(p[0]*Math.PI/180);if(Math.hypot(dx,dy)<d){ok=false;break}}if(ok)pts.push(p)}}let places=['Trenčín','Dubnica nad Váhom','Púchov','Považská Bystrica','Ilava','Bánovce nad Bebravou','Prievidza','Partizánske','Nové Mesto nad Váhom','Myjava','Trenčianske Teplice','Bojnice','Handlová','Beluša','Nemšová','Stará Turá','Čachtice','Beckov'];pts.forEach((p,j)=>{let s={lat:p[0],lng:p[1],name:'E-BIKE POINT '+String(j+1).padStart(3,'0'),area:places[j%places.length],energy:25+(j*17)%76};let cl=s.energy<=20?'red':s.energy<=40?'orange':s.energy<=60?'yellow':'green';L.marker(p,{pane:'stations',icon:L.divIcon({className:'',html:`<div class="station ${cl}">ϟ</div>`,iconSize:[23,23],iconAnchor:[11,11]}),riseOnHover:true}).bindPopup(pop(s),{autoPan:true,maxWidth:290,minWidth:275}).addTo(map)})}
map.on('zoomstart',()=>map.closePopup());
(async()=>{try{let [a,b]=await Promise.all([fetch(countryURL,{cache:'no-store'}),fetch(regionsURL,{cache:'no-store'})]);if(!a.ok||!b.ok)throw new Error('geo fetch');let country=await a.json(),topo=await b.json(),regions=topojson.feature(topo,topo.objects.kraje),tn=regions.features.find(isTN);if(!tn)throw new Error('TN not found');
let holes=rings(country.geometry).map(r=>r.map(([lon,lat])=>[lat,lon]));
L.polygon([WORLD,...holes],{stroke:false,fillColor:'#dfe4e1',fillOpacity:1,fillRule:'evenodd',interactive:false}).addTo(map);
L.geoJSON(regions,{style:f=>({color:isTN(f)?'#153d31':'#707975',weight:isTN(f)?3:1.5,fillColor:isTN(f)?'#ffffff':'#bfc5c2',fillOpacity:isTN(f)?0:1}),interactive:false}).addTo(map);
L.geoJSON(tn,{style:{color:'#153d31',weight:3,fillOpacity:0},interactive:false}).addTo(map);
stations(tn);map.fitBounds(L.geoJSON(country).getBounds().pad(.04),{padding:[8,8]});document.getElementById('loading').style.display='none';
}catch(e){console.error(e);document.getElementById('loading').style.display='none';let x=document.getElementById('error');x.style.display='block';x.innerHTML='Nepodarilo sa načítať mapu.<br><small>Skontroluj pripojenie a obnov stránku.</small>'}})();
</script></body></html>
