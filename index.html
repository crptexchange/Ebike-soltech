<style>
*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#app{display:flex;flex-direction:column;background:#fff}
.header{height:112px;min-height:112px;background:#fff;padding:13px 22px;display:flex;flex-direction:column;justify-content:center;z-index:3000}
.logo{display:flex;align-items:center;gap:9px}
.logo-bolt{font-size:38px;color:#ffb900;line-height:1}
.logo-text{font-size:32px;font-weight:800;color:#153d31;letter-spacing:-1.4px}
.subtitle{margin-left:3px;margin-top:4px;color:#718078;font-size:15px;font-weight:600}
#map{position:relative;flex:1;min-height:0;background:#dfe4e1}
.leaflet-container{background:#dfe4e1;font-family:Arial,Helvetica,sans-serif}
.leaflet-control-zoom{border:0!important;box-shadow:0 4px 14px rgba(0,0,0,.18)!important}
.leaflet-control-zoom a{width:46px!important;height:46px!important;line-height:46px!important;font-size:27px!important;color:#111!important;background:#fff!important;border:0!important}
.leaflet-control-zoom a:first-child{border-radius:8px 8px 0 0}
.leaflet-control-zoom a:last-child{border-radius:0 0 8px 8px}
.slovakia-dimmer-pane{z-index:350;pointer-events:none}
.slovakia-dimmer-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slovakia-dimmer-rect{fill:rgba(28,36,33,.72)}
.regions-pane{z-index:450;pointer-events:none}
.region-other{fill:#858e8a;fill-opacity:.68;stroke:#69736e;stroke-width:1.5}
.region-trencin{fill:#19a968;fill-opacity:.12;stroke:#173d31;stroke-width:3}
.slovakia-border{fill:none;stroke:#173d31;stroke-width:2.8;opacity:.95}
.station-icon{width:28px;height:28px;border-radius:8px;border:3px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.30);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900;line-height:1}
.station-icon.status-red{background:#ef3b38}
.station-icon.status-orange{background:#f49a13}
.station-icon.status-yellow{background:#f2c400}
.station-icon.status-green{background:#18a968}
.station-icon.planned{border-radius:50%;width:26px;height:26px}
.station-popup{width:310px;overflow:hidden;border-radius:18px;background:#fff}
.popup-map{display:block;width:100%;height:150px;object-fit:cover;background:#e7ece9}
.popup-content{padding:14px 15px 15px}
.popup-title{font-size:19px;font-weight:800;color:#173d31;margin-bottom:3px}
.popup-location{font-size:12px;color:#7a8781;margin-bottom:12px}
.planned-badge{display:inline-block;background:#eef7f2;color:#18764e;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;margin-bottom:10px}
.energy-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.energy-label{font-size:12px;color:#64736c}.energy-value{font-size:13px;font-weight:800;color:#173d31}
.progress{height:8px;background:#e9eeeb;border-radius:10px;overflow:hidden;margin-bottom:12px}
.progress-inner{height:100%;border-radius:10px}
.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.info-box{background:#f4f7f5;border-radius:9px;padding:8px}
.info-label{font-size:10px;color:#7a8781}.info-value{font-size:13px;font-weight:800;color:#173d31;margin-top:2px}
.nav-button{display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none;background:#173d31;color:#fff;padding:11px;border-radius:10px;font-size:13px;font-weight:800}

.legend{position:absolute;right:10px;bottom:12px;background:rgba(255,255,255,.96);border-radius:13px;padding:9px 11px;box-shadow:0 5px 18px rgba(0,0,0,.16);z-index:2000;min-width:155px}
.legend-title{color:#173d31;font-size:14px;font-weight:800;margin-bottom:7px}
.legend-row{display:flex;align-items:center;margin:5px 0;color:#3f5149;font-size:11px}

}

const map = L.map("map", {
  center:SLOVAKIA_CENTER,
  zoom:7.65,
  minZoom:7.15,
  maxZoom:19,
  maxBounds:SLOVAKIA_MAX_BOUNDS,
  maxBoundsViscosity:1,
  worldCopyJump:false,
  zoomControl:true,
  preferCanvas:true,
  attributionControl:true
});

const tiles = L.tileLayer(
  "https://api.mapy.com/v1/maptiles/outdoor/256/{z}/{x}/{y}?apikey="+encodeURIComponent(MAPY_API_KEY)+"&lang=sk",
  {
    minZoom:0,maxZoom:19,tileSize:256,noWrap:true,
    updateWhenIdle:true,keepBuffer:2,
    attribution:'<a href="https://mapy.com/" target="_blank">Mapy.com</a> © Seznam.cz a ďalší'
  }
).addTo(map);

map.createPane("slovakiaDimmerPane");
map.getPane("slovakiaDimmerPane").style.zIndex=350;
map.getPane("slovakiaDimmerPane").style.pointerEvents="none";

map.createPane("regionsPane");
map.getPane("regionsPane").style.zIndex=450;
map.getPane("regionsPane").style.pointerEvents="none";

map.createPane("stationsPane");
map.getPane("stationsPane").style.zIndex=600;

let regionsData = null;
let dimmerSvg = null;
let dimmerMaskPath = null;
let regionsLayer = null;
let borderLayer = null;

function makePath(geometry){
  if(!geometry) return "";
  let d="";
  const ringPath = ring => {
    if(!ring || ring.length<2) return "";
    return ring.map((p,i)=>{
      const pt=map.latLngToContainerPoint([p[1],p[0]]);
      return (i===0?"M ":"L ")+pt.x+" "+pt.y+" ";
    }).join("")+"Z ";
  };
  if(geometry.type==="Polygon"){
    geometry.coordinates.forEach(r=>d+=ringPath(r));
  } else if(geometry.type==="MultiPolygon"){
    geometry.coordinates.forEach(poly=>poly.forEach(r=>d+=ringPath(r)));
  }
  return d;
}

function updateDimmer(){
  if(!dimmerSvg || !dimmerMaskPath || !regionsData) return;
  let d="";
  regionsData.features.forEach(f=>d+=makePath(f.geometry));
  dimmerMaskPath.setAttribute("d",d);
  const s=map.getSize();
  dimmerSvg.setAttribute("viewBox",`0 0 ${s.x} ${s.y}`);
}

function createDimmer(){
  const pane=map.getPane("slovakiaDimmerPane");
  pane.innerHTML="";
  dimmerSvg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  dimmerSvg.setAttribute("class","slovakia-dimmer-svg");
  dimmerSvg.setAttribute("viewBox",`0 0 ${map.getSize().x} ${map.getSize().y}`);
  const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  const mask=document.createElementNS("http://www.w3.org/2000/svg","mask");
  mask.setAttribute("id","skMask");
  mask.setAttribute("maskUnits","userSpaceOnUse");
  const outer=document.createElementNS("http://www.w3.org/2000/svg","rect");
  outer.setAttribute("x","0");outer.setAttribute("y","0");outer.setAttribute("width","100%");outer.setAttribute("height","100%");outer.setAttribute("fill","white");
  dimmerMaskPath=document.createElementNS("http://www.w3.org/2000/svg","path");
  dimmerMaskPath.setAttribute("fill","black");
  dimmerMaskPath.setAttribute("fill-rule","evenodd");
  mask.appendChild(outer);mask.appendChild(dimmerMaskPath);defs.appendChild(mask);dimmerSvg.appendChild(defs);
  const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
  rect.setAttribute("class","slovakia-dimmer-rect");rect.setAttribute("x","0");rect.setAttribute("y","0");rect.setAttribute("width","100%");rect.setAttribute("height","100%");rect.setAttribute("mask","url(#skMask)");
  dimmerSvg.appendChild(rect);pane.appendChild(dimmerSvg);
}

function statusClass(p){
  if(p<=20) return "status-red";
  if(p<=40) return "status-orange";
  if(p<=60) return "status-yellow";
  return "status-green";
}

function mapImage(station){
  return "https://api.mapy.com/v1/static/map?lon="+encodeURIComponent(station.lng)+
    "&lat="+encodeURIComponent(station.lat)+
    "&zoom=14&width=620&height=280&scale=1&mapset=outdoor"+
    "&markers=color%3Agreen%3Bsize%3Anormal%3B"+encodeURIComponent(station.lng+","+station.lat)+
    "&apikey="+encodeURIComponent(MAPY_API_KEY);
}

function navigationUrl(station){
  return "https://mapy.com/fnc/v1/route?end="+
    encodeURIComponent(station.lng+","+station.lat)+
    "&routeType=bike_mountain&navigate=true";
}

function showStationPopup(station){
  const currentCharges=Math.floor((station.battery*1000*0.9*station.percent/100)/800);
  const popup = `
    <div class="station-popup">
      <img class="popup-map" src="${mapImage(station)}" alt="Poloha stanice" onerror="this.style.display='none'">
      <div class="popup-content">
        <div class="popup-title">⚡ ${station.name}</div>
        <div class="popup-location">📍 ${station.city}, Trenčiansky kraj</div>
        ${station.planned ? '<div class="planned-badge">PLÁNOVANÁ LOKALITA SIETE</div>' : ''}
        <div class="energy-row"><span class="energy-label">Stav energie</span><span class="energy-value">${station.percent} %</span></div>
        <div class="progress"><div class="progress-inner ${statusClass(station.percent)}" style="width:${station.percent}%"></div></div>
        <div class="popup-grid">
          <div class="info-box"><div class="info-label">FVE výkon</div><div class="info-value">${station.solar} kWp</div></div>
          <div class="info-box"><div class="info-label">Batéria</div><div class="info-value">${station.battery} kWh</div></div>
          <div class="info-box"><div class="info-label">Nabíjacie porty</div><div class="info-value">${station.ports}</div></div>
          <div class="info-box"><div class="info-label">Aktuálne nabitia</div><div class="info-value">cca ${currentCharges}</div></div>
        </div>
        <a class="nav-button" href="${navigationUrl(station)}" target="_blank" rel="noopener">📍 NAVIGOVAŤ NA STANICU</a>
        <a class="location-button" href="https://mapy.com/fnc/v1/showmap?mapset=outdoor&center=${station.lng},${station.lat}&zoom=15&marker=true" target="_blank" rel="noopener">Otvoriť miesto v Mapy.com</a>
      </div>
    </div>`;
  return popup;
}

const stationLayer=L.layerGroup().addTo(map);

stations.forEach(station=>{
  const icon=L.divIcon({
    className:"",
    html:`<div class="station-icon ${statusClass(station.percent)} planned">⚡</div>`,
    iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-12]
  });
  const marker=L.marker([station.lat,station.lng],{
    icon,pane:"stationsPane",riseOnHover:true,zIndexOffset:1000
  });
  marker.bindPopup(showStationPopup(station),{
    maxWidth:320,minWidth:285,closeButton:true,autoPan:true,
    autoPanPadding:[20,90],keepInView:true
  });
  stationLayer.addLayer(marker);
});

async function loadRegions(){
  try{
    const response=await fetch(REGIONS_URL,{cache:"force-cache"});
    if(!response.ok) throw new Error("GeoJSON HTTP "+response.status);
    const all=await response.json();
    const skFeatures=all.features.filter(f=>String(f.properties?.id||"").startsWith("SK"));
    if(skFeatures.length<8) throw new Error("SK regions missing");
    regionsData={type:"FeatureCollection",features:skFeatures};

    createDimmer();

    regionsLayer=L.geoJSON(regionsData,{
      pane:"regionsPane",
      interactive:false,
      style:f=>{
        const id=f.properties?.id;
        return id==="SK022"
          ? {className:"region-trencin",fillColor:"#19a968",fillOpacity:.12,color:"#173d31",weight:3,opacity:1}
          : {className:"region-other",fillColor:"#858e8a",fillOpacity:.68,color:"#69736e",weight:1.5,opacity:.75};
      }
    }).addTo(map);

    borderLayer=L.geoJSON(regionsData,{
      pane:"regionsPane",interactive:false,
      style:{fill:false,color:"#173d31",weight:2.5,opacity:.95}
    }).addTo(map);

    const bounds=regionsLayer.getBounds();
    map.fitBounds(bounds,{paddingTopLeft:[20,20],paddingBottomRight:[20,20],maxZoom:8});
    updateDimmer();
    document.getElementById("loading").style.display="none";
  }catch(e){
    console.error(e);
    document.getElementById("loading").style.display="none";
    document.getElementById("error").style.display="block";
  }
}

map.on("move zoom resize",updateDimmer);
map.on("popupopen",e=>{ setTimeout(()=>e.popup.update(),50); });
window.addEventListener("resize",()=>map.invalidateSize());

loadRegions();
setTimeout(()=>{map.invalidateSize();updateDimmer()},300);
</script>
