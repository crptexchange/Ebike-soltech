<!doctype html>
<html lang="sk">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>ebike-soltech</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================
   ZÁKLAD
========================= */

*{
  box-sizing:border-box;
}

html,
body,
#app{
  height:100%;
  margin:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#eef3ef;
  color:#17372b;

  overflow:hidden;
}

#app{
  display:flex;
  flex-direction:column;
}


/* =========================
   HLAVIČKA
========================= */

.top{
  height:72px;
  min-height:72px;

  background:#fff;

  display:flex;
  align-items:center;

  padding:
    8px 18px;

  box-shadow:
    0 2px 14px #0002;

  z-index:1000;
}

.brand{
  font-size:22px;
  font-weight:900;
  line-height:1.05;

  letter-spacing:-0.5px;
}

.brand small{
  display:block;

  font-size:10px;

  color:#77847e;

  font-weight:600;

  margin-top:5px;

  letter-spacing:0;
}


/* =========================
   MAPA
========================= */

#map{
  flex:1;
  min-height:0;
  width:100%;

  background:#d8ddda;
}


/*
  Dôležité pre plynulosť
*/

.leaflet-container{
  background:#d8ddda;
}

.leaflet-tile{
  will-change:transform;
}

.leaflet-control-attribution{
  font-size:9px;
}


/* =========================
   PANELY MAPY
========================= */

.leaflet-pane.map-shading-pane{
  z-index:390;
}

.leaflet-pane.region-pane{
  z-index:400;
}

.leaflet-pane.station-pane{
  z-index:650;
}


/* =========================
   STANICA
========================= */

.station-pin{
  width:28px;
  height:36px;

  position:relative;

  filter:
    drop-shadow(0 3px 4px rgba(0,0,0,.25));
}


/*
  samotná vlajočka
*/

.station-pin:before{
  content:"";

  position:absolute;

  left:2px;
  top:1px;

  width:22px;
  height:22px;

  border:
    3px solid #fff;

  border-radius:
    50% 50% 50% 0;

  transform:
    rotate(-45deg);
}


/*
  elektrina
*/

.station-pin span{
  position:absolute;

  z-index:2;

  left:0;
  top:4px;

  width:28px;

  text-align:center;

  color:#fff;

  font-size:11px;

  font-weight:900;

  text-shadow:
    0 1px 2px rgba(0,0,0,.25);
}


/* farby */

.station-red:before{
  background:#e53935;
}

.station-orange:before{
  background:#f39c12;
}

.station-green:before{
  background:#18a866;
}

.station-blue:before{
  background:#2879d3;
}


/* =========================
   POPUP
========================= */

.popup{
  min-width:235px;
}

.popup h3{
  margin:0 0 4px;

  font-size:17px;

  font-weight:900;
}

.sub{
  color:#718079;
  font-size:12px;
}

.ok{
  color:#0d9d5a;

  font-weight:800;

  font-size:12px;

  margin:9px 0;
}

.empty{
  color:#e53935;

  font-weight:900;

  font-size:12px;

  margin:9px 0;
}

.low{
  color:#f39c12;

  font-weight:900;

  font-size:12px;

  margin:9px 0;
}


/* =========================
   KAPACITA
========================= */

.meter{
  height:8px;

  background:#e5ebe7;

  border-radius:8px;

  overflow:hidden;

  margin-top:5px;
}

.meter i{
  display:block;

  height:100%;
}

.meter-red{
  background:#e53935;
}

.meter-orange{
  background:#f39c12;
}

.meter-green{
  background:#18a866;
}

.meter-blue{
  background:#2879d3;
}


/* =========================
   ŠTATISTIKY
========================= */

.stats{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

  margin-top:9px;
}

.stat{
  border:
    1px solid #e4e9e6;

  border-radius:8px;

  padding:7px;
}

.stat b{
  display:block;

  font-size:14px;
}

.stat small{
  color:#718079;

  font-size:9px;
}


/* =========================
   NAVIGÁCIA
========================= */

.nav{
  display:block;

  text-align:center;

  margin-top:9px;

  padding:8px;

  background:#16a566;

  color:#fff;

  text-decoration:none;

  border-radius:8px;

  font-weight:800;

  font-size:12px;
}


/* =========================
   LEGENDA
========================= */

.legend{
  background:#fff;

  padding:10px 12px;

  border-radius:12px;

  box-shadow:
    0 3px 14px #0003;

  font-size:11px;

  line-height:19px;
}

.legend-title{
  font-weight:900;

  margin-bottom:4px;

  font-size:12px;
}

.legend-row{
  display:flex;

  align-items:center;

  gap:7px;
}

.legend-dot{
  width:11px;
  height:11px;

  border-radius:50%;

  flex:none;
}

.dot-red{
  background:#e53935;
}

.dot-orange{
  background:#f39c12;
}

.dot-green{
  background:#18a866;
}

.dot-blue{
  background:#2879d3;
}


/* =========================
   NÁZOV KRAJA
========================= */

.region-label{
  background:
    rgba(255,255,255,.94);

  border:
    1px solid rgba(0,0,0,.08);

  color:#17372b;

  font-weight:800;

  font-size:12px;

  padding:
    7px 11px;

  border-radius:10px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.18);

  white-space:nowrap;
}

.region-label:before{
  display:none;
}


/* =========================
   MOBIL
========================= */

@media(max-width:600px){

  .top{
    height:74px;
    min-height:74px;

    padding:
      8px 18px;
  }

  .brand{
    font-size:21px;
  }

  .brand small{
    font-size:9px;
  }

  .legend{
    margin-bottom:4px;
    margin-right:4px;
  }

}


/* =========================
   ZÁKAZ SELEKCIE
========================= */

.leaflet-container,
.leaflet-control{
  -webkit-user-select:none;
  user-select:none;
}

</style>

</head>


<body>

<div id="app">

  <div class="top">

    <div class="brand">

      ⚡ ebike-soltech

      <small>
        Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
      </small>

    </div>

  </div>


  <div id="map"></div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ============================================================
   MAPA
============================================================ */

const map = L.map("map",{

  zoomControl:true,

  minZoom:7,

  maxZoom:18,

  zoomSnap:0.25,

  zoomDelta:1,

  preferCanvas:true,

  zoomAnimation:true,

  fadeAnimation:false,

  markerZoomAnimation:false,

  inertia:true,

  inertiaDeceleration:2800,

  worldCopyJump:false

});


map.setView(
  [48.82,18.15],
  9
);


/* ============================================================
   OPENSTREETMAP
============================================================ */

const tiles = L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:19,

    updateWhenZooming:false,

    updateWhenIdle:true,

    keepBuffer:3,

    attribution:
      "© OpenStreetMap contributors"

  }

);


tiles.addTo(map);


/* ============================================================
   PANES
============================================================ */

map.createPane("map-shading-pane");

map.createPane("region-pane");

map.createPane("station-pane");


map.getPane(
  "map-shading-pane"
).style.pointerEvents="none";


map.getPane(
  "region-pane"
).style.pointerEvents="none";


map.getPane(
  "station-pane"
).style.pointerEvents="auto";


/* ============================================================
   DATA STANÍC
============================================================ */

/*
  názov
  latitude
  longitude
  kapacita %
  obsadené konektory
*/

const stations = [

  ["Trenčín",
    48.8945,18.044,
    0,8
  ],

  ["Beckov",
    48.7880,17.898,
    92,1
  ],

  ["Nové Mesto nad Váhom",
    48.7570,17.830,
    33,6
  ],

  ["Myjava",
    48.7580,17.568,
    82,1
  ],

  ["Dubnica nad Váhom",
    48.9610,18.167,
    64,5
  ],

  ["Ilava",
    49.0010,18.236,
    41,7
  ],

  ["Púchov",
    49.1240,18.325,
    0,8
  ],

  ["Považská Bystrica",
    49.1150,18.449,
    58,4
  ],

  ["Trenčianske Teplice",
    48.9100,18.168,
    56,4
  ],

  ["Nemšová",
    48.9670,18.119,
    17,7
  ],

  ["Bánovce nad Bebravou",
    48.7210,18.257,
    73,2
  ],

  ["Bojnice",
    48.7810,18.585,
    0,8
  ],

  ["Partizánske",
    48.6290,18.384,
    61,3
  ],

  ["Brezová pod Bradlom",
    48.6640,17.540,
    69,2
  ],

  ["Čachtice",
    48.7140,17.787,
    52,5
  ],

  ["Duchonka",
    48.6980,18.070,
    0,8
  ],

  ["Manínska tiesňava",
    49.1760,18.486,
    88,1
  ],

  ["Stará Turá",
    48.7780,17.695,
    45,5
  ],

  ["Handlová",
    48.7270,18.760,
    67,3
  ],

  ["Inovec",
    48.8100,18.030,
    84,1
  ],

  ["Zelená Voda",
    48.7600,17.988,
    12,7
  ],

  ["Skalka",
    48.8940,18.009,
    0,8
  ],

  ["Lazy pod Makytou",
    49.2210,18.234,
    54,4
  ]

];


/* ============================================================
   STATUS STANICE
============================================================ */

function getStatus(pct){

  if(pct===0){

    return{

      marker:"station-red",

      meter:"meter-red"

    };

  }


  if(pct<=20){

    return{

      marker:"station-orange",

      meter:"meter-orange"

    };

  }


  if(pct<=70){

    return{

      marker:"station-green",

      meter:"meter-green"

    };

  }


  return{

    marker:"station-blue",

    meter:"meter-blue"

  };

}


/* ============================================================
   MARKERY
============================================================ */

function createStationMarker(station){

  const name=station[0];

  const lat=station[1];

  const lon=station[2];

  const pct=station[3];

  const occupied=station[4];

  const status=getStatus(pct);


  const icon=L.divIcon({

    className:"",

    html:

      '<div class="station-pin '+
      status.marker+
      '">' +

      '<span>⚡</span>' +

      '</div>',

    iconSize:[28,36],

    iconAnchor:[14,36]

  });


  let statusHTML;


  if(pct===0){

    statusHTML=

      '<div class="empty">'+
      '● STANICA JE ÚPLNE VYBITÁ'+
      '</div>';

  }

  else if(pct<=20){

    statusHTML=

      '<div class="low">'+
      '● NÍZKA KAPACITA'+
      '</div>';

  }

  else{

    statusHTML=

      '<div class="ok">'+
      '● STANICA V PREVÁDZKE'+
      '</div>';

  }


  const bikeEquivalent =
    pct===0
      ? "0"
      : (pct/25).toFixed(1);


  const popupHTML=`

    <div class="popup">

      <h3>
        ⚡ ebike-soltech
      </h3>

      <div class="sub">
        📍 ${name}
      </div>

      ${statusHTML}

      <b>
        Nabitá kapacita: ${pct}%
      </b>

      <div class="meter">

        <i
          class="${status.meter}"
          style="width:${pct}%">
        </i>

      </div>


      <div class="stats">

        <div class="stat">

          <b>
            ${occupied} / 8
          </b>

          <small>
            obsadené konektory
          </small>

        </div>


        <div class="stat">

          <b>
            ${bikeEquivalent}
          </b>

          <small>
            ekvivalent plných e-bikov
          </small>

        </div>


        <div class="stat">

          <b>
            8×
          </b>

          <small>
            e-bike konektor
          </small>

        </div>


        <div class="stat">

          <b>
            1×
          </b>

          <small>
            230 V smartfón
          </small>

        </div>

      </div>


      <a
        class="nav"
        target="_blank"
        rel="noopener"
        href="https://mapy.com/zakladni?x=${lon}&y=${lat}&z=15"
      >
        ➤ Navigovať v Mapy.com
      </a>

    </div>

  `;


  return L.marker(

    [lat,lon],

    {

      icon:icon,

      pane:"station-pane",

      keyboard:false,

      riseOnHover:true

    }

  )

  .addTo(map)

  .bindPopup(

    popupHTML,

    {

      maxWidth:300,

      closeButton:true,

      autoPan:true

    }

  );

}


stations.forEach(
  createStationMarker
);


/* ============================================================
   LEGENDA
============================================================ */

const legend=L.control({

  position:"bottomright"

});


legend.onAdd=function(){

  const div=L.DomUtil.create(
    "div",
    "legend"
  );


  div.innerHTML=`

    <div class="legend-title">
      Stav stanice
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-red"></span>
      0 % – vybitá
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-orange"></span>
      1–20 % – nízka
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-green"></span>
      21–70 % – dostupná
    </div>

    <div class="legend-row">
      <span class="legend-dot dot-blue"></span>
      71–100 % – vysoká
    </div>

  `;


  return div;

};


legend.addTo(map);


/* ============================================================
   REÁLNE HRANICE
============================================================ */

/*
  Používame skutočné GIS hranice:

  1. celé Slovensko
  2. jednotlivé kraje

  Nie ručne nakreslený polygon.
*/

const REGIONS_URL=
  "https://simplemaps.com/static/svg/country/sk/admin1/sk.json";

const COUNTRY_URL=
  "https://simplemaps.com/static/svg/country/sk/all/sk.json";


/* ============================================================
   POMOCNÉ FUNKCIE
============================================================ */

function convertRing(ring){

  return ring.map(
    function(point){

      return [
        point[1],
        point[0]
      ];

    }
  );

}


function convertGeometry(geometry){

  if(
    !geometry ||
    !geometry.coordinates
  ){

    return [];

  }


  if(geometry.type==="Polygon"){

    return geometry.coordinates.map(
      convertRing
    );

  }


  if(geometry.type==="MultiPolygon"){

    return geometry.coordinates.map(
      function(polygon){

        return polygon.map(
          convertRing
        );

      }
    );

  }


  return [];

}


/* ============================================================
   VYKRESLENIE MAPY
============================================================ */

Promise.all([

  fetch(REGIONS_URL)
    .then(function(r){

      if(!r.ok)
        throw new Error(
          "Nepodarilo sa načítať kraje."
        );

      return r.json();

    }),

  fetch(COUNTRY_URL)
    .then(function(r){

      if(!r.ok)
        throw new Error(
          "Nepodarilo sa načítať Slovensko."
        );

      return r.json();

    })

])

.then(function(data){

  const regions=data[0];

  const country=data[1];


  /* ========================================================
     1. ZATEMNENIE OKOLIA SLOVENSKA
  ======================================================== */

  const world=[

    [90,-180],

    [90,180],

    [-90,180],

    [-90,-180]

  ];


  const countryGeometry=
    country.features[0].geometry;


  let countryRings=[];


  if(
    countryGeometry.type==="Polygon"
  ){

    countryRings=
      countryGeometry.coordinates
        .map(convertRing);

  }


  /*
    Svet je sivý,
    Slovensko je z tejto vrstvy vyrezané.
  */

  const outsidePolygon=L.polygon(

    [
      world,
      ...countryRings
    ],

    {

      pane:"map-shading-pane",

      stroke:false,

      fillColor:"#68716e",

      fillOpacity:0.82,

      interactive:false

    }

  );


  outsidePolygon.addTo(map);


  /* ========================================================
     2. SLOVENSKO – JEMNE ŠEDÉ
  ======================================================== */

  const slovakiaLayer=L.geoJSON(

    regions,

    {

      pane:"region-pane",

      renderer:L.canvas({

        padding:0.5

      }),

      style:function(feature){

        const id=
          feature.properties &&
          feature.properties.id;


        /*
          Trenčiansky kraj nechávame
          úplne viditeľný.
        */

        if(id==="SKTC"){

          return{

            color:"#ffffff",

            weight:3,

            opacity:1,

            fillOpacity:0

          };

        }


        return{

          color:"#ffffff",

          weight:1.5,

          opacity:0.75,

          fillColor:"#e3e8e5",

          fillOpacity:0.66

        };

      },

      interactive:false

    }

  );


  slovakiaLayer.addTo(map);


  /* ========================================================
     3. TRENČIANSKY KRAJ
  ======================================================== */

  let trenciansky=null;


  regions.features.forEach(

    function(feature){

      if(
        feature.properties &&
        feature.properties.id==="SKTC"
      ){

        trenciansky=feature;

      }

    }

  );


  if(trenciansky){

    const tnLayer=L.geoJSON(

      trenciansky,

      {

        pane:"region-pane",

        renderer:L.canvas({

          padding:0.5

        }),

        style:{

          color:"#ffffff",

          weight:3,

          opacity:1,

          fillColor:"#36b978",

          fillOpacity:0.12

        },

        interactive:false

      }

    );


    tnLayer.addTo(map);


    /*
      Názov kraja umiestnime približne
      do stredu skutočného polygonu.
    */

    const center=tnLayer.getBounds()
      .getCenter();


    L.marker(

      center,

      {

        pane:"region-pane",

        interactive:false,

        icon:L.divIcon({

          className:"",

          html:
            '<div class="region-label">'+
            'TRENČIANSKY KRAJ'+
            '</div>',

          iconSize:null,

          iconAnchor:[75,15]

        })

      }

    ).addTo(map);

  }


  /* ========================================================
     4. ZOOM NA SLOVENSKO / KRAJ
  ======================================================== */

  if(trenciansky){

    const bounds=
      L.geoJSON(trenciansky)
        .getBounds();


    /*
      Nezoomujeme príliš blízko.
      Stanice aj širšie okolie zostanú viditeľné.
    */

    map.fitBounds(

      bounds,

      {

        paddingTopLeft:[30,30],

        paddingBottomRight:[30,80],

        maxZoom:9.5,

        animate:false

      }

    );

  }


  /*
    Po dokončení prekreslenia
  */

  setTimeout(

    function(){

      map.invalidateSize();

    },

    300

  );

})


.catch(function(error){

  console.error(
    "Chyba pri načítaní hraníc:",
    error
  );

});


/* ============================================================
   OCHRANA PROTI ZBYTOČNÉMU PREKRESĽOVANIU
============================================================ */

let resizeTimer=null;


window.addEventListener(

  "resize",

  function(){

    clearTimeout(resizeTimer);


    resizeTimer=setTimeout(

      function(){

        map.invalidateSize();

      },

      150

    );

  }

);


/* ============================================================
   KONEC
============================================================ */

</script>

</body>
</html>
