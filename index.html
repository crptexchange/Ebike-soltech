<!doctype html>
<html lang="sk">
<head>

<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ebike-soltech</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

*{
  box-sizing:border-box;
}

html,
body,
#app{
  height:100%;
  margin:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#eef3ef;
  color:#17372b;
  overflow:hidden;
}

#app{
  display:flex;
  flex-direction:column;
}

/* =====================================================
   HEADER
===================================================== */

.top{

  height:76px;
  min-height:76px;

  background:#fff;

  display:flex;
  align-items:center;

  padding:
    8px
    20px;

  box-shadow:
    0 2px 14px rgba(0,0,0,.10);

  position:relative;
  z-index:1000;
}

.brand{

  font-size:23px;
  font-weight:900;

  line-height:1.05;

  letter-spacing:-.5px;
}

.brand span{
  color:#17372b;
}

.brand small{

  display:block;

  font-size:11px;

  color:#7b8882;

  font-weight:600;

  margin-top:5px;

  letter-spacing:.1px;
}

/* =====================================================
   MAP
===================================================== */

#map{

  flex:1;

  min-height:0;

  width:100%;

  background:#d9ddda;
}

/* =====================================================
   LEAFLET
===================================================== */

.leaflet-control-zoom{

  border:none !important;

  box-shadow:
    0 2px 8px rgba(0,0,0,.22) !important;
}

.leaflet-control-zoom a{

  width:44px !important;
  height:44px !important;

  line-height:44px !important;

  font-size:28px !important;

  color:#111 !important;

  background:#fff !important;
}

.leaflet-control-attribution{

  font-size:9px;

  background:rgba(255,255,255,.90);
}

/* =====================================================
   SLOVAKIA MASK
===================================================== */

/*
  Všetko mimo Slovenska je prekryté jediným SVG
  overlayom. Mapa pod ním stále funguje normálne,
  ale používateľ vidí iba Slovensko.
*/

.slovakia-mask{

  pointer-events:none;

  position:absolute;

  inset:0;

  z-index:450;
}

.slovakia-mask svg{

  width:100%;
  height:100%;

  display:block;
}

/* =====================================================
   STANICA
===================================================== */

.station-wrap{

  position:relative;

  width:30px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;
}

.station{

  width:27px;
  height:27px;

  border-radius:6px;

  border:2px solid #fff;

  box-shadow:
    0 3px 10px rgba(0,0,0,.32);

  position:relative;

  transform:rotate(-45deg);

  display:flex;

  align-items:center;
  justify-content:center;
}

.station:after{

  content:"";

  position:absolute;

  width:8px;
  height:8px;

  bottom:-5px;
  left:7px;

  background:inherit;

  border-right:2px solid #fff;
  border-bottom:2px solid #fff;

  transform:rotate(0deg);
}

/* FV PANEL */

.station-panel{

  width:16px;
  height:10px;

  border:1px solid rgba(255,255,255,.9);

  border-radius:2px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.35),
      rgba(255,255,255,.05)
    );

  transform:rotate(45deg);

  position:relative;

  z-index:3;
}

.station-panel:before{

  content:"";

  position:absolute;

  left:50%;
  top:0;

  width:1px;
  height:100%;

  background:rgba(255,255,255,.55);
}

.station-panel:after{

  content:"⚡";

  position:absolute;

  left:2px;
  top:-7px;

  color:#ffd600;

  font-size:11px;

  font-weight:900;

  text-shadow:
    0 1px 2px rgba(0,0,0,.4);
}

/* =====================================================
   FARBY
===================================================== */

.station-red{
  background:#ef3d3d;
}

.station-orange{
  background:#f39a16;
}

.station-yellow{
  background:#f1c40f;
}

.station-green{
  background:#18a968;
}

/* =====================================================
   ANIMÁCIA
===================================================== */

.station-pulse{

  position:absolute;

  width:28px;
  height:28px;

  border-radius:50%;

  opacity:0;

  animation:
    stationPulse 2.5s infinite;
}

.station-red .station-pulse{
  background:#ef3d3d;
}

.station-orange .station-pulse{
  background:#f39a16;
}

.station-yellow .station-pulse{
  background:#f1c40f;
}

.station-green .station-pulse{
  background:#18a968;
}

@keyframes stationPulse{

  0%{
    transform:scale(.7);
    opacity:.45;
  }

  70%{
    transform:scale(1.8);
    opacity:0;
  }

  100%{
    opacity:0;
  }

}

/* =====================================================
   POPUP
===================================================== */

.leaflet-popup-content-wrapper{

  border-radius:16px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.20);
}

.leaflet-popup-content{

  margin:14px;

  width:280px !important;
}

.popup{

  color:#17372b;
}

.popup-title{

  display:flex;

  align-items:center;

  gap:8px;

  font-size:18px;

  font-weight:900;

  margin-bottom:3px;
}

.popup-location{

  color:#78857f;

  font-size:12px;

  margin-bottom:10px;
}

.status{

  display:inline-flex;

  align-items:center;

  gap:6px;

  padding:5px 9px;

  border-radius:20px;

  background:#edf7f1;

  color:#15965c;

  font-size:11px;

  font-weight:800;

  margin-bottom:12px;
}

.status-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#19a866;
}

.capacity-title{

  font-size:12px;

  color:#68766f;

  margin-bottom:4px;
}

.capacity{

  font-size:25px;

  font-weight:900;

  margin-bottom:6px;
}

.capacity-bar{

  height:9px;

  border-radius:20px;

  background:#e8ece9;

  overflow:hidden;

  margin-bottom:13px;
}

.capacity-fill{

  height:100%;

  border-radius:20px;
}

.info-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

  margin-top:8px;
}

.info-box{

  border:1px solid #e5eae7;

  border-radius:10px;

  padding:9px;

  background:#fafcfb;
}

.info-box strong{

  display:block;

  font-size:15px;

  margin-bottom:2px;
}

.info-box span{

  display:block;

  color:#78857f;

  font-size:10px;

  line-height:1.25;
}

.energy{

  margin-top:10px;

  padding:11px;

  border-radius:11px;

  background:#eef8f3;

  border:1px solid #d9eee3;
}

.energy strong{

  display:block;

  font-size:13px;

  margin-bottom:3px;
}

.energy span{

  font-size:11px;

  color:#63726b;

  line-height:1.35;
}

.nav-button{

  display:block;

  text-align:center;

  margin-top:11px;

  padding:10px;

  border-radius:10px;

  background:#16a566;

  color:#fff;

  text-decoration:none;

  font-size:12px;

  font-weight:900;
}

/* =====================================================
   LEGENDA
===================================================== */

.legend{

  background:#fff;

  padding:12px 14px;

  border-radius:14px;

  box-shadow:
    0 4px 18px rgba(0,0,0,.18);

  font-size:11px;

  line-height:20px;
}

.legend-title{

  font-size:13px;

  font-weight:900;

  margin-bottom:5px;
}

.legend-row{

  display:flex;

  align-items:center;

  gap:7px;
}

.legend-dot{

  width:11px;
  height:11px;

  border-radius:50%;

  display:inline-block;
}

.red{
  background:#ef3d3d;
}

.orange{
  background:#f39a16;
}

.yellow{
  background:#f1c40f;
}

.green{
  background:#18a968;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .top{

    height:74px;
    min-height:74px;

    padding-left:17px;
  }

  .brand{

    font-size:21px;
  }

  .brand small{

    font-size:10px;
  }

  .leaflet-control-zoom{

    margin-top:8px !important;
    margin-left:8px !important;
  }

  .leaflet-control-zoom a{

    width:42px !important;
    height:42px !important;

    line-height:42px !important;
  }

  .legend{

    margin-right:8px !important;
    margin-bottom:8px !important;
  }

}

/* =====================================================
   LOADING
===================================================== */

.map-loading{

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:900;

  background:#fff;

  padding:13px 17px;

  border-radius:12px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.18);

  font-size:12px;

  font-weight:800;

  color:#17372b;
}

</style>

</head>

<body>

<div id="app">

  <header class="top">

    <div class="brand">

      ⚡ <span>ebike-soltech</span>

      <small>
        Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
      </small>

    </div>

  </header>

  <main id="map"></main>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =====================================================
   MAPY.COM API
===================================================== */

/*
  SEM VLOŽ NOVÝ API KĽÚČ Z MAPY.COM

  Kľúč musí mať povolené:
  - Map tiles

  Pri HTTP refereri môžeš povoliť:
  crptexchange.github.io
*/

const MAPY_API_KEY =
  "VLOZ_NOVY_API_KLUC";


/* =====================================================
   MAPA
===================================================== */

const map = L.map("map",{

  zoomControl:true,

  minZoom:7,

  maxZoom:18,

  zoomSnap:0.25,

  zoomDelta:0.5,

  wheelPxPerZoomLevel:100,

  preferCanvas:true,

  fadeAnimation:false,

  markerZoomAnimation:true,

  zoomAnimation:true

}).setView(

  [48.72,19.45],

  8

);


/* =====================================================
   MAPY.COM TURISTICKÁ MAPA
===================================================== */

const outdoor = L.tileLayer(

  "https://api.mapy.com/v1/maptiles/" +
  "outdoor/{z}/{x}/{y}" +
  "?apikey=" + MAPY_API_KEY +
  "&lang=sk" +
  "&tileSize=256",

  {

    minZoom:7,

    maxZoom:18,

    maxNativeZoom:18,

    attribution:
      '<a href="https://mapy.com/" target="_blank">' +
      'Mapy.com</a> | ' +
      '© OpenStreetMap contributors',

    updateWhenZooming:false,

    updateWhenIdle:true,

    keepBuffer:2

  }

).addTo(map);


/* =====================================================
   SLOVENSKO – HRANICA
===================================================== */

const slovakia = [

  [49.496230,18.853144],
  [49.435846,18.909575],
  [49.571574,19.320713],
  [49.217125,19.825023],
  [49.431453,20.415839],
  [49.328772,20.887955],
  [49.470107,21.607808],
  [49.085738,22.558138],
  [48.825392,22.280842],
  [48.422264,22.085608],
  [48.319971,21.872236],
  [48.623854,20.801294],
  [48.562850,20.473562],
  [48.327567,20.239054],
  [48.202691,19.769471],
  [48.266615,19.661364],
  [48.111379,19.174365],
  [48.081768,18.777025],
  [47.880954,18.696513],
  [47.758429,17.857133],
  [47.867466,17.488473],
  [48.123497,16.979667],
  [48.470013,16.879983],
  [48.596982,16.960288],
  [48.816969,17.101985],
  [48.800019,17.545007],
  [48.903475,17.886485],
  [48.996493,17.913512],
  [49.043983,18.104973],
  [49.271515,18.170498],
  [49.315001,18.399994],
  [49.495015,18.554971],
  [49.496230,18.853144]

];


/* =====================================================
   TRENČIANSKY KRAJ
   – vizuálne zvýraznenie
===================================================== */

/*
  Polygon je použitý iba ako vizuálne zvýraznenie
  regiónu. Mapové podklady pod ním zostávajú viditeľné,
  takže obce, cesty, lesy a turistické značky ostávajú
  zachované.
*/

const trencianskyKraj = [

  [49.330,17.820],
  [49.320,18.120],
  [49.330,18.350],
  [49.250,18.560],
  [49.090,18.670],
  [48.900,18.780],
  [48.700,18.720],
  [48.570,18.580],
  [48.520,18.330],
  [48.500,18.080],
  [48.540,17.800],
  [48.610,17.610],
  [48.700,17.500],
  [48.820,17.470],
  [48.960,17.500],
  [49.100,17.650],
  [49.220,17.700],
  [49.330,17.820]

];


/* =====================================================
   FAREBNÝ TRENČIANSKY KRAJ
===================================================== */

L.polygon(

  trencianskyKraj,

  {

    color:"#ffffff",

    weight:2.5,

    opacity:.95,

    fillColor:"#79cfa9",

    fillOpacity:.42,

    interactive:false

  }

).addTo(map);


/* =====================================================
   SLOVENSKÁ MASKA
===================================================== */

/*
  SVG maska:
  - mimo Slovenska = šedá
  - Slovensko = priehľadné
  - žiadne druhé mapové dlaždice
  - pri posúvaní sa nič farebne neprepína
*/

const maskPane = map.createPane("slovakiaMaskPane");

maskPane.style.zIndex = 450;

maskPane.style.pointerEvents = "none";


const maskLayer = L.layerGroup([],{

}).addTo(map);


function createSlovakiaMask(){

  if(window.slovakiaMaskControl){

    window.slovakiaMaskControl.remove();

  }


  const container =
    L.DomUtil.create(
      "div",
      "slovakia-mask"
    );


  container.style.pointerEvents="none";


  const svg =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );


  svg.setAttribute(
    "width",
    "100%"
  );

  svg.setAttribute(
    "height",
    "100%"
  );

  svg.setAttribute(
    "preserveAspectRatio",
    "none"
  );


  const defs =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "defs"
    );


  const mask =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "mask"
    );


  mask.setAttribute(
    "id",
    "slovakiaMask"
  );


  const background =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );


  background.setAttribute(
    "x",
    "0"
  );

  background.setAttribute(
    "y",
    "0"
  );

  background.setAttribute(
    "width",
    "100%"
  );

  background.setAttribute(
    "height",
    "100%"
  );

  background.setAttribute(
    "fill",
    "white"
  );


  mask.appendChild(background);


  const hole =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "polygon"
    );


  const updateHole = function(){

    const points =
      slovakia.map(function(coord){

        const p =
          map.latLngToContainerPoint(
            [coord[0],coord[1]]
          );

        return p.x + "," + p.y;

      }).join(" ");


    hole.setAttribute(
      "points",
      points
    );

  };


  updateHole();


  hole.setAttribute(
    "fill",
    "black"
  );


  mask.appendChild(hole);

  defs.appendChild(mask);

  svg.appendChild(defs);


  const gray =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );


  gray.setAttribute(
    "x",
    "0"
  );

  gray.setAttribute(
    "y",
    "0"
  );

  gray.setAttribute(
    "width",
    "100%"
  );

  gray.setAttribute(
    "height",
    "100%"
  );

  gray.setAttribute(
    "fill",
    "#d8ddda"
  );

  gray.setAttribute(
    "mask",
    "url(#slovakiaMask)"
  );


  svg.appendChild(gray);


  container.appendChild(svg);


  map.getContainer().appendChild(
    container
  );


  window.slovakiaMaskControl = {

    container:container,

    update:updateHole,

    remove:function(){

      if(container.parentNode){

        container.parentNode.removeChild(
          container
        );

      }

    }

  };

}


createSlovakiaMask();


map.on(

  "move",

  function(){

    if(window.slovakiaMaskControl){

      window.slovakiaMaskControl.update();

    }

  }

);

map.on(

  "zoom",

  function(){

    if(window.slovakiaMaskControl){

      window.slovakiaMaskControl.update();

    }

  }

);


/* =====================================================
   STANICE
===================================================== */

/*
  názov
  latitude
  longitude
  kapacita %

  Každá stanica:
  2.0 kWp solárne panely
  7.5 kWh batéria
*/

const stations = [

  ["Trenčín",48.8945,18.0440,78],

  ["Beckov",48.7880,17.8980,92],

  ["Nové Mesto nad Váhom",48.7570,17.8300,34],

  ["Myjava",48.7580,17.5680,63],

  ["Dubnica nad Váhom",48.9610,18.1670,72],

  ["Ilava",49.0010,18.2360,18],

  ["Púchov",49.1240,18.3250,12],

  ["Považská Bystrica",49.1150,18.4490,55],

  ["Trenčianske Teplice",48.9100,18.1680,67],

  ["Nemšová",48.9670,18.1190,81],

  ["Bánovce nad Bebravou",48.7210,18.2570,47],

  ["Bojnice",48.7810,18.5850,96],

  ["Partizánske",48.6290,18.3840,59],

  ["Brezová pod Bradlom",48.6640,17.5400,39],

  ["Čachtice",48.7140,17.7870,74],

  ["Duchonka",48.6980,18.0700,21],

  ["Manínska tiesňava",49.1760,18.4860,88],

  ["Stará Turá",48.7780,17.6950,51],

  ["Handlová",48.7270,18.7600,43],

  ["Inovec",48.8100,18.0300,61],

  ["Zelená Voda",48.7600,17.9880,27],

  ["Skalka",48.8940,18.0090,95],

  ["Lazy pod Makytou",49.2210,18.2340,69],

  ["Kľak",48.9940,18.6630,58],

  ["Zamarovce",48.9090,18.0200,83],

  ["Soblahov",48.8640,18.0860,36],

  ["Mníchova Lehota",48.8390,18.0700,65],

  ["Omšenie",48.9000,18.1650,44],

  ["Pruské",49.0160,18.2980,77],

  ["Lednické Rovné",49.0600,18.3040,31],

  ["Beluša",49.0660,18.3330,56],

  ["Pružina",49.0960,18.5220,73],

  ["Papradno",49.2140,18.4380,25],

  ["Zliechov",48.9620,18.4430,64],

  ["Valaská Belá",48.9600,18.3990,82],

  ["Nitrianske Rudno",48.7860,18.4640,49],

  ["Kľačno",48.8910,18.6370,37],

  ["Rybany",48.6540,18.2510,71],

  ["Uhrovec",48.7410,18.3360,57],

  ["Haluzice",48.7770,18.0400,29]

];


/* =====================================================
   STAV
===================================================== */

function getStatus(percent){

  if(percent <= 20){

    return {

      cls:"station-red",

      color:"#ef3d3d",

      text:"Nízka kapacita"

    };

  }


  if(percent <= 40){

    return {

      cls:"station-orange",

      color:"#f39a16",

      text:"Stredne nízka kapacita"

    };

  }


  if(percent <= 60){

    return {

      cls:"station-yellow",

      color:"#f1c40f",

      text:"Stredná kapacita"

    };

  }


  return {

    cls:"station-green",

    color:"#18a968",

    text:"Dobrá kapacita"

  };

}


/* =====================================================
   VÝPOČET ENERGIE
===================================================== */

const BATTERY_KWH = 7.5;

const EBIKE_KWH = 0.8;


/*
  Reálne využiteľná energia:
  počítame približne 90 % kvôli stratám.
*/

const usableKWh =
  BATTERY_KWH * 0.90;


function calculateBikes(percent){

  const available =
    usableKWh * (percent / 100);

  return available / EBIKE_KWH;

}


/* =====================================================
   VYTVORENIE IKONY
===================================================== */

function createStationIcon(status){

  return L.divIcon({

    className:"",

    html:

      '<div class="station-wrap">' +

        '<div class="station ' +
        status.cls +
        '">' +

          '<div class="station-pulse"></div>' +

          '<div class="station-panel"></div>' +

        '</div>' +

      '</div>',

    iconSize:[30,38],

    iconAnchor:[15,38],

    popupAnchor:[0,-35]

  });

}


/* =====================================================
   STANICE NA MAPE
===================================================== */

stations.forEach(function(data){

  const name = data[0];

  const lat = data[1];

  const lon = data[2];

  const percent = data[3];


  const status =
    getStatus(percent);


  const bikes =
    calculateBikes(percent);


  const roundedBikes =
    Math.max(
      0,
      Math.floor(bikes * 10) / 10
    );


  const availableKWh =
    Math.round(
      usableKWh *
      (percent / 100) *
      10
    ) / 10;


  const icon =
    createStationIcon(status);


  const popup = `

    <div class="popup">

      <div class="popup-title">
        ⚡ ebike-soltech
      </div>

      <div class="popup-location">
        📍 ${name}
      </div>

      <div class="status">

        <span class="status-dot"
              style="background:${status.color}">
        </span>

        ${status.text}

      </div>

      <div class="capacity-title">
        Aktuálne nabitie batérie stanice
      </div>

      <div class="capacity">
        ${percent} %
      </div>

      <div class="capacity-bar">

        <div
          class="capacity-fill"
          style="
            width:${percent}%;
            background:${status.color};
          "
        ></div>

      </div>


      <div class="info-grid">

        <div class="info-box">

          <strong>
            2,0 kWp
          </strong>

          <span>
            fotovoltický výkon
          </span>

        </div>


        <div class="info-box">

          <strong>
            7,5 kWh
          </strong>

          <span>
            kapacita batérie
          </span>

        </div>


        <div class="info-box">

          <strong>
            ${availableKWh} kWh
          </strong>

          <span>
            aktuálne dostupná energia
          </span>

        </div>


        <div class="info-box">

          <strong>
            ${roundedBikes}
          </strong>

          <span>
            približný počet 800 Wh nabití
          </span>

        </div>

      </div>


      <div class="energy">

        <strong>
          🔋 E-bike 800 Wh
        </strong>

        <span>
          Pri aktuálnom stave batérie je možné
          teoreticky nabiť približne
          <b>${roundedBikes} e-bike</b>
          s kapacitou 800 Wh.
          Výpočet počíta približne s 90 %
          využiteľnej energie.
        </span>

      </div>


      <a
        class="nav-button"
        target="_blank"
        rel="noopener"
        href="
          https://mapy.com/zakladni
          ?x=${lon}
          &y=${lat}
          &z=16
        "
      >
        ➤ Navigovať v Mapy.com
      </a>

    </div>

  `;


  L.marker(

    [lat,lon],

    {

      icon:icon,

      riseOnHover:true

    }

  )

  .addTo(map)

  .bindPopup(

    popup,

    {

      maxWidth:310,

      closeButton:true,

      autoPan:true,

      keepInView:true

    }

  );

});


/* =====================================================
   LEGENDA
===================================================== */

const legend =
  L.control({

    position:"bottomright"

  });


legend.onAdd =
  function(){

    const div =
      L.DomUtil.create(
        "div",
        "legend"
      );


    div.innerHTML = `

      <div class="legend-title">
        Stav nabitia stanice
      </div>

      <div class="legend-row">

        <span class="legend-dot red"></span>

        0–20 % – nízka

      </div>

      <div class="legend-row">

        <span class="legend-dot orange"></span>

        21–40 % – stredne nízka

      </div>

      <div class="legend-row">

        <span class="legend-dot yellow"></span>

        41–60 % – stredná

      </div>

      <div class="legend-row">

        <span class="legend-dot green"></span>

        61–100 % – dobrá

      </div>

    `;


    return div;

  };


legend.addTo(map);


/* =====================================================
   CENTROVANIE NA SLOVENSKO
===================================================== */

map.fitBounds(

  slovakia.map(function(point){

    return [
      point[0],
      point[1]
    ];

  }),

  {

    padding:[20,20]

  }

);


/* =====================================================
   PRI NAČÍTANÍ
===================================================== */

setTimeout(function(){

  map.invalidateSize();

  if(window.slovakiaMaskControl){

    window.slovakiaMaskControl.update();

  }

},500);


/* =====================================================
   OPRAVA MASKY PRI RESIZE
===================================================== */

window.addEventListener(

  "resize",

  function(){

    map.invalidateSize();

    setTimeout(function(){

      if(window.slovakiaMaskControl){

        window.slovakiaMaskControl.update();

      }

    },100);

  }

);

</script>

</body>
</html>
