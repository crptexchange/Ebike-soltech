<!doctype html>
<html lang="sk">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>ebike-soltech</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

*{
  box-sizing:border-box;
}

html,
body,
#app{
  height:100%;
  margin:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#eef3ef;
  color:#17372b;
  overflow:hidden;
}

#app{
  display:flex;
  flex-direction:column;
}


/* =========================
   HLAVIČKA
========================= */

.top{
  min-height:66px;
  background:#fff;

  display:flex;
  align-items:center;

  padding:
    10px
    18px;

  box-shadow:
    0 2px 14px #0002;

  z-index:1000;
}

.brand{
  font-size:20px;
  font-weight:900;
  line-height:1.1;
}

.brand small{
  display:block;

  font-size:10px;
  color:#77847e;

  font-weight:600;

  margin-top:4px;
}


/* =========================
   MAPA
========================= */

#map{
  flex:1;
  min-height:0;
  width:100%;
  background:#dfe4e1;
}

.leaflet-control-attribution{
  font-size:9px;
}


/* =========================
   VLÁJKA STANICE
========================= */

.station-pin{
  width:27px;
  height:34px;
  position:relative;

  filter:
    drop-shadow(0 2px 3px rgba(0,0,0,.28));
}

.station-pin:before{
  content:"";

  position:absolute;

  left:2px;
  top:1px;

  width:22px;
  height:22px;

  border:2.5px solid #fff;

  border-radius:
    50%
    50%
    50%
    0;

  transform:rotate(-45deg);
}

.station-pin span{
  position:absolute;

  z-index:2;

  left:0;
  top:4px;

  width:27px;

  text-align:center;

  color:#fff;

  font-size:11px;
  font-weight:900;
}


/* =========================
   FARBY STANÍC
========================= */

.station-red:before{
  background:#e53935;
}

.station-orange:before{
  background:#f39c12;
}

.station-green:before{
  background:#19a766;
}

.station-blue:before{
  background:#2777d4;
}


/* =========================
   POPUP
========================= */

.popup{
  min-width:250px;
}

.popup h3{
  margin:
    0
    0
    4px;

  font-size:17px;
}

.sub{
  color:#718079;
  font-size:12px;
}

.ok{
  color:#0d9d5a;
  font-weight:800;
  font-size:12px;

  margin:
    9px
    0;
}

.empty{
  color:#e53935;
  font-weight:900;
  font-size:12px;

  margin:
    9px
    0;
}

.low{
  color:#f39c12;
  font-weight:900;
  font-size:12px;

  margin:
    9px
    0;
}

.meter{
  height:8px;

  background:#e5ebe7;

  border-radius:8px;

  overflow:hidden;

  margin-top:5px;
}

.meter i{
  display:block;
  height:100%;
}

.meter-red{
  background:#e53935;
}

.meter-orange{
  background:#f39c12;
}

.meter-green{
  background:#19a766;
}

.meter-blue{
  background:#2777d4;
}

.stats{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:6px;

  margin-top:9px;
}

.stat{
  border:
    1px solid
    #e4e9e6;

  border-radius:9px;

  padding:7px;
}

.stat b{
  display:block;
  font-size:14px;
}

.stat small{
  color:#718079;
  font-size:10px;
}

.nav{
  display:block;

  text-align:center;

  margin-top:9px;

  padding:8px;

  background:#16a566;

  color:#fff;

  text-decoration:none;

  border-radius:9px;

  font-weight:800;
}


/* =========================
   LEGENDA
========================= */

.legend{
  background:#fff;

  padding:
    10px
    12px;

  border-radius:10px;

  box-shadow:
    0 2px 8px #0003;

  font-size:11px;

  line-height:18px;
}

.legend-title{
  font-weight:900;
  margin-bottom:4px;
}

.legend-row{
  display:flex;
  align-items:center;

  gap:6px;
}

.legend-dot{
  width:11px;
  height:11px;

  border-radius:50%;
}

.dot-red{
  background:#e53935;
}

.dot-orange{
  background:#f39c12;
}

.dot-green{
  background:#19a766;
}

.dot-blue{
  background:#2777d4;
}


/* =========================
   SLOVENSKO
========================= */

/*
  Toto je prekrytie všetkého,
  čo je MIMO Slovenska.

  Slovensko ostane priehľadné,
  takže mapa je viditeľná iba
  v hraniciach Slovenska.
*/

.slovakia-mask{
  pointer-events:none;
}


/* =========================
   HRANICA SLOVENSKA
========================= */

.slovakia-border{
  pointer-events:none;
}


/* =========================
   TRENČIANSKY KRAJ
========================= */

.trencin-region{
  pointer-events:none;
}

</style>

</head>


<body>

<div id="app">

  <div class="top">

    <div class="brand">

      ⚡ ebike-soltech

      <small>
        Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
      </small>

    </div>

  </div>

  <div id="map"></div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ============================================================
   MAPA
============================================================ */

const map = L.map("map",{

  zoomControl:true,

  minZoom:7,

  maxZoom:16,

  maxBoundsViscosity:1.0

});


/* ============================================================
   OPENSTREETMAP
============================================================ */

const tiles = L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:19,

    attribution:
      "© OpenStreetMap contributors"

  }

).addTo(map);


/* ============================================================
   SKUTOČNÝ OBVOD SLOVENSKA
============================================================ */

const SLOVAKIA_GEOJSON =
  "https://raw.githubusercontent.com/glynnbird/countriesgeojson/master/slovakia.geojson";


/* ============================================================
   STANICE
============================================================ */

const stations = [

  ["Trenčín",48.8945,18.044,0,8],

  ["Beckov",48.788,17.898,92,1],

  ["Nové Mesto nad Váhom",48.757,17.830,33,6],

  ["Myjava",48.758,17.568,82,1],

  ["Dubnica nad Váhom",48.961,18.167,64,5],

  ["Ilava",49.001,18.236,41,7],

  ["Púchov",49.124,18.325,0,8],

  ["Považská Bystrica",49.115,18.449,58,4],

  ["Trenčianske Teplice",48.910,18.168,56,4],

  ["Nemšová",48.967,18.119,17,7],

  ["Bánovce nad Bebravou",48.721,18.257,73,2],

  ["Bojnice",48.781,18.585,0,8],

  ["Partizánske",48.629,18.384,61,3],

  ["Brezová pod Bradlom",48.664,17.540,69,2],

  ["Čachtice",48.714,17.787,52,5],

  ["Duchonka",48.698,18.070,0,8],

  ["Manínska tiesňava",49.176,18.486,88,1],

  ["Stará Turá",48.778,17.695,45,5],

  ["Handlová",48.727,18.760,67,3],

  ["Inovec",48.810,18.030,84,1],

  ["Zelená Voda",48.760,17.988,12,7],

  ["Skalka",48.894,18.009,0,8],

  ["Lazy pod Makytou",49.221,18.234,54,4],

  ["Kľak",48.994,18.663,72,2]

];


/* ============================================================
   STATUS
============================================================ */

function getStatus(pct){

  if(pct === 0){

    return {

      marker:"station-red",
      meter:"meter-red"

    };

  }

  if(pct <= 20){

    return {

      marker:"station-orange",
      meter:"meter-orange"

    };

  }

  if(pct <= 70){

    return {

      marker:"station-green",
      meter:"meter-green"

    };

  }

  return {

    marker:"station-blue",
    meter:"meter-blue"

  };

}


/* ============================================================
   STANICE
============================================================ */

stations.forEach(function(d){

  const name = d[0];
  const lat = d[1];
  const lon = d[2];
  const pct = d[3];
  const occupied = d[4];

  const status = getStatus(pct);


  const icon = L.divIcon({

    className:"",

    html:

      '<div class="station-pin ' +

      status.marker +

      '">' +

      '<span>⚡</span>' +

      '</div>',

    iconSize:[
      27,
      34
    ],

    iconAnchor:[
      13,
      34
    ],

    popupAnchor:[
      0,
      -30
    ]

  });


  let statusHTML;


  if(pct === 0){

    statusHTML =

      '<div class="empty">' +

      '● STANICA JE ÚPLNE VYBITÁ' +

      '</div>';

  }

  else if(pct <= 20){

    statusHTML =

      '<div class="low">' +

      '● NÍZKA KAPACITA' +

      '</div>';

  }

  else{

    statusHTML =

      '<div class="ok">' +

      '● STANICA V PREVÁDZKE' +

      '</div>';

  }


  const full = `

    <div class="popup">

      <h3>
        ⚡ ebike-soltech
      </h3>

      <div class="sub">
        📍 ${name}
      </div>

      ${statusHTML}

      <b>
        Nabitá kapacita: ${pct}%
      </b>

      <div class="meter">

        <i
          class="${status.meter}"
          style="width:${pct}%">
        </i>

      </div>


      <div class="stats">

        <div class="stat">

          <b>
            ${occupied} / 8
          </b>

          <small>
            obsadené konektory
          </small>

        </div>


        <div class="stat">

          <b>
            ${pct === 0
              ? "0"
              : (pct / 25).toFixed(1)
            }
          </b>

          <small>
            ekvivalent plných e-bikov
          </small>

        </div>


        <div class="stat">

          <b>
            8×
          </b>

          <small>
            e-bike konektor
          </small>

        </div>


        <div class="stat">

          <b>
            1×
          </b>

          <small>
            230 V smartfón
          </small>

        </div>

      </div>


      <a

        class="nav"

        target="_blank"

        href=
        "https://mapy.com/zakladni?x=${lon}&y=${lat}&z=15"

      >

        ➤ Navigovať v Mapy.com

      </a>

    </div>

  `;


  L.marker(

    [
      lat,
      lon
    ],

    {
      icon:icon
    }

  )

  .addTo(map)

  .bindPopup(

    full,

    {
      maxWidth:310
    }

  );

});


/* ============================================================
   NAČÍTANIE SKUTOČNÉHO SLOVENSKA
============================================================ */

fetch(SLOVAKIA_GEOJSON)

.then(function(response){

  return response.json();

})

.then(function(data){

  const geometry =
    data.geometry;

  let rings;


  /*
    Slovensko je v tomto GeoJSON
    jeden Polygon.
  */

  if(geometry.type === "Polygon"){

    rings =
      geometry.coordinates;

  }

  else{

    rings =
      geometry.coordinates[0];

  }


  /*
    GeoJSON:
    [longitude, latitude]

    Leaflet:
    [latitude, longitude]
  */

  const slovakiaRing =
    rings[0].map(function(point){

      return [
        point[1],
        point[0]
      ];

    });


  /* ========================================================
     HRANICA SLOVENSKA
  ======================================================== */

  L.polygon(

    slovakiaRing,

    {

      className:
        "slovakia-border",

      color:"#ffffff",

      weight:3,

      opacity:1,

      fill:false,

      interactive:false

    }

  )

  .addTo(map);


  /* ========================================================
     TRENČIANSKY KRAJ
     
     Zámerne zostáva samostatne
     farebný.
  ======================================================== */

  const trencianskyKraj = [

    [49.32,17.94],
    [49.29,18.13],
    [49.30,18.34],
    [49.22,18.50],
    [49.10,18.61],
    [48.96,18.67],
    [48.80,18.70],
    [48.61,18.55],
    [48.51,18.36],
    [48.55,18.08],
    [48.56,17.78],
    [48.68,17.57],
    [48.82,17.51],
    [49.00,17.61],
    [49.16,17.75],
    [49.28,17.87],
    [49.32,17.94]

  ];


  L.polygon(

    trencianskyKraj,

    {

      className:
        "trencin-region",

      color:"#ffffff",

      weight:2.5,

      fillColor:"#20ad6a",

      fillOpacity:0.24,

      interactive:false

    }

  )

  .addTo(map);


  /* ========================================================
     MASKA – VŠETKO MIMO SLOVENSKA
     
     Toto je najdôležitejšia časť.
     
     Mapa Európy zostane pod tým,
     ale používateľ ju NEUVIDÍ.
     
     Viditeľné zostane iba Slovensko.
  ======================================================== */

  const outerRing = [

    [-90,-180],

    [-90,180],

    [90,180],

    [90,-180],

    [-90,-180]

  ];


  L.polygon(

    [
      outerRing,
      slovakiaRing
    ],

    {

      className:
        "slovakia-mask",

      stroke:false,

      color:"#d9ddda",

      fillColor:"#d9ddda",

      fillOpacity:1,

      interactive:false

    }

  )

  .addTo(map);


  /*
    Po pridaní masky musí byť hranica
    a Trenčiansky kraj NAD maskou.
  */

  /*
    Znovu vykreslíme hranicu
    nad maskou.
  */

  L.polygon(

    slovakiaRing,

    {

      color:"#ffffff",

      weight:3,

      fill:false,

      interactive:false

    }

  )

  .addTo(map);


  /*
    Znovu vykreslíme Trenčiansky kraj
    nad maskou.
  */

  L.polygon(

    trencianskyKraj,

    {

      color:"#ffffff",

      weight:2.5,

      fillColor:"#20ad6a",

      fillOpacity:0.24,

      interactive:false

    }

  )

  .addTo(map);


  /* ========================================================
     POVOLENÝ ROZSAH MAPY
  ======================================================== */

  const slovakiaBounds =
    L.geoJSON(data)
      .getBounds();


  map.setMaxBounds(

    slovakiaBounds.pad(0.015)

  );


  /*
    Slovensko sa zobrazí celé.
  */

  map.fitBounds(

    slovakiaBounds,

    {

      padding:[
        15,
        15
      ]

    }

  );


  /*
    Zabránime Leafletu,
    aby pri posúvaní išiel
    ďaleko mimo Slovenska.
  */

  map.on(

    "drag",

    function(){

      map.panInsideBounds(

        slovakiaBounds,

        {
          animate:false
        }

      );

    }

  );


  setTimeout(function(){

    map.invalidateSize();

  },300);


})

.catch(function(error){

  console.error(
    "Nepodarilo sa načítať hranicu Slovenska:",
    error
  );

});


/* ============================================================
   LEGENDA
============================================================ */

const legend =
  L.control({

    position:
      "bottomright"

  });


legend.onAdd =
function(){

  const div =
    L.DomUtil.create(
      "div",
      "legend"
    );


  div.innerHTML = `

    <div class="legend-title">
      Stav stanice
    </div>

    <div class="legend-row">

      <span class="legend-dot dot-red"></span>

      0 % – vybitá

    </div>

    <div class="legend-row">

      <span class="legend-dot dot-orange"></span>

      1–20 % – nízka

    </div>

    <div class="legend-row">

      <span class="legend-dot dot-green"></span>

      21–70 % – dostupná

    </div>

    <div class="legend-row">

      <span class="legend-dot dot-blue"></span>

      71–100 % – vysoká

    </div>

  `;


  return div;

};


legend.addTo(map);


/* ============================================================
   ZABEZPEČENIE PROTI ZVÄČŠOVANIU MIMO MAPY
============================================================ */

map.on(

  "zoomend",

  function(){

    const zoom =
      map.getZoom();

    if(zoom < 7){

      map.setZoom(7);

    }

  }

);

</script>

</body>
</html>
