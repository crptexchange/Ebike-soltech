<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ebike-soltech</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

html,
body,
#app {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

#app {
  display: flex;
  flex-direction: column;
  background: #fff;
}

/* HEADER */

.header {
  height: 112px;
  min-height: 112px;
  background: white;
  padding: 13px 22px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  z-index: 3000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
}

.logo-bolt {
  font-size: 38px;
  color: #ffb900;
  line-height: 1;
}

.logo-text {
  font-size: 32px;
  font-weight: 800;
  color: #153d31;
  letter-spacing: -1.4px;
}

.subtitle {
  margin-left: 3px;
  margin-top: 4px;
  color: #718078;
  font-size: 15px;
  font-weight: 600;
}

/* MAP */

#map {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #dfe4e1;
}

.leaflet-container {
  background: #dfe4e1;
  font-family: Arial, Helvetica, sans-serif;
}

.leaflet-top,
.leaflet-bottom {
  z-index: 10000 !important;
}

/* ZOOM */

.leaflet-control-zoom {
  border: 0 !important;
  box-shadow: 0 4px 14px rgba(0,0,0,.18) !important;
}

.leaflet-control-zoom a {
  width: 46px !important;
  height: 46px !important;
  line-height: 46px !important;
  font-size: 27px !important;
  color: #111 !important;
  background: #fff !important;
  border: 0 !important;
}

.leaflet-control-zoom a:first-child {
  border-radius: 8px 8px 0 0;
}

.leaflet-control-zoom a:last-child {
  border-radius: 0 0 8px 8px;
}

/* MAP LAYERS */

.map-mask-pane {
  z-index: 350;
  pointer-events: none;
}

.regions-pane {
  z-index: 450;
  pointer-events: none;
}

/*
   CELÉ SLOVENSKO = SIVÉ
   TRENČIANSKY KRAJ = ZELENÝ
*/

.region {
  stroke: #65716c;
  stroke-width: 1.6;
  fill: #b7bfbb;
  fill-opacity: 1;
}

.region-trencin {
  fill: #19a968;
  fill-opacity: .72;
  stroke: #173d31;
  stroke-width: 3;
}

.country-border {
  fill: none;
  stroke: #173d31;
  stroke-width: 3;
  opacity: 1;
  pointer-events: none;
}

/* STATIONS */

.station-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  border: 3px solid #fff;
  box-shadow: 0 3px 9px rgba(0,0,0,.30);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 16px;
  font-weight: 900;
  line-height: 1;
}

.station-icon.status-red {
  background: #ef3b38;
}

.station-icon.status-orange {
  background: #f49a13;
}

.station-icon.status-yellow {
  background: #f2c400;
}

.station-icon.status-green {
  background: #18a968;
}

/* POPUP */

.leaflet-popup-content-wrapper {
  border-radius: 18px !important;
  box-shadow: 0 10px 30px rgba(0,0,0,.22) !important;
}

.leaflet-popup-content {
  margin: 0 !important;
}

.leaflet-popup-tip {
  box-shadow: 0 3px 8px rgba(0,0,0,.08);
}

.station-popup {
  width: 300px;
  max-height: min(72vh,610px);
  overflow-y: auto;
  overflow-x: hidden;
  border-radius: 18px;
  background: #fff;
}

/* OBRÁZOK STANICE */

.popup-station-visual {
  display: block;
  width: 100%;
  height: 145px;
  background: linear-gradient(
    135deg,
    #173d31,
    #4e806d
  );
  overflow: hidden;
}

.station-visual-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.popup-content {
  padding: 14px 15px 15px;
}

.popup-title {
  font-size: 19px;
  font-weight: 800;
  color: #173d31;
  margin-bottom: 3px;
  line-height: 1.12;
}

.popup-location {
  font-size: 12px;
  color: #7a8781;
  margin-bottom: 10px;
}

.planned-badge {
  display: inline-block;
  background: #eef7f2;
  color: #18764e;
  border-radius: 999px;
  padding: 5px 8px;
  font-size: 10px;
  font-weight: 800;
  margin-bottom: 10px;
}

/* STAV */

.status-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f4f7f5;
  border-radius: 11px;
  padding: 9px 10px;
  margin-bottom: 10px;
}

.status-left {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #64736c;
  font-size: 12px;
  font-weight: 700;
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.status-number {
  font-size: 15px;
  font-weight: 900;
  color: #173d31;
}

.progress {
  height: 8px;
  background: #e9eeeb;
  border-radius: 10px;
  overflow: hidden;
  margin: -2px 0 12px;
}

.progress-inner {
  height: 100%;
  border-radius: 10px;
}

/* INFO */

.popup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 12px;
}

.info-box {
  background: #f4f7f5;
  border-radius: 9px;
  padding: 8px;
}

.info-label {
  font-size: 10px;
  color: #7a8781;
}

.info-value {
  font-size: 13px;
  font-weight: 800;
  color: #173d31;
  margin-top: 2px;
}

/* BUTTONS */

.nav-button,
.location-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  text-decoration: none;
  border-radius: 10px;
  font-weight: 800;
  cursor: pointer;
}

.nav-button {
  background: #173d31;
  color: #fff;
  padding: 11px;
  font-size: 13px;
}

.location-button {
  background: #eaf0ed;
  color: #173d31;
  padding: 9px;
  font-size: 12px;
  margin-top: 7px;
}

/* LOADING */

.loading {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  background: #fff;
  padding: 14px 18px;
  border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.15);
  z-index: 5000;
  color: #173d31;
  font-weight: 700;
  font-size: 13px;
}

.error {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: min(90%,420px);
  background: #fff;
  padding: 22px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.16);
  z-index: 5000;
  color: #173d31;
}

/* MOBILE */

@media(max-width:600px) {

  .header {
    height: 106px;
    min-height: 106px;
    padding: 11px 18px;
  }

  .logo-bolt {
    font-size: 33px;
  }

  .logo-text {
    font-size: 27px;
  }

  .subtitle {
    font-size: 13px;
  }

  .station-popup {
    width: 285px;
    max-height: 70vh;
  }

  .popup-station-visual {
    height: 132px;
  }
}
</style>
</head>

<body>

<div id="app">

<header class="header">

  <div class="logo">

    <div class="logo-bolt">
      ϟ
    </div>

    <div class="logo-text">
      ebike-soltech
    </div>

  </div>

  <div class="subtitle">
    Interaktívna sieť nabíjacích staníc • Trenčiansky kraj
  </div>

</header>


<div id="map">

  <div id="loading" class="loading">
    Načítavam mapu…
  </div>

  <div id="error" class="error">

    <b>
      Nepodarilo sa načítať hranice Slovenska.
    </b>

    <br><br>

    Skús obnoviť stránku.

  </div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==========================================================
   MAPY.COM
========================================================== */

const MAPY_API_KEY =
"Ld1wDiRmzkSKYG09mz9BiWl-ti-D2b_eEGv4i9eoBe";


/* ==========================================================
   MAP SETTINGS
========================================================== */

const SLOVAKIA_CENTER = [
  48.72,
  19.48
];

const SLOVAKIA_BOUNDS = [
  [47.70,16.80],
  [49.65,22.60]
];


/* ==========================================================
   GEO DATA
========================================================== */

/*
   SK022 = Trenčiansky kraj
*/

const NUTS_URL =
"https://raw.githubusercontent.com/eurostat/Nuts2json/master/pub/v2/2024/4326/20M/nutsrg_3.json";

const COUNTRY_URL =
"https://raw.githubusercontent.com/eurostat/Nuts2json/master/pub/v2/2024/4326/20M/nutsrg_0.json";


/* ==========================================================
   MAP
========================================================== */

const map =
L.map(
  "map",
  {

    center:
      SLOVAKIA_CENTER,

    zoom:
      7.55,

    minZoom:
      7.15,

    maxZoom:
      19,

    maxBounds:
      SLOVAKIA_BOUNDS,

    maxBoundsViscosity:
      1,

    zoomControl:
      true,

    worldCopyJump:
      false,

    attributionControl:
      true,

    tap:
      true,

    closePopupOnClick:
      true

  }
);


/* ==========================================================
   MAPY.COM TILE
========================================================== */

const mapyUrl =
"https://api.mapy.com/v1/maptiles/outdoor/256/{z}/{x}/{y}?apikey=" +
encodeURIComponent(
  MAPY_API_KEY
) +
"&lang=sk";


L.tileLayer(
  mapyUrl,
  {

    minZoom:
      0,

    maxZoom:
      19,

    tileSize:
      256,

    noWrap:
      true,

    updateWhenIdle:
      true,

    updateWhenZooming:
      false,

    keepBuffer:
      2,

    attribution:
      '<a href="https://mapy.com/" target="_blank">Mapy.com</a> © Seznam.cz a ďalší'

  }
).addTo(map);


/* ==========================================================
   CUSTOM PANES
========================================================== */

const maskPane =
map.createPane(
  "mapMaskPane"
);

maskPane.style.zIndex =
350;

maskPane.style.pointerEvents =
"none";


const regionsPane =
map.createPane(
  "regionsPane"
);

regionsPane.style.zIndex =
450;

regionsPane.style.pointerEvents =
"none";


/* ==========================================================
   ZAKRYTIE MAPY
========================================================== */

/*
   Celý podklad prekryjeme sivou plochou.

   Výsledok:
   - mapa Európy nebude viditeľná
   - názvy okolitých krajín nebudú viditeľné
   - Slovensko bude sivé
   - Trenčiansky kraj sa následne vykreslí farebne
*/

L.rectangle(
  [
    [-90,-180],
    [90,180]
  ],
  {

    pane:
      "mapMaskPane",

    stroke:
      false,

    fillColor:
      "#dfe4e1",

    fillOpacity:
      1,

    interactive:
      false

  }
).addTo(map);


/* ==========================================================
   STATIONS
========================================================== */

const cities = [

  ["Trenčín",48.8945,18.0444],
  ["Dubnica nad Váhom",48.9597,18.1663],
  ["Ilava",49.0000,18.2350],
  ["Púchov",49.1240,18.3258],
  ["Považská Bystrica",49.1150,18.4480],
  ["Bytča",49.2240,18.5580],
  ["Bojnice",48.7780,18.5850],
  ["Prievidza",48.7740,18.6270],
  ["Handlová",48.7270,18.7600],
  ["Partizánske",48.6280,18.3840],
  ["Bánovce nad Bebravou",48.7210,18.2580],
  ["Nové Mesto nad Váhom",48.7570,17.8300],
  ["Beckov",48.7890,17.8960],
  ["Trenčianske Teplice",48.9100,18.1680],
  ["Nemšová",48.9670,18.1180],
  ["Stará Turá",48.7770,17.6940],
  ["Myjava",48.7580,17.5680],
  ["Skalka nad Váhom",48.8870,18.0200],
  ["Čachtice",48.7130,17.7860],
  ["Lednica",49.1530,18.2870]

];


const offsets = [

  [0,0],
  [.010,.014],
  [-.009,.012],
  [.007,-.025],
  [-.013,-.022],
  [.015,-.006]

];


const percentPattern = [
  78,
  64,
  54,
  37,
  82,
  68
];


const stations = [];

let stationId =
1;


cities.forEach(
  (city, cityIndex) => {

    offsets.forEach(
      (offset, index) => {

        stations.push({

          id:
            stationId++,

          name:
            "E-BIKE POINT " +
            city[0] +
            (
              index === 0
                ? ""
                : " " + (index + 1)
            ),

          city:
            city[0],

          lat:
            +(city[1] + offset[0]).toFixed(4),

          lng:
            +(city[2] + offset[1]).toFixed(4),

          percent:
            percentPattern[
              (cityIndex * 3 + index) % 6
            ],

          solar:
            [2.0,2.2,2.4,2.5]
            [(cityIndex + index) % 4],

          battery:
            [8,10,12]
            [(cityIndex + index) % 3],

          ports:
            6,

          planned:
            true

        });

      }
    );

  }
);


/* ==========================================================
   STATUS
========================================================== */

function statusClass(
  percent
) {

  if (
    percent <= 20
  ) {
    return "status-red";
  }

  if (
    percent <= 40
  ) {
    return "status-orange";
  }

  if (
    percent <= 60
  ) {
    return "status-yellow";
  }

  return "status-green";

}


function statusText(
  percent
) {

  if (
    percent <= 20
  ) {
    return "kritická";
  }

  if (
    percent <= 40
  ) {
    return "nízka";
  }

  if (
    percent <= 60
  ) {
    return "stredná";
  }

  return "dobrá";

}


/* ==========================================================
   POPUP
========================================================== */

function popupHtml(
  station
) {

  const status =
    statusClass(
      station.percent
    );


  const navigationUrl =
    "https://mapy.com/fnc/v1/route?end=" +
    encodeURIComponent(
      station.lng +
      "," +
      station.lat
    ) +
    "&routeType=bike_mountain&navigate=true";


  const locationUrl =
    "https://mapy.com/fnc/v1/showmap?mapset=outdoor&center=" +
    encodeURIComponent(
      station.lng +
      "," +
      station.lat
    ) +
    "&zoom=16&marker=true";


  const currentCharges =
    Math.max(
      1,
      Math.floor(
        (
          station.battery *
          1000 *
          station.percent /
          100
        ) /
        800
      )
    );


  return `

  <div class="station-popup">

    <div
      class="popup-station-visual"
      aria-label="Ilustračný návrh nabíjacej stanice"
    >

      <svg
        class="station-visual-svg"
        viewBox="0 0 600 290"
        xmlns="http://www.w3.org/2000/svg"
      >

        <rect
          width="600"
          height="290"
          fill="#edf3ef"
        />

        <rect
          y="205"
          width="600"
          height="85"
          fill="#cbd8d1"
        />

        <path
          d="M70 205 L180 140 L520 140 L575 205 Z"
          fill="#173d31"
        />

        <path
          d="M95 198 L195 151 L500 151 L548 198 Z"
          fill="#263f36"
        />

        <g
          stroke="#8fd0b1"
          stroke-width="3"
          fill="#6da88e"
        >

          <rect x="215" y="157" width="48" height="28"/>
          <rect x="268" y="157" width="48" height="28"/>
          <rect x="321" y="157" width="48" height="28"/>
          <rect x="374" y="157" width="48" height="28"/>

        </g>

        <rect
          x="185"
          y="198"
          width="12"
          height="70"
          rx="4"
          fill="#173d31"
        />

        <rect
          x="468"
          y="198"
          width="12"
          height="70"
          rx="4"
          fill="#173d31"
        />

        <rect
          x="270"
          y="201"
          width="62"
          height="67"
          rx="8"
          fill="#fff"
          stroke="#173d31"
          stroke-width="4"
        />

        <rect
          x="281"
          y="213"
          width="40"
          height="12"
          rx="4"
          fill="#19a968"
        />

        <text
          x="301"
          y="252"
          text-anchor="middle"
          font-size="25"
          font-weight="900"
          fill="#173d31"
        >
          ⚡
        </text>

        <path
          d="M165 267 C175 239 200 230 219 267
             M381 267 C391 239 416 230 435 267"
          fill="none"
          stroke="#173d31"
          stroke-width="5"
        />

        <circle
          cx="190"
          cy="246"
          r="15"
          fill="#fff"
          stroke="#173d31"
          stroke-width="4"
        />

        <circle
          cx="407"
          cy="246"
          r="15"
          fill="#fff"
          stroke="#173d31"
          stroke-width="4"
        />

        <text
          x="18"
          y="30"
          font-family="Arial"
          font-size="18"
          font-weight="800"
          fill="#173d31"
        >
          E-BIKE SOLTECH
        </text>

        <text
          x="18"
          y="53"
          font-family="Arial"
          font-size="12"
          fill="#587066"
        >
          Ilustračný návrh nabíjacej stanice
        </text>

      </svg>

    </div>


    <div class="popup-content">

      <div class="popup-title">
        ⚡ ${station.name}
      </div>


      <div class="popup-location">
        📍 ${station.city}, Trenčiansky kraj
      </div>


      <div class="planned-badge">
        PLÁNOVANÁ LOKALITA SIETE
      </div>


      <div class="status-box">

        <div class="status-left">

          <span
            class="status-dot ${status}"
          ></span>

          Stav stanice ·
          ${statusText(station.percent)}

        </div>

        <div class="status-number">
          ${station.percent} %
        </div>

      </div>


      <div class="progress">

        <div
          class="progress-inner ${status}"
          style="width:${station.percent}%"
        ></div>

      </div>


      <div class="popup-grid">

        <div class="info-box">

          <div class="info-label">
            FVE výkon
          </div>

          <div class="info-value">
            ${station.solar} kWp
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            Batéria
          </div>

          <div class="info-value">
            ${station.battery} kWh
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            Nabíjacie porty
          </div>

          <div class="info-value">
            ${station.ports}
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            Aktuálne nabitia
          </div>

          <div class="info-value">
            cca ${currentCharges}
          </div>

        </div>

      </div>


      <a
        class="nav-button"
        href="${navigationUrl}"
        target="_blank"
        rel="noopener"
      >
        🧭 NAVIGOVAŤ K STANICI
      </a>


      <a
        class="location-button"
        href="${locationUrl}"
        target="_blank"
        rel="noopener"
      >
        📍 Zobraziť presnú lokalitu
      </a>

    </div>

  </div>

  `;

}


/* ==========================================================
   MARKERS
========================================================== */

const markerLayer =
L.layerGroup().addTo(
  map
);


function createMarker(
  station
) {

  const icon =
    L.divIcon({

      className:
        "",

      html:

        `<div class="station-icon ${
          statusClass(
            station.percent
          )
        }">⚡</div>`,

      iconSize:
        [30,30],

      iconAnchor:
        [15,15],

      popupAnchor:
        [0,-13]

    });


  const marker =
    L.marker(
      [
        station.lat,
        station.lng
      ],
      {

        icon:
          icon,

        keyboard:
          true,

        riseOnHover:
          true,

        zIndexOffset:
          1000

      }
    );


  marker.bindPopup(
    popupHtml(
      station
    ),
    {

      maxWidth:
        310,

      minWidth:
        285,

      closeButton:
        true,

      /*
         AUTO PAN VYPNUTÝ.
         Popup teda nebude hýbať mapou.
      */

      autoPan:
        false,

      keepInView:
        false

    }
  );


  return marker;

}


stations.forEach(
  station => {

    markerLayer.addLayer(
      createMarker(
        station
      )
    );

  }
);


/* ==========================================================
   REGIONS
========================================================== */

function styleRegion(
  feature
) {

  const id =
    feature.properties &&
    feature.properties.id;


  const isTrencin =
    id === "SK022";


  return {

    fillColor:
      isTrencin
        ? "#19a968"
        : "#b7bfbb",

    fillOpacity:
      isTrencin
        ? .72
        : 1,

    color:
      isTrencin
        ? "#173d31"
        : "#65716c",

    weight:
      isTrencin
        ? 3
        : 1.6,

    opacity:
      1

  };

}


/* ==========================================================
   LOAD MAP BOUNDARIES
========================================================== */

Promise.all(

  [

    fetch(
      NUTS_URL
    )
    .then(
      response => {

        if (
          !response.ok
        ) {

          throw new Error(
            "NUTS HTTP " +
            response.status
          );

        }

        return response.json();

      }
    ),

    fetch(
      COUNTRY_URL
    )
    .then(
      response => {

        if (
          !response.ok
        ) {

          throw new Error(
            "Country HTTP " +
            response.status
          );

        }

        return response.json();

      }
    )

  ]

)

.then(
  ([nuts,countries]) => {

    const slovakRegions = {

      type:
        "FeatureCollection",

      features:
        nuts.features.filter(
          feature => {

            return (
              feature.properties &&
              /^SK/.test(
                feature.properties.id
              )
            );

          }
        )

    };


    const slovakiaFeature =
      countries.features.find(
        feature => {

          return (
            feature.properties &&
            feature.properties.id === "SK"
          );

        }
      );


    if (
      !slovakiaFeature
    ) {

      throw new Error(
        "SK country geometry missing"
      );

    }


    /*
       KRAJE
    */

    L.geoJSON(
      slovakRegions,
      {

        pane:
          "regionsPane",

        style:
          styleRegion,

        interactive:
          false

      }
    ).addTo(
      map
    );


    /*
       HRANICA SLOVENSKA
    */

    L.geoJSON(
      slovakiaFeature,
      {

        pane:
          "regionsPane",

        style:
          {

            fill:
              false,

            color:
              "#173d31",

            weight:
              3,

            opacity:
              1

          },

        interactive:
          false

      }
    ).addTo(
      map
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    /*
       Nastavíme Slovensko do stredu.
    */

    map.fitBounds(
      L.geoJSON(
        slovakiaFeature
      ).getBounds(),
      {

        padding:
          [15,15]

      }
    );


    if (
      map.getZoom() < 7.35
    ) {

      map.setZoom(
        7.35
      );

    }

  }
)

.catch(
  error => {

    console.error(
      error
    );

    document.getElementById(
      "loading"
    ).style.display =
      "none";

    document.getElementById(
      "error"
    ).style.display =
      "block";

  }
);


/* ==========================================================
   POPUP / ZOOM
========================================================== */

/*
   Pri zoomovaní zavrieme popup.
   Potom sa dá normálne oddialiť aj priblížiť.
*/

map.on(
  "zoomstart",
  function() {

    if (
      map._popup
    ) {

      map.closePopup();

    }

  }
);


map.on(
  "popupopen",
  function() {

    setTimeout(
      function() {

        map.invalidateSize();

      },
      50
    );

  }
);


window.addEventListener(
  "resize",
  function() {

    map.invalidateSize();

  }
);

</script>

</body>
</html>
