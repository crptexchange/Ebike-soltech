  height:23px;

  border:2px solid #ffffff;

  position:relative;

  overflow:hidden;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.10);
}


/* malé FV články */

.station-panel::before{

  content:"";

  position:absolute;

  inset:3px;

  background:

    linear-gradient(
      90deg,
      rgba(255,255,255,.22) 1px,
      transparent 1px
    ),

    linear-gradient(
      0deg,
      rgba(255,255,255,.22) 1px,
      transparent 1px
    );

  background-size:
    6px 6px;

  opacity:.8;
}


/* blesk */

.station-lightning{

  position:absolute;

  z-index:5;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-53%);

  color:#fff;

  font-size:15px;

  font-weight:900;

  text-shadow:

.station-yellow .station-panel{

.station-green .station-panel{

/* =========================================================
   JEMNÁ ANIMÁCIA STANÍC
========================================================= */

.station-marker{
  animation:
    stationFloat 3.5s ease-in-out infinite;
}

  0%{

      translateY(0)
      rotate(-3deg);
  }

  50%{
    transform:
      translateY(-2px)
      rotate(-1deg);
  }

  100%{
    transform:
      translateY(0)
      rotate(-3deg);
  }

"#cbd0ce";


const TRENCIAN_REGION_COLOR =

/* =========================================================
   VYTVORENIE MASKY MIMO SLOVENSKA
========================================================= */

function createOutsideMask(slovakia){

  const geometry =
    slovakia.features[0].geometry;

  let countryRing;

  if(
    geometry.type === "Polygon"
  ){

    countryRing =
      geometry.coordinates[0];

  }

  else if(
    geometry.type === "MultiPolygon"
  ){

    countryRing =
      geometry.coordinates
        .sort(
          (a,b)=>
            b[0].length-a[0].length
        )[0][0];

  }

  else{

    return;

  }


  /*
    Veľký obdĺžnik okolo celej oblasti.
    Slovensko je diera.
  */

  const worldRing = [

    [ -180, 90 ],

    [ 180, 90 ],

    [ 180, -90 ],

    [ -180, -90 ],

    [ -180, 90 ]

  ];


  const mask = L.polygon(

    [

      worldRing,

      countryRing.map(
        p => [p[1],p[0]]
      )

    ],

    {

      pane:"outsideMask",

      stroke:false,

      fillColor:"#d7dcda",

      fillOpacity:1,

      fillRule:"evenodd",

      interactive:false

    }

  );


  mask.addTo(map);

}


/* =========================================================
   KRAJE
========================================================= */

function loadRegions(){

  fetch(regionsURL)

    .then(
      response=>{

        if(!response.ok){
          throw new Error(
            "Kraje sa nepodarilo načítať."
          );
        }

        return response.json();

      }
    )

    .then(
      data=>{

        L.geoJSON(

          data,

          {

            pane:"regionsPane",

            interactive:false,

            style:function(feature){

              const props =
                feature.properties || {};

              const text =
                JSON.stringify(props)
                  .toLowerCase();

              const isTrencin =
                text.includes("tren");

              return {

                color:"#ffffff",

                weight:
                  isTrencin ? 2.5 : 1.5,

                opacity:1,

                fillColor:
                  isTrencin
                    ? TRENCIAN_REGION_COLOR
                    : OTHER_REGION_COLOR,

                fillOpacity:
                  isTrencin
                    ? .55
                    : .92

              };

            }

          }

        ).addTo(map);

      }

    )

    .catch(
      error=>{
        console.error(error);
      }
    );

}

function calculateCharges(batteryKwh){

  /*
    Priemerná kapacita e-bike:
    800 Wh = 0.8 kWh

    Používame približný využiteľný obsah
    batérie stanice 90 %.
  */

  const usable =
    batteryKwh * 0.90;

  return Math.floor(
    usable / 0.8
  );

}

          E-BIKE POINT ${station.name}
        </div>

      </div>


      <div class="station-body">


        <div class="station-location">

          📍 ${station.name}

        </div>


        <div class="status-line">

          <span>
            ${status.label}
          </span>

          <span class="status-value"
                style="color:${status.color}">

            ${station.pct} %

          </span>

        </div>


        <div class="capacity-meter">

          <span
            style="
              width:${station.pct}%;
              background:${status.color};
            "
          ></span>

        </div>


        <div class="station-grid">


          <div class="station-stat">

            <strong>
              ${station.solar} kWp
            </strong>

            <small>
              fotovoltický výkon
            </small>

          </div>


          <div class="station-stat">

            <strong>
              ${station.battery} kWh
            </strong>

            <small>
              kapacita batérie
            </small>

          </div>


          <div class="station-stat">

            <strong>
              ${availableEnergy} kWh
            </strong>

            <small>
              aktuálne dostupné
            </small>

          </div>


          <div class="station-stat">

            <strong>
              cca ${charges}
            </strong>

            <small>
              plných e-bike nabití
            </small>

          </div>


          <div class="station-stat">

            <strong>
              ${occupied} / 8
            </strong>

            <small>
              obsadené konektory
            </small>

          </div>


          <div class="station-stat">

            <strong>
              ${free}
            </strong>

            <small>
              voľné konektory
            </small>

          </div>


        </div>


        <a

          class="navigate-btn"

          target="_blank"

          href="https://mapy.com/fnc/v1/showmap?mapset=outdoor&center=${station.lon},${station.lat}&zoom=15&marker=true"

        >

          ➤ Navigovať na stanicu

        </a>


      </div>

    </div>

  `;

}


/* =========================================================
   VYKRESLENIE STANÍC
========================================================= */

function addStations(){

  stations.forEach(

    station=>{

      const marker =
        L.marker(

          [
            station.lat,
            station.lon
          ],

          {

            icon:
              createStationIcon(
                station
              ),

            pane:"stationsPane",

            keyboard:true

          }

        );


      marker

        .addTo(map)

        .bindPopup(

          createPopup(
            station
          ),

          {

            maxWidth:320,

            minWidth:280,

            closeButton:true,

            autoPan:true,

            autoPanPadding:
              [20,20]

          }

        );

    }

  );

}


/* =========================================================
   LEGENDA
========================================================= */

const legend =
  L.control(
    {
      position:"bottomright"
    }
  );


legend.onAdd =
  function(){

    const div =
      L.DomUtil.create(
        "div",
        "legend"
      );


    div.innerHTML = `

      <div class="legend-title">
        Stav stanice
      </div>


      <div class="legend-row">

        <span class="legend-dot red"></span>

        <span>
          0–20 % – kritická
        </span>

      </div>


      <div class="legend-row">

        <span class="legend-dot orange"></span>

        <span>
          21–40 % – nízka
        </span>

      </div>


      <div class="legend-row">

        <span class="legend-dot yellow"></span>

        <span>
          41–60 % – stredná
        </span>

      </div>


      <div class="legend-row">

        <span class="legend-dot green"></span>

        <span>
          61–100 % – dobrá
        </span>

      </div>

    `;


    return div;

  };


legend.addTo(map);


/* =========================================================
   NAČÍTANIE
========================================================= */

Promise.all(

  [

    fetch(
      slovakiaURL
    ).then(
      response=>{

        if(!response.ok){

          throw new Error(
            "Slovensko sa nepodarilo načítať."
          );

        }

        return response.json();

      }
    ),

    fetch(
      regionsURL
    ).then(
      response=>{

        if(!response.ok){

          throw new Error(
            "Kraje sa nepodarilo načítať."
          );

        }

        return response.json();

      }
    )

  ]

)

.then(

  ([slovakia,regions])=>{


    /* Maska mimo Slovenska */

    createOutsideMask(
      slovakia
    );


    /* Kraje */

    L.geoJSON(

      regions,

      {

        pane:"regionsPane",

        interactive:false,

        style:function(feature){

          const props =
            feature.properties || {};

          const text =
            JSON.stringify(props)
              .toLowerCase();


          const isTrencin =
            text.includes("tren");


          return {

            color:"#ffffff",

            weight:
              isTrencin
                ? 2.5
                : 1.4,

            opacity:1,

            fillColor:
              isTrencin
                ? TRENCIAN_REGION_COLOR
                : OTHER_REGION_COLOR,

            fillOpacity:
              isTrencin
                ? .52
                : .90

          };

        }

      }

    ).addTo(map);


    /* Stanice */

    addStations();


    /* Slovensko sa zobrazí celé */

    const countryLayer =
      L.geoJSON(
        slovakia
      );


    map.fitBounds(
      countryLayer.getBounds(),
      {
        padding:
          [20,20]
      }
    );


    /* mierne priblíženie */

    map.setZoom(
      Math.max(
        map.getZoom(),
        8
      )
    );


    /* načítané */

    const loading =
      document.getElementById(
        "loading"
      );


    loading.style.opacity="0";


    setTimeout(
      ()=>{
        loading.style.display="none";
      },
      400
    );


  }

)

.catch(

  error=>{

    console.error(
      error
    );


    const loading =
      document.getElementById(
        "loading"
      );


    loading.innerHTML = `

      <div class="loading-box">

        <div class="loading-icon">
          ⚠️
        </div>

        <div class="loading-title">
          Mapu sa nepodarilo načítať
        </div>

        <div class="loading-sub">
          Skontroluj API kľúč Mapy.com
          a jeho Referrer nastavenie.
        </div>

      </div>

    `;

  }

);


/* =========================================================
   OPRAVA VEĽKOSTI MAPY PO OTVORENÍ
========================================================= */

setTimeout(

  ()=>{

    map.invalidateSize(
      true
    );

  },

  500

);


setTimeout(

  ()=>{

    map.invalidateSize(
      true
    );

  },

  1500

);


/* =========================================================
   PRI ZMENE VEĽKOSTI OKNA
========================================================= */

window.addEventListener(

  "resize",

  ()=>{

    map.invalidateSize(
      true
    );

  }

);

</script>
